<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt — Discover. Collect. Repeat.</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#29213e;background:#ece8f5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app{max-width:450px;min-height:100vh;margin:auto;background:#faf8ff;padding-bottom:90px}.hero{padding:25px 22px;background:linear-gradient(130deg,#7044ee,#a36aff);color:white;border-radius:0 0 28px 28px}.brand{font-size:25px;font-weight:900}.brand b{color:#ffd34e}.hero h1{font-size:27px;line-height:1.12}.search{background:white;color:#333;border-radius:14px;padding:11px 14px;width:100%;border:0}main{padding:20px}.card{background:white;border:1px solid #e8e3f2;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 15px #29213e08}.merchant{display:flex;gap:14px;align-items:center;text-align:left;width:100%}.emoji{font-size:38px;background:#f3eafd;width:70px;height:70px;display:grid;place-items:center;border-radius:13px;flex:none}.muted{color:#777187;font-size:13px}.pill{display:inline-block;background:#f0eaff;color:#6e45d9;padding:7px 10px;border-radius:30px;font-size:12px;font-weight:bold}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button{border:0;padding:8px 12px;border-radius:30px;background:#eee9f8;white-space:nowrap}.tabs .active{background:#7044ee;color:white}.btn{background:#7044ee;border:0;color:white;border-radius:12px;padding:12px 16px;font-weight:750}.btn:disabled{background:#aaa}.wide{width:100%}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:450px;width:100%;background:white;display:flex;justify-content:space-around;border-top:1px solid #e5deef;padding:10px 2px 14px}nav button{border:0;background:transparent;font-size:11px;color:#6e6680;display:grid;gap:3px;place-items:center}nav button.selected{color:#7044ee;font-weight:850}nav span{font-size:22px}h2{font-size:21px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.stamp{display:flex;gap:7px;margin:15px 0}.stamp span{width:40px;height:40px;border:2px dashed #baa6ed;border-radius:50%;display:grid;place-items:center}.stamp .filled{background:#7044ee;color:white;border-color:#7044ee}.notice{background:#fff7df;padding:12px;border-radius:12px;font-size:13px;margin:10px 0}.back{background:transparent;border:0;color:#7044ee;font-weight:700;padding:0}footer{text-align:center;font-size:12px;color:#898099;padding:20px}</style></head><body><div class="app"><div id="top"></div><main id="main"></main><footer>BizHunt • Prototype only • All merchants are fictional</footer></div><nav id="nav"></nav><script>
const merchants=[{id:1,name:"Brew & Bloom Café",category:"Cafés",place:"Balibago, Angeles City",icon:"☕",reward:"Free iced latte",goal:5},{id:2,name:"Kapampangan Kitchen",category:"Restaurants",place:"San Fernando, Pampanga",icon:"🍲",reward:"Free dessert",goal:5},{id:3,name:"Glow Up Studio",category:"Beauty",place:"Clark Freeport Zone",icon:"💅",reward:"₱200 service discount",goal:5},{id:4,name:"Pan de Pampanga",category:"Bakery",place:"Magalang, Pampanga",icon:"🥐",reward:"Free pastry box",goal:5},{id:5,name:"Active Hub",category:"Fitness",place:"Mabalacat City",icon:"🏃",reward:"Free day pass",goal:5}];
const KEY="bizhunt-v1";let state;try{state=JSON.parse(localStorage.getItem(KEY))||{points:120,stamps:{1:2},history:[]}}catch{state={points:120,stamps:{1:2},history:[]}}let page="discover",category="All",search="",selected=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function count(m){return state.stamps[m.id]||0}function card(m){return '<button class="card merchant" data-merchant="'+m.id+'"><span class="emoji">'+m.icon+'</span><span><strong>'+m.name+'</strong><div class="muted">📍 '+m.place+'</div><div class="pill">'+count(m)+'/'+m.goal+' stamps · '+m.reward+'</div></span></button>'}function header(){return '<header class="hero"><div class="brand">Biz<b>Hunt</b> ✦</div><p>Hello, Hunter! 👋</p><h1>Explore local.<br>Earn big.</h1></header>'}function render(){let body="";if(selected){let m=merchants.find(x=>x.id===selected);body='<button class="back" id="back">← Back</button><h2>'+m.icon+' '+m.name+'</h2><p class="muted">📍 '+m.place+' · '+m.category+'</p><div class="card"><strong>Collect stamps, unlock rewards!</strong><p>🎁 '+m.reward+'</p><div class="stamp">'+Array.from({length:m.goal},(_,i)=>'<span class="'+(i<count(m)?"filled":"")+'">'+(i<count(m)?"✓":"☆")+'</span>').join("")+'</div><p>'+count(m)+' of '+m.goal+' stamps collected</p><button class="btn wide" id="collect">Simulate visit · Get 1 stamp</button>'+(count(m)>=m.goal?'<button class="btn wide" id="redeem" style="margin-top:10px;background:#16a77e">Redeem reward 🎁</button>':"")+'</div><div class="notice">Demo only: visiting and reward redemption are simulated. No real merchant benefits are issued.</div>'}else if(page==="discover"){body='<div class="row"><h2>Discover Pampanga 💜</h2><span class="pill">✨ '+state.points+' pts</span></div><input class="search" id="search" placeholder="🔍 Search businesses..." value="'+search.replace(/"/g,"&quot;")+'"><div class="tabs">'+["All","Cafés","Restaurants","Beauty","Bakery","Fitness"].map(c=>'<button data-category="'+c+'" class="'+(category===c?"active":"")+'">'+c+'</button>').join("")+'</div><p class="muted">Find local favorites and start collecting.</p>'+merchants.filter(m=>(category==="All"||m.category===category)&&m.name.toLowerCase().includes(search.toLowerCase())).map(card).join("")}else if(page==="wallet"){body='<h2>My Loyalty Cards 🪪</h2><p class="muted">Your stamps across Pampanga.</p>'+merchants.map(card).join("")}else if(page==="rewards"){body='<h2>Rewards 🎁</h2><p class="muted">Collect 5 stamps at each merchant to redeem.</p>'+merchants.map(m=>'<div class="card"><div class="row"><strong>'+m.icon+' '+m.reward+'</strong><span class="pill">'+count(m)+'/5</span></div><p class="muted">'+m.name+'</p><button class="btn" data-merchant="'+m.id+'">'+(count(m)>=5?"Redeem now":"View loyalty card")+'</button></div>').join("")}else if(page==="challenges"){let total=Object.keys(state.stamps).filter(k=>state.stamps[k]>0).length;body='<h2>Neighborhood Explorer 🏆</h2><div class="card"><h3>Visit 3 different businesses</h3><p>'+Math.min(total,3)+'/3 businesses explored</p><div class="notice">Earn points by collecting loyalty stamps. Challenge progress is for demo purposes.</div></div>'}else{body='<h2>My Profile 👤</h2><div class="card"><h3>Hey, Hunter! ✨</h3><p><strong>'+state.points+' BizPoints</strong></p><p>'+state.history.length+' demo activities recorded</p><button class="btn" id="reset">Reset demo progress</button></div><h3>Recent activity</h3>'+(state.history.length?state.history.slice(0,8).map(x=>'<div class="card">'+x+'</div>').join(""):'<p class="muted">No recent activity.</p>')};$("top").innerHTML=selected?"":header();$("main").innerHTML=body;$("nav").innerHTML=[["discover","🔎","Discover"],["wallet","🪪","Cards"],["rewards","🎁","Rewards"],["challenges","🏆","Challenges"],["profile","👤","Profile"]].map(([p,icon,name])=>'<button data-page="'+p+'" class="'+(page===p&&!selected?"selected":"")+'"><span>'+icon+'</span>'+name+'</button>').join("");document.querySelectorAll("[data-page]").forEach(el=>el.onclick=()=>{page=el.dataset.page;selected=null;render()});document.querySelectorAll("[data-merchant]").forEach(el=>el.onclick=()=>{selected=+el.dataset.merchant;render()});document.querySelectorAll("[data-category]").forEach(el=>el.onclick=()=>{category=el.dataset.category;render()});if($("search")){$("search").oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$("search").focus();$("search").setSelectionRange(pos,pos)}}if($("back"))$("back").onclick=()=>{selected=null;render()};if($("collect"))$("collect").onclick=()=>{let m=merchants.find(x=>x.id===selected);if(count(m)>=m.goal){alert("Reward unlocked! Redeem first.");return}state.stamps[m.id]=count(m)+1;state.points+=10;state.history.unshift("⭐ Earned a stamp at "+m.name);save();render()};if($("redeem"))$("redeem").onclick=()=>{let m=merchants.find(x=>x.id===selected);if(count(m)<m.goal)return;state.stamps[m.id]=0;state.history.unshift("🎁 Redeemed "+m.reward+" at "+m.name);save();alert("🎉 Reward redeemed (demo only)!");render()};if($("reset"))$("reset").onclick=()=>{if(confirm("Reset all demo progress?")){state={points:120,stamps:{1:2},history:[]};save();render()}}}render();
</script></body></html>
