<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt Accounts — Live Beta</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ff;color:#302348;font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:620px;margin:auto;min-height:100vh;background:#fffdff}.hero{background:linear-gradient(125deg,#6540d5,#a56aee);color:#fff;padding:24px;border-radius:0 0 25px 25px}.logo{font-weight:900;font-size:27px}.logo b{color:#ffdb59}main{padding:20px}.card{background:white;border:1px solid #e8e0f5;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 4px 14px #503f7509}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#776e86;font-size:13px}.tag{border-radius:20px;background:#eee7ff;color:#6240cb;padding:6px 9px;font-size:12px}h2{font-size:23px;margin:10px 0}h3{margin:4px 0}label{display:block;margin:12px 0;font-weight:650;font-size:13px}input,textarea,select{display:block;width:100%;margin-top:5px;border:1px solid #d9cdeb;border-radius:10px;padding:12px;background:white;color:#302348}button{border:0;border-radius:11px;padding:11px 14px;background:#7147e2;color:white;font-weight:700}button.alt{background:#eee7ff;color:#6240cb}button:disabled{opacity:.5;cursor:not-allowed}.stack{display:flex;flex-wrap:wrap;gap:8px}.notice{background:#fff3d7;color:#785919;border-radius:12px;padding:12px;margin:12px 0}.error{background:#ffe7ec;color:#a72c4d}.success{background:#dff8ec;color:#116845}.metric{font-size:25px;font-weight:900;color:#7147e2}a{color:#6240cb}.hero a{color:#fff}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button{font-size:13px}small{font-size:12px}.divider{height:1px;background:#e9e2f5;margin:14px 0}</style></head><body><div class="shell"><header class="hero"><div class="row"><div class="logo">Biz<b>Hunt</b> ✦</div><a href="../">Customer demo ↗</a></div><h1>Live Beta Accounts 🔐</h1><p>Discover local. Build loyalty. Together.</p></header><main><div id="message" role="status"></div><div id="root">Connecting securely…</div><p class="muted">Beta: Real accounts and shared business listings. Merchant stamp and reward issuance will be enabled after secure in-person verification is implemented.</p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),e=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let db,user=null,mode="login",section="discover",businesses=[],campaigns=[],myBusinesses=[];function note(t,err=false){$("message").innerHTML='<div class="notice '+(err?"error":"success")+'">'+e(t)+'</div>'}function clear(){ $("message").innerHTML="" }function setSection(s){section=s;clear();render()}async function init(){if(!window.supabase){$("root").textContent="Could not load the authentication library. Check your connection and refresh.";return}db=window.supabase.createClient(SUPABASE_URL,KEY);const {data,error}=await db.auth.getUser();if(error&&error.name!=="AuthSessionMissingError")note(error.message,true);user=data?.user||null;db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(()=>refresh(),0)});await refresh()}async function refresh(){if(!db)return;if(!user){render();return}const [b,c,m]=await Promise.all([db.from("businesses").select("id,name,category,location,description,owner_id").order("created_at",{ascending:false}).limit(100),db.from("campaigns").select("id,business_id,name,reward,stamp_goal,active").eq("active",true).limit(200),db.from("businesses").select("id,name,category,location,description").eq("owner_id",user.id).limit(50)]);if(b.error||c.error||m.error)note((b.error||c.error||m.error).message+" — Have you run supabase/schema.sql?",true);businesses=b.data||[];campaigns=c.data||[];myBusinesses=m.data||[];render()}function authView(){return '<h2>'+ (mode==="login"?"Welcome back 👋":"Join BizHunt 🎉")+'</h2><div class="card"><form id="auth"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="'+(mode==="login"?"current-password":"new-password")+'" minlength="6" required></label><button type="submit">'+(mode==="login"?"Sign in":"Create account")+'</button></form><p class="muted">'+(mode==="login"?"New to BizHunt?":"Already registered?")+' <button class="alt" id="toggle">'+(mode==="login"?"Sign up":"Sign in")+'</button></p></div><p class="muted">Use your own email. Confirm your address if Supabase email confirmation is enabled.</p>'}function render(){if(!user){$("root").innerHTML=authView();$("toggle").onclick=()=>{mode=mode==="login"?"signup":"login";clear();render()};$("auth").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),email=String(f.get("email")).trim(),password=String(f.get("password"));const btn=ev.target.querySelector("button[type=submit]");btn.disabled=true;let r=mode==="login"?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});btn.disabled=false;if(r.error)note(r.error.message,true);else if(mode==="signup"&&!r.data.session)note("Account created. Check your email to confirm your address, then sign in.");else{note("Signed in successfully.");await refresh()}};return}let out='<div class="row"><p class="muted">Signed in as <strong>'+e(user.email)+'</strong></p><button class="alt" id="signout">Sign out</button></div><nav><button class="'+(section==="discover"?"":"alt")+'" data-section="discover">🔎 Discover</button><button class="'+(section==="merchant"?"":"alt")+'" data-section="merchant">🏪 My business</button><button class="'+(section==="account"?"":"alt")+'" data-section="account">👤 Account</button></nav>';if(section==="discover"){out+='<h2>Discover Pampanga 💜</h2><p class="muted">Live merchant listings from the shared database.</p>'+(businesses.length?businesses.map(b=>'<div class="card"><div class="row"><h3>🏪 '+e(b.name)+'</h3><span class="tag">'+e(b.category)+'</span></div><p>📍 '+e(b.location)+'</p><p class="muted">'+e(b.description)+'</p>'+campaigns.filter(c=>c.business_id===b.id).map(c=>'<div class="notice">🎁 '+e(c.name)+': '+e(c.reward)+' after '+c.stamp_goal+' stamps</div>').join("")+'</div>').join(""):'<div class="card">No businesses yet. Add the first demo merchant under My business.</div>')}else if(section==="merchant"){out+='<h2>Merchant workspace 🛍️</h2><div class="card"><h3>Register a business</h3><form id="businessForm"><label>Business name<input name="name" required maxlength="100" placeholder="Brew & Bloom Café"></label><label>Category<select name="category"><option>Café</option><option>Restaurant</option><option>Bakery</option><option>Beauty</option><option>Fitness</option><option>Retail</option><option>Other</option></select></label><label>Location<input name="location" required maxlength="120" placeholder="Angeles City, Pampanga"></label><label>Description<textarea name="description" maxlength="350"></textarea></label><button>Create business</button></form></div>'+myBusinesses.map(b=>'<div class="card"><div class="row"><h3>🏪 '+e(b.name)+'</h3><span class="tag">'+e(b.category)+'</span></div><p class="muted">'+e(b.location)+'</p><p>'+e(b.description)+'</p><div class="divider"></div><h3>Launch loyalty campaign</h3><form class="campaignForm" data-business="'+e(b.id)+'"><label>Campaign name<input name="name" maxlength="100" required placeholder="Coffee Club"></label><label>Reward<input name="reward" maxlength="120" required placeholder="Free iced latte"></label><label>Stamps required<select name="goal"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label><button>Create campaign</button></form>'+campaigns.filter(c=>c.business_id===b.id).map(c=>'<p>🎯 '+e(c.name)+' — '+c.stamp_goal+' stamps → '+e(c.reward)+'</p>').join("")+'</div>').join("")}else{out+='<h2>Your account</h2><div class="card"><p><strong>Email:</strong> '+e(user.email)+'</p><p><strong>Account ID:</strong> <small>'+e(user.id)+'</small></p><p class="muted">This is a real Supabase account. Your previous demo stamps are not transferred.</p></div>'}$("root").innerHTML=out;$("signout").onclick=async()=>{let r=await db.auth.signOut();if(r.error)note(r.error.message,true);else{user=null;clear();render()}};document.querySelectorAll("[data-section]").forEach(b=>b.onclick=()=>setSection(b.dataset.section));if($("businessForm"))$("businessForm").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),btn=ev.target.querySelector("button");btn.disabled=true;const r=await db.from("businesses").insert({owner_id:user.id,name:String(f.get("name")).trim(),category:String(f.get("category")),location:String(f.get("location")).trim(),description:String(f.get("description")).trim()});btn.disabled=false;if(r.error)note(r.error.message,true);else{note("Business created and shared across accounts!");await refresh()}};document.querySelectorAll(".campaignForm").forEach(form=>form.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(form),btn=form.querySelector("button");btn.disabled=true;const r=await db.from("campaigns").insert({business_id:form.dataset.business,name:String(f.get("name")).trim(),reward:String(f.get("reward")).trim(),stamp_goal:Number(f.get("goal"))});btn.disabled=false;if(r.error)note(r.error.message,true);else{note("Loyalty campaign published!");await refresh()}})}init().catch(err=>note(err.message,true));
</script></body></html>
