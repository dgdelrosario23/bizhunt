<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt Merchant Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ff;color:#30244e;font-family:system-ui,-apple-system,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:#fdfbff;padding-bottom:90px}.hero{background:linear-gradient(135deg,#6944dc,#b56af5);color:white;padding:23px 20px 30px;border-radius:0 0 26px 26px}.logo{font-size:25px;font-weight:900}.logo b{color:#ffd759}.hero h1{margin:18px 0 4px;font-size:26px}.hero p{margin:0;opacity:.85}.content{padding:18px}.card{background:white;border:1px solid #e7dff5;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px #51367c09}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#807591;font-size:13px}.tag{border-radius:50px;background:#eee7ff;color:#6840d0;padding:6px 10px;font-size:12px;font-weight:750}.btn{border:0;background:#7045e8;color:white;border-radius:12px;padding:11px 15px;font-weight:750}.btn.secondary{background:#f0eaff;color:#6240c3}.btn.green{background:#0d9d7a}.btn.danger{background:#fce6ed;color:#b53256}.full{width:100%}.field{display:block;margin:13px 0;font-size:13px;font-weight:700}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #dcd2ee;background:#fff;border-radius:12px;padding:12px;margin-top:6px;color:#30244e}.field textarea{min-height:80px;resize:vertical}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border-radius:16px;background:white;border:1px solid #e7dff5}.stat strong{display:block;font-size:25px;color:#7045e8}.stat small{color:#807591}.bar{height:10px;background:#eee7fb;border-radius:10px;overflow:hidden}.bar span{height:100%;display:block;background:#8457f3;border-radius:10px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:white;border-top:1px solid #e9e0f3;display:flex;justify-content:space-around;padding:9px 2px 15px}nav button{background:none;border:0;color:#82778f;font-size:11px;display:grid;justify-items:center;gap:4px}nav button.active{color:#7045e8;font-weight:800}nav span{font-size:21px}.empty{padding:22px;text-align:center;color:#807591}.notice{padding:12px;border-radius:12px;background:#fff3d4;color:#775a17;font-size:13px;margin:12px 0}.stack{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:12px}.link{color:#fff;font-size:13px}h2{margin:8px 0 14px}h3{margin:0 0 8px}p{line-height:1.5}button:focus-visible,input:focus-visible{outline:3px solid #e9b64d;outline-offset:2px}</style></head><body><div class="app"><header class="hero"><div class="row"><div class="logo">Biz<b>Hunt</b> ✦</div><a class="link" href="../">← Customer app</a></div><h1>Merchant Studio 🛍️</h1><p>Turn first visits into loyal customers.</p></header><div class="content" id="app"></div></div><nav id="nav"></nav><script>
const KEY="bizhunt-merchant-v2";const seed={business:null,campaigns:[],requests:[],redemptions:[],next:1};let s;try{s=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{s=JSON.parse(JSON.stringify(seed))}let tab="overview",notice="";const $=id=>document.getElementById(id);const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function msg(t){notice=t;render()}function stat(label,n){return '<div class="stat"><strong>'+n+'</strong><small>'+label+'</small></div>'}function tabs(){let names=[["overview","📊","Overview"],["campaigns","🎯","Campaigns"],["approvals","✅","Approvals"],["profile","🏪","Business"]];$("nav").innerHTML=names.map(([id,emoji,name])=>'<button data-tab="'+id+'" class="'+(tab===id?"active":"")+'"><span>'+emoji+'</span>'+name+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;notice="";render()})}function render(){tabs();let out='<div class="notice">🧪 Prototype only. All customer requests and approvals are simulated and stored in this browser. No real loyalty rewards are issued.</div>';if(notice)out+='<div class="card" role="status">'+esc(notice)+'</div>';if(!s.business){out+='<h2>Set up your business 🚀</h2><p class="muted">Create a fictional demo merchant profile to explore the dashboard.</p>'+profileForm();$("app").innerHTML=out;wireProfile();return}if(tab==="overview"){let approved=s.requests.filter(r=>r.status==="approved").length;let redeemed=s.redemptions.filter(r=>r.status==="approved").length;out+='<div class="row"><h2>Hi, '+esc(s.business.name)+' 👋</h2><span class="tag">Demo</span></div><div class="stats">'+stat("Active campaigns",s.campaigns.filter(c=>c.active).length)+stat("Approved stamps",approved)+stat("Rewards redeemed",redeemed)+stat("Pending requests",s.requests.filter(r=>r.status==="pending").length+s.redemptions.filter(r=>r.status==="pending").length)+'</div><div class="card"><h3>Quick actions</h3><div class="stack"><button class="btn" data-go="campaigns">Create loyalty campaign</button><button class="btn secondary" data-go="approvals">Review requests</button></div></div><div class="card"><h3>Campaign performance</h3>'+(s.campaigns.length?s.campaigns.map(c=>{let n=s.requests.filter(r=>r.campaignId===c.id&&r.status==="approved").length;return '<p><strong>'+esc(c.name)+'</strong> · '+n+' approved stamps</p><div class="bar"><span style="width:'+Math.min(100,n*10)+'%"></span></div>'}).join(""):'<p class="muted">Create your first campaign to see activity.</p>')+'</div>'}if(tab==="campaigns"){out+='<h2>Loyalty campaigns 🎯</h2><div class="card"><h3>Create a campaign</h3><form id="campaignForm"><label class="field">Campaign name<input name="name" required maxlength="60" placeholder="Coffee Club"></label><label class="field">Reward description<input name="reward" required maxlength="100" placeholder="Free iced latte"></label><label class="field">Stamps required<select name="goal"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label><button class="btn full">Create campaign</button></form></div>'+s.campaigns.map(c=>'<div class="card"><div class="row"><h3>'+esc(c.name)+'</h3><span class="tag">'+(c.active?"Active":"Paused")+'</span></div><p>🎁 '+esc(c.reward)+'</p><p class="muted">'+c.goal+' stamps to redeem</p><div class="stack"><button class="btn secondary" data-toggle="'+c.id+'">'+(c.active?"Pause":"Resume")+'</button><button class="btn" data-stamp="'+c.id+'" '+(!c.active?"disabled":"")+'>Simulate stamp request</button><button class="btn green" data-reward="'+c.id+'" '+(!c.active?"disabled":"")+'>Simulate redemption</button></div></div>').join("")}if(tab==="approvals"){let pendingS=s.requests.filter(r=>r.status==="pending"),pendingR=s.redemptions.filter(r=>r.status==="pending");out+='<h2>Stamp approvals ✅</h2>'+(pendingS.length?pendingS.map(r=>requestCard(r,"stamp")).join(""):'<div class="card empty">No pending stamp requests.</div>')+'<h2>Reward redemptions 🎁</h2>'+(pendingR.length?pendingR.map(r=>requestCard(r,"reward")).join(""):'<div class="card empty">No pending reward redemptions.</div>')+'<h2>Recent decisions</h2>'+([...s.requests,...s.redemptions].filter(r=>r.status!=="pending").sort((a,b)=>b.id-a.id).slice(0,10).map(r=>'<div class="card mini">'+esc(r.customer)+' · '+esc(r.campaignName)+' · <strong>'+esc(r.status)+'</strong></div>').join("")||'<p class="muted">Nothing reviewed yet.</p>')}if(tab==="profile"){out+='<h2>Business profile 🏪</h2>'+profileForm()+'<div class="card"><h3>Demo data</h3><p class="muted">Reset all merchant data stored in this browser.</p><button class="btn danger" id="reset">Reset merchant demo</button></div>'} $("app").innerHTML=out;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});if($("campaignForm"))$("campaignForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get("name")).trim(),reward=String(f.get("reward")).trim();if(!name||!reward)return;s.campaigns.unshift({id:s.next++,name,reward,goal:Number(f.get("goal")),active:true});save();msg("🎉 Campaign created!")};document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let c=s.campaigns.find(x=>x.id==b.dataset.toggle);c.active=!c.active;save();render()});document.querySelectorAll("[data-stamp]").forEach(b=>b.onclick=()=>simulate(+b.dataset.stamp,"stamp"));document.querySelectorAll("[data-reward]").forEach(b=>b.onclick=()=>simulate(+b.dataset.reward,"reward"));document.querySelectorAll("[data-decision]").forEach(b=>b.onclick=()=>decide(b.dataset.kind,+b.dataset.id,b.dataset.decision));wireProfile();if($("reset"))$("reset").onclick=()=>{if(confirm("Reset merchant profile, campaigns and demo transactions?")){s=JSON.parse(JSON.stringify(seed));save();tab="overview";msg("Demo reset.")}}}
function profileForm(){let b=s.business||{};return '<form id="profileForm" class="card"><label class="field">Business name<input name="name" required maxlength="70" value="'+esc(b.name||"")+'" placeholder="Your café or shop"></label><label class="field">Category<select name="category">'+["Café","Restaurant","Bakery","Beauty & Wellness","Fitness","Retail","Other"].map(x=>'<option '+(b.category===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label><label class="field">Location<input name="location" required maxlength="120" value="'+esc(b.location||"")+'" placeholder="Angeles City, Pampanga"></label><label class="field">Business description<textarea name="description" maxlength="350" placeholder="What makes your business special?">'+esc(b.description||"")+'</textarea></label><button class="btn full">'+(s.business?"Save changes":"Create demo business")+'</button></form>'}
function wireProfile(){if($("profileForm"))$("profileForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get("name")).trim(),location=String(f.get("location")).trim();if(!name||!location)return;s.business={name,location,category:String(f.get("category")),description:String(f.get("description")).trim()};save();tab="overview";msg("Business profile saved!")}}
function simulate(id,kind){let c=s.campaigns.find(x=>x.id===id);if(!c||!c.active)return;let customer=prompt("Demo customer name:","Alex Santos");if(customer===null)return;customer=customer.trim().slice(0,60);if(!customer){alert("Enter a customer name.");return}let item={id:s.next++,campaignId:id,campaignName:c.name,customer,status:"pending",created:new Date().toLocaleString()};(kind==="stamp"?s.requests:s.redemptions).unshift(item);save();tab="approvals";msg(kind==="stamp"?"New simulated stamp request created.":"New simulated redemption request created.")}
function requestCard(r,kind){return '<div class="card"><div class="row"><strong>'+esc(r.customer)+'</strong><span class="tag">'+(kind==="stamp"?"Stamp":"Reward")+'</span></div><p>'+esc(r.campaignName)+'</p><p class="muted">'+esc(r.created)+'</p><div class="stack"><button class="btn green" data-decision="approved" data-kind="'+kind+'" data-id="'+r.id+'">Approve</button><button class="btn danger" data-decision="rejected" data-kind="'+kind+'" data-id="'+r.id+'">Reject</button></div></div>'}
function decide(kind,id,status){let r=(kind==="stamp"?s.requests:s.redemptions).find(x=>x.id===id);if(!r||r.status!=="pending")return;r.status=status;save();msg((kind==="stamp"?"Stamp":"Redemption")+" "+status+" (simulation).")}render();
</script></body></html>
