const PROJECT_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",PUBLISHABLE_KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let db,user=null,tab="overview",businesses=[],allBusinesses=[],activeBusinessId=null,campaigns=[],stamps=[],redemptions=[],gallery=[],reviews=[],cameraStream=null,scanning=false,scanTimer=null;function notify(t,bad=false){$("notice").innerHTML='<div class="notice '+(bad?"error":"success")+'">'+esc(t)+'</div>'}function clear(){$("notice").innerHTML=""}function stopCamera(){scanning=false;if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}function nav(){let a=[["overview","📊","Overview"],["business","🏪","Business"],["campaigns","🎯","Campaigns"],["scanner","▦","Scanner"]];$("nav").innerHTML=a.map(([id,icon,name])=>'<button data-tab="'+id+'" class="'+(tab===id?"active":"")+'"><span>'+icon+'</span>'+name+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{stopCamera();tab=b.dataset.tab;clear();render()})}async function init(){if(!window.supabase){$("view").textContent="Authentication library unavailable.";return}db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);let r=await db.auth.getUser();user=r.data?.user||null;db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(load,0)});await load()}async function load(){if(!user){render();return}let [b,c,s,r,g,rv]=await Promise.all([db.from("businesses").select("id,name,category,location,description,logo_path,cover_path,phone,opening_hours,website,instagram,brand_color,business_type,service_area,mobile_service,verification_status,weekly_hours").eq("owner_id",user.id).limit(50),db.from("campaigns").select("id,business_id,name,reward,stamp_goal,active,card_color").limit(200),db.from("stamp_events").select("id,campaign_id,customer_id,merchant_id,created_at").limit(1000),db.from("reward_redemptions").select("id,campaign_id,customer_id,merchant_id,created_at").limit(1000),db.from("business_gallery").select("id,business_id,image_path,caption").limit(1000),db.from("business_reviews").select("id,business_id,rating,review_text,merchant_reply,created_at").order("created_at",{ascending:false}).limit(1000)]);let err=[b,c,s,r].find(x=>x.error);if(err)notify(err.error.message+" — Check Supabase migrations.",true);gallery=g.data||[];reviews=rv.data||[];if(rv.error)notify("Run Phase 13 migration to enable reviews.",true);allBusinesses=b.data||[];let requested=new URLSearchParams(location.search).get("business");if(requested&&allBusinesses.some(x=>x.id===requested))activeBusinessId=requested;if(!activeBusinessId||!allBusinesses.some(x=>x.id===activeBusinessId))activeBusinessId=allBusinesses[0]?.id||null;businesses=allBusinesses.filter(x=>x.id===activeBusinessId);campaigns=(c.data||[]).filter(x=>businesses.some(b=>b.id===x.business_id));stamps=(s.data||[]).filter(x=>campaigns.some(c=>c.id===x.campaign_id));redemptions=(r.data||[]).filter(x=>campaigns.some(c=>c.id===x.campaign_id));render()}function brandColor(v){return /^#[0-9a-fA-F]{6}$/.test(v||"")?v:"#7042dc"}function brandImage(p){return p?db.storage.from("bizhunt-business-media").getPublicUrl(p).data.publicUrl:""}function weeklyHoursFields(b){let h=b.weekly_hours||{};return '<details><summary>📅 Weekly opening hours (for Open Now)</summary><p class="hint">Use 24-hour times. Leave Closed checked for days you do not operate.</p>'+["mon","tue","wed","thu","fri","sat","sun"].map(d=>{let v=h[d]||{};return '<div class="row"><strong>'+d.toUpperCase()+'</strong><label><input type="checkbox" name="closed_'+d+'" '+(v.closed||!v.open?'checked':'')+'> Closed</label><input aria-label="'+d+' opens" type="time" name="open_'+d+'" value="'+esc(v.open||"09:00")+'"><input aria-label="'+d+' closes" type="time" name="close_'+d+'" value="'+esc(v.close||"17:00")+'"></div>'}).join("")+'</details>'}
function editUI(b){return '<div class="card"><h3>🎨 Branding: '+esc(b.name)+'</h3><form class="brandForm" data-id="'+esc(b.id)+'"><label class="field">Brand color<input name="brand_color" type="color" value="'+brandColor(b.brand_color)+'"></label><label class="field">Description<textarea name="description" maxlength="350">'+esc(b.description||"")+'</textarea></label><label class="field">Opening hours (display text)<input name="opening_hours" maxlength="180" value="'+esc(b.opening_hours||"")+'"></label>'+weeklyHoursFields(b)+'<label class="field">Phone<input name="phone" maxlength="40" value="'+esc(b.phone||"")+'"></label><label class="field">Business type<select name="business_type"><option value="place" '+(b.business_type==='service'?'':'selected')+'>Place / Storefront</option><option value="service" '+(b.business_type==='service'?'selected':'')+'>Essential Service</option></select></label><label class="field">Service coverage area<input name="service_area" maxlength="180" placeholder="e.g., Angeles City and Mabalacat" value="'+esc(b.service_area||"")+'"></label><label class="field"><input type="checkbox" name="mobile_service" '+(b.mobile_service?'checked':'')+' style="display:inline;width:auto;margin-right:8px">Mobile / on-site service available</label><label class="field">Website<input name="website" type="url" maxlength="240" value="'+esc(b.website||"")+'"></label><label class="field">Instagram handle<input name="instagram" maxlength="100" value="'+esc(b.instagram||"")+'"></label><label class="field">Logo<input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Cover photo<input name="cover" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn full">Save business profile</button></form><div class="card"><h3>✓ Business verification</h3><p class="hint">Status: '+esc(b.verification_status||"unverified")+'. Verification is reviewed by BizHunt administrators.</p>'+(b.verification_status==="verified"?"":'<form class="verificationForm" data-id="'+esc(b.id)+'"><label class="field">Evidence / ownership explanation<textarea name="note" required minlength="20" maxlength="1000" placeholder="Describe your role and how BizHunt can confirm you own or manage this business. Do not include passwords or sensitive IDs."></textarea></label><button class="btn alt">Request verification</button></form>')+'</div></div><div class="card"><h3>📸 Photo gallery</h3><p class="hint">Upload up to 12 photos. PNG, JPG or WebP; maximum 3MB each.</p><form class="galleryForm" data-id="'+esc(b.id)+'"><label class="field">Photo<input name="photo" type="file" accept="image/png,image/jpeg,image/webp" required></label><label class="field">Caption<input name="caption" maxlength="160"></label><button class="btn full">Add photo</button></form><div class="gallery-grid">'+gallery.filter(x=>x.business_id===b.id).map(x=>'<div><img loading="lazy" src="'+esc(brandImage(x.image_path))+'" alt="'+esc(x.caption||b.name)+'"><p class="hint">'+esc(x.caption)+'</p><button class="btn alt" data-delete-photo="'+esc(x.id)+'">Remove</button></div>').join("")+'</div></div>'}async function saveBrand(ev){ev.preventDefault();let f=new FormData(ev.currentTarget),b=businesses.find(x=>x.id===ev.currentTarget.dataset.id),button=ev.currentTarget.querySelector("button");if(!b)return;button.disabled=true;try{let data={brand_color:String(f.get("brand_color")),description:String(f.get("description")),opening_hours:String(f.get("opening_hours")),phone:String(f.get("phone")),website:String(f.get("website")),instagram:String(f.get("instagram")),business_type:String(f.get("business_type")||"place"),service_area:String(f.get("service_area")||"").trim(),mobile_service:f.has("mobile_service"),weekly_hours:Object.fromEntries(["mon","tue","wed","thu","fri","sat","sun"].map(d=>[d,f.has("closed_"+d)?{closed:true}:{open:String(f.get("open_"+d)||""),close:String(f.get("close_"+d)||"")}]))};for(let kind of ["logo","cover"]){let file=f.get(kind);if(!file||!file.size)continue;let ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp"}[file.type];if(!ext||file.size>3145728)throw Error("Image must be PNG, JPG or WebP under 3MB");let key=user.id+"/"+b.id+"/"+kind+"/"+crypto.randomUUID()+"."+ext;let upload=await db.storage.from("bizhunt-business-media").upload(key,file,{contentType:file.type});if(upload.error)throw upload.error;data[kind+"_path"]=key}let r=await db.from("businesses").update(data).eq("id",b.id);if(r.error)throw r.error;notify("Branding saved");await load()}catch(e){notify(e.message,true)}finally{button.disabled=false}}async function requestVerification(ev){ev.preventDefault();let f=new FormData(ev.currentTarget),note=String(f.get("note")||"").trim(),business_id=ev.currentTarget.dataset.id;if(note.length<20){notify("Please provide at least 20 characters.",true);return}let q=await db.from("business_verification_requests").upsert({business_id,requester_id:user.id,evidence_note:note,status:"pending",reviewed_at:null},{onConflict:"business_id,requester_id"});notify(q.error?q.error.message+" — Run Phase 15 SQL migration.":"Verification request submitted for administrator review.",!!q.error)}
async function addGallery(ev){ev.preventDefault();let form=ev.currentTarget,id=form.dataset.id;if(gallery.filter(x=>x.business_id===id).length>=12){notify("Maximum 12 gallery photos.",true);return}let f=new FormData(form),file=f.get("photo"),ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp"}[file?.type];if(!ext||file.size>3145728){notify("Choose PNG, JPG or WebP under 3MB.",true);return}let button=form.querySelector("button");button.disabled=true;try{let key=user.id+"/"+id+"/gallery/"+crypto.randomUUID()+"."+ext;let up=await db.storage.from("bizhunt-business-media").upload(key,file,{contentType:file.type});if(up.error)throw up.error;let q=await db.from("business_gallery").insert({business_id:id,image_path:key,caption:String(f.get("caption")||"").trim()});if(q.error)throw q.error;notify("Photo added");await load()}catch(e){notify(e.message,true)}finally{button.disabled=false}}async function deleteGallery(id){let q=await db.from("business_gallery").delete().eq("id",id);if(q.error)notify(q.error.message,true);else{notify("Photo removed from gallery");await load()}}function merchantReviews(){let rs=reviews.filter(x=>x.business_id===activeBusinessId);return '<section class="card"><h3>⭐ Verified customer reviews</h3><p class="muted">'+rs.length+' reviews</p>'+(rs.length?rs.map(x=>'<div class="review-item"><strong>'+('★'.repeat(x.rating))+'</strong><p>'+esc(x.review_text)+'</p><p class="hint">'+esc(new Date(x.created_at).toLocaleDateString())+'</p>'+(x.merchant_reply?'<div class="review-reply"><strong>Your reply</strong><p>'+esc(x.merchant_reply)+'</p></div>':'')+'<form class="replyForm" data-review="'+esc(x.id)+'"><label class="field">Official business response<textarea name="reply" maxlength="1200" required>'+esc(x.merchant_reply||'')+'</textarea></label><button class="btn alt">'+(x.merchant_reply?'Update reply':'Post reply')+'</button></form></div>').join(''):'<p class="hint">No reviews yet.</p>')+'</section>'}async function submitReply(ev){ev.preventDefault();let f=ev.currentTarget,button=f.querySelector("button");button.disabled=true;let q=await db.rpc("reply_to_business_review",{p_review:f.dataset.review,p_reply:String(new FormData(f).get("reply")||"").trim()});button.disabled=false;if(q.error)notify(q.error.message,true);else{await load();notify("Business response saved.")}}function render(){nav();if(!user){$("view").innerHTML='<h2 class="heading">Welcome, local business hero! ✨</h2><div class="card"><p>Use your BizHunt account to manage your business and verify loyalty visits.</p><a href="../account/">Sign in or create an account →</a></div>';return}let out='<div class="card"><div class="row"><strong>🏪 '+esc(businesses[0]?.name||"No business selected")+'</strong><a href="../app/" class="btn alt">👤 Personal profile</a></div>'+(allBusinesses.length>1?'<label class="field">Switch business<select id="businessSwitcher">'+allBusinesses.map(b=>'<option value="'+esc(b.id)+'" '+(b.id===activeBusinessId?"selected":"")+'>'+esc(b.name)+'</option>').join("")+'</select></label>':"")+'</div><div class="row"><p class="muted">'+esc(user.email)+'</p><button class="btn alt" id="signout">Sign out</button></div><div class="notice">Pilot beta: verify customer purchases before issuing stamps or redeeming rewards.</div>';if(tab==="overview"){out+='<div class="eyebrow">YOUR BUSINESS AT A GLANCE</div><h2 class="heading">Grow local loyalty! 🚀</h2><div class="scan-hero"><div><strong>Ready for the next customer?</strong><p>Make every visit count.</p><button class="btn" id="quickscan">▦ Open scanner →</button></div><span class="art">📲</span></div><section class="analytics-panel"><div class="analytics-heading"><div><div class="eyebrow">BUSINESS PERFORMANCE</div><h3>Analytics overview</h3></div><span class="analytics-period">All-time*</span></div><div class="analytics-grid"><div class="analytics-tile customers"><div class="analytics-icon">👥</div><span class="analytics-label">Unique customers</span><strong>'+new Set([...stamps,...redemptions].map(x=>x.customer_id).filter(Boolean)).size+'</strong></div><div class="analytics-tile campaigns"><div class="analytics-icon">🎯</div><span class="analytics-label">Active campaigns</span><strong>'+campaigns.filter(c=>c.active).length+'</strong></div><div class="analytics-tile stamps"><div class="analytics-icon">⭐</div><span class="analytics-label">Stamps issued</span><strong>'+stamps.length+'</strong></div><div class="analytics-tile rewards"><div class="analytics-icon">🎁</div><span class="analytics-label">Rewards redeemed</span><strong>'+redemptions.length+'</strong></div></div><div class="analytics-footer"><p>*Based on the latest loaded transactions (up to 1,000 stamps and 1,000 redemptions). Customers are counted once per business.</p><button class="btn alt analytics-refresh" id="refresh">↻ Refresh analytics</button></div></section>'+merchantReviews()+campaigns.map(c=>'<div class="card"><strong>'+esc(c.name)+'</strong><p>'+stamps.filter(x=>x.campaign_id===c.id).length+' stamps · '+redemptions.filter(x=>x.campaign_id===c.id).length+' redemptions</p></div>').join("")}else if(tab==="business"){out+='<div class="eyebrow">YOUR LOCAL STOREFRONTS</div><h2 class="heading">My businesses 🏪</h2><div class="card"><h3>Add a business</h3><form id="businessForm"><label class="field">Business name<input name="name" required maxlength="100"></label><label class="field">Category<select name="category"><option>Café</option><option>Restaurant</option><option>Bakery</option><option>Beauty</option><option>Fitness</option><option>Retail</option><option>Other</option></select></label><label class="field">Location<input name="location" required maxlength="120"></label><label class="field">Description<textarea name="description" maxlength="350"></textarea></label><button class="btn full">Create business</button></form></div>'+businesses.map(b=>'<div class="card business-card"><strong>'+esc(b.name)+'</strong><p class="muted">'+esc(b.category)+' · '+esc(b.location)+'</p><p>'+esc(b.description)+'</p></div>'+editUI(b)).join("")}else if(tab==="campaigns"){out+='<div class="eyebrow">REWARD YOUR REGULARS</div><h2 class="heading">Loyalty campaigns 🎯</h2>'+(businesses.length?'<div class="card"><h3>Create loyalty campaign</h3><form id="campaignForm"><label class="field">Business<select name="business">'+businesses.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.name)+'</option>').join("")+'</select></label><label class="field">Campaign name<input name="name" required maxlength="100"></label><label class="field">Reward<input name="reward" required maxlength="120"></label><label class="field">Card color<input type="color" name="card_color" value="#7042dc"></label><label class="field">Stamp goal<select name="goal"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label><button class="btn full">Publish campaign</button></form></div>':'<div class="card">Add a business first.</div>')+campaigns.map(c=>'<div class="card campaign-card"><div class="row"><strong>'+esc(c.name)+'</strong><span class="pill">'+(c.active?"Active":"Paused")+'</span></div><p>🎁 '+esc(c.reward)+' after '+c.stamp_goal+' stamps</p><button class="btn alt" data-toggle="'+esc(c.id)+'">'+(c.active?"Pause":"Resume")+'</button></div>').join("")}else{let active=campaigns.filter(c=>c.active);out+='<div class="eyebrow">FAST AND SECURE CHECKOUT</div><h2 class="heading">Scan & reward ▦</h2><div class="scan-hero"><div><strong>Every visit counts!</strong><p>Verify the purchase, scan a QR, award a stamp.</p></div><span class="art">✨</span></div>'+(active.length?'<div class="card"><label class="field">Campaign<select id="campaign">'+active.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join("")+'</select></label><button class="btn scan-primary" id="scan">📷 Scan customer QR</button><div id="camera"></div><div class="divider-label">OR ENTER CODE MANUALLY</div><label class="field">Customer temporary code<input id="token" autocomplete="off" spellcheck="false" placeholder="Paste 48-character code"></label><p class="hint">🔒 Single-use codes expire after 90 seconds. Confirm the purchase before approval.</p><div class="actions"><button class="btn" id="stamp">✓ Approve stamp</button><button class="btn green" id="redeem">🎁 Redeem reward</button></div></div>':'<div class="card">Create an active campaign first to use the scanner.</div>')+'<div class="card"><h3>🧾 Recent transactions</h3>'+[...stamps.map(x=>({...x,kind:"Stamp"})),...redemptions.map(x=>({...x,kind:"Redemption"}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,10).map(x=>'<p>'+esc(x.kind)+' · '+esc(campaigns.find(c=>c.id===x.campaign_id)?.name||"Campaign")+' · '+esc(new Date(x.created_at).toLocaleString())+'</p>').join("")+'</div>'}$("view").innerHTML=out;if($("businessSwitcher"))$("businessSwitcher").onchange=()=>{stopCamera();activeBusinessId=$("businessSwitcher").value;history.replaceState(null,"","?business="+encodeURIComponent(activeBusinessId));load()};if($("signout"))$("signout").onclick=async()=>{stopCamera();let r=await db.auth.signOut();if(r.error)notify(r.error.message,true);else{user=null;render()}};if($("quickscan"))$("quickscan").onclick=()=>{tab="scanner";render()};if($("refresh"))$("refresh").onclick=load;document.querySelectorAll(".replyForm").forEach(el=>el.onsubmit=submitReply);document.querySelectorAll(".verificationForm").forEach(f=>f.onsubmit=requestVerification);document.querySelectorAll(".brandForm").forEach(el=>el.onsubmit=saveBrand);document.querySelectorAll(".galleryForm").forEach(el=>el.onsubmit=addGallery);document.querySelectorAll("[data-delete-photo]").forEach(el=>el.onclick=()=>deleteGallery(el.dataset.deletePhoto));if($("businessForm"))$("businessForm").onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),b=ev.target.querySelector("button");b.disabled=true;let r=await db.from("businesses").insert({owner_id:user.id,name:String(f.get("name")).trim(),category:String(f.get("category")),location:String(f.get("location")).trim(),description:String(f.get("description")).trim()});b.disabled=false;if(r.error)notify(r.error.message,true);else{notify("Business created.");await load()}};if($("campaignForm"))$("campaignForm").onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),b=ev.target.querySelector("button");b.disabled=true;let r=await db.from("campaigns").insert({business_id:String(f.get("business")),name:String(f.get("name")).trim(),reward:String(f.get("reward")).trim(),stamp_goal:Number(f.get("goal")),card_color:String(f.get("card_color")||"#7042dc")});b.disabled=false;if(r.error)notify(r.error.message,true);else{notify("Campaign published.");await load()}};document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=async()=>{let c=campaigns.find(x=>x.id===b.dataset.toggle);let r=await db.from("campaigns").update({active:!c.active}).eq("id",c.id);if(r.error)notify(r.error.message,true);else{notify("Campaign updated.");await load()}});if($("stamp"))$("stamp").onclick=()=>process("stamp");if($("redeem"))$("redeem").onclick=()=>process("redeem");if($("scan"))$("scan").onclick=startCamera}async function process(action){let token=$("token")?.value.trim().toLowerCase(),campaign=$("campaign")?.value;if(!/^[0-9a-f]{48}$/.test(token)){notify("Scan or paste a valid customer code.",true);return}if(!confirm(action==="stamp"?"Confirm qualifying purchase and issue stamp?":"Confirm reward was provided and redeem stamps?"))return;stopCamera();let r=await db.rpc("process_visit_token",{p_token:token,p_campaign:campaign,p_action:action});if(r.error){notify(r.error.message,true);return}notify(action==="stamp"?"Stamp approved!":"Reward redeemed!");await load()}async function startCamera(){if(scanning){stopCamera();$("camera").innerHTML="";return}if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){notify("Camera QR scanning unavailable in this browser. Paste the customer code instead.",true);return}try{let detector=new BarcodeDetector({formats:["qr_code"]});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("camera").innerHTML='<video id="video" autoplay muted playsinline></video><p class="muted">Point your camera at the customer QR.</p>';let v=$("video");v.srcObject=cameraStream;await v.play();scanning=true;let loop=async()=>{if(!scanning)return;try{let codes=await detector.detect(v);if(codes.length&&/^[0-9a-f]{48}$/.test(codes[0].rawValue)){let token=codes[0].rawValue;stopCamera();$("token").value=token;$("camera").innerHTML='<p class="notice success">QR scanned. Approve stamp or redeem reward.</p>';return}}catch{}scanTimer=setTimeout(loop,300)};loop()}catch(err){stopCamera();notify("Camera unavailable: "+err.message+". Paste the code instead.",true)}}init().catch(err=>notify(err.message,true));
</script></body></html>
