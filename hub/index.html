async function fetchMerchantHistory(){
 const state=merchantHistoryState,request=++state.request,business=activeBusinessId,host=$("historyResults");
 if(!host||!business)return;
 if(state.from&&state.to&&state.from>state.to){host.textContent="Start date must be on or before end date.";return}
 const ids=campaigns.filter(c=>!state.campaign||c.id===state.campaign).map(c=>c.id);
 if(!ids.length){host.textContent="No matching campaigns.";return}
 host.textContent="Loading transactions…";
 let query=db.from(state.type==="stamp"?"stamp_events":"reward_redemptions").select("id,campaign_id,created_at",{count:"exact"}).in("campaign_id",ids).order("created_at",{ascending:false}).order("id",{ascending:false}).range(state.page*20,state.page*20+19);
 if(state.from)query=query.gte("created_at",new Date(state.from+"T00:00:00").toISOString());
 if(state.to){const end=new Date(state.to+"T00:00:00");end.setDate(end.getDate()+1);query=query.lt("created_at",end.toISOString())}
 try{
  const result=await query;
  if(request!==state.request||business!==activeBusinessId||tab!=="scanner"||!$("historyResults"))return;
  if(result.error)throw result.error;
  const rows=result.data||[],count=result.count||0;
  host.innerHTML=rows.length?rows.map(x=>'<div class="bh-history-item"><span class="bh-history-type" aria-hidden="true">'+(state.type==="stamp"?"★":"🎁")+'</span><span class="bh-history-detail"><strong>'+esc(campaigns.find(c=>c.id===x.campaign_id)?.name||"Campaign")+'</strong><small>'+(state.type==="stamp"?"Stamp issued":"Reward redeemed")+'</small></span><time datetime="'+esc(x.created_at)+'">'+esc(new Date(x.created_at).toLocaleString())+'</time></div>').join(""):'<p class="hint">No matching transactions. Try clearing your filters.</p>';
  $("historyCount").textContent=count?(state.page*20+1)+"–"+Math.min((state.page+1)*20,count)+" of "+count:"0 results";
  $("historyPrev").disabled=state.page===0;
  $("historyNext").disabled=(state.page+1)*20>=count;
 }catch(e){if(request===state.request&&business===activeBusinessId&&$("historyResults"))host.textContent="History unavailable: "+(e.message||"Please try again.")}
}
function setupMerchantHistory(){
 const state=merchantHistoryState;
 if(state.business!==activeBusinessId){state.business=activeBusinessId;state.page=0;state.campaign="";state.from="";state.to=""}
 const type=$("historyType"),campaign=$("historyCampaign"),from=$("historyFrom"),to=$("historyTo");
 if(!type)return;
 type.value=state.type;campaign.value=state.campaign;from.value=state.from;to.value=state.to;
 const change=()=>{state.type=type.value;state.campaign=campaign.value;state.from=from.value;state.to=to.value;state.page=0;fetchMerchantHistory()};
 [type,campaign,from,to].forEach(el=>el.addEventListener("change",change));
 $("historyPrev").onclick=()=>{if(state.page>0){state.page--;fetchMerchantHistory()}};
 $("historyNext").onclick=()=>{state.page++;fetchMerchantHistory()};
 const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
 const applyDates=(start,end)=>{from.value=start;to.value=end;change()};
 $("historyToday").onclick=()=>{const now=new Date();applyDates(localDate(now),localDate(now))};
 $("historyWeek").onclick=()=>{const now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);applyDates(localDate(start),localDate(now))};
 $("historyClear").onclick=()=>{type.value="stamp";campaign.value="";from.value="";to.value="";change()};
 fetchMerchantHistory();
}

let scanInspectionVersion=0,verifiedScan=null;
async function updateScanActionChoice(){
 const version=++scanInspectionVersion,input=$("token"),choice=$("scanActionChoice"),actions=$("scanConfirmActions"),feedback=$("scanFeedback");
 verifiedScan=null;if(!input||!choice||!actions)return;

 const token=input.value.trim().toLowerCase(),campaign=$("campaign")?.value;
 if(!/^[0-9a-f]{48}$/.test(token)||!campaign){if(feedback){const invalid=token.length>0&&!/^[0-9a-f]{48}$/.test(token);feedback.textContent=!campaign?"Select an active campaign before scanning.":invalid?"Code must contain exactly 48 hexadecimal characters. Ask for a fresh QR or check the pasted code.":"Scan a QR or enter a 48-character temporary code.";feedback.dataset.state=invalid?"error":"neutral"}return}

  const result=await db.rpc("inspect_visit_token",{p_token:token,p_campaign:campaign});
  if(version!==scanInspectionVersion||!$("token")||$("token").value.trim().toLowerCase()!==token||$("campaign")?.value!==campaign)return;

  if(!record||!["stamp","redeem"].includes(record.action_type))throw Error("Unrecognized QR action. Ask the customer to generate a new QR.");

  if($("stamp"))$("stamp").hidden=record.action_type!=="stamp";
  if($("redeem"))$("redeem").hidden=record.action_type!=="redeem";
  if(feedback){feedback.textContent=record.action_type==="stamp"?"Verified: customer requested a stamp. Confirm the qualifying purchase.":"Verified: customer requested reward redemption. Confirm the reward is provided.";feedback.dataset.state="success"}
 }catch(err){if(version!==scanInspectionVersion||!$("token")||$("token").value.trim().toLowerCase()!==token||$("campaign")?.value!==campaign)return;choice.hidden=true;if(feedback){feedback.textContent="QR verification failed: "+(err.message||"Please request a fresh QR.");feedback.dataset.state="error"}}
}
