<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt Merchant Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#f0ecfa;color:#2e2445;font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:590px;min-height:100vh;margin:auto;background:#fdfbff;padding-bottom:95px}.hero{background:linear-gradient(135deg,#6540d5,#ad6df0);padding:24px;color:white;border-radius:0 0 25px 25px}.logo{font-size:26px;font-weight:900}.logo b{color:#ffdd60}.hero h1{margin:13px 0 5px;font-size:25px}.hero a{color:white}main{padding:18px}.card{border:1px solid #e7def4;border-radius:17px;background:white;padding:17px;margin:12px 0;box-shadow:0 4px 14px #42326009}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:13px;color:#796f89}.pill{background:#efe9ff;border-radius:30px;padding:6px 9px;color:#6740d1;font-size:12px}.btn{border:0;border-radius:11px;background:#7047df;color:white;padding:11px 13px;font-weight:750}.alt{background:#eee8ff;color:#6441c7}.green{background:#119879}.full{width:100%}.actions{display:flex;flex-wrap:wrap;gap:8px}.field{display:block;font-size:13px;font-weight:700;margin:12px 0}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #d9cfeb;border-radius:11px;padding:12px;margin-top:5px;background:white;color:#302348}.notice{background:#fff3d9;padding:12px;border-radius:12px;margin:12px 0;font-size:13px}.error{background:#ffe6ed;color:#9e214a}.success{background:#ddf7e9;color:#116e40}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:590px;width:100%;display:flex;justify-content:space-around;background:white;border-top:1px solid #e8e0f5;padding:10px 4px 15px}nav button{background:none;border:0;color:#82778e;font-size:11px;display:grid;justify-items:center;gap:4px}nav button.active{color:#7047df;font-weight:800}nav span{font-size:21px}video{width:100%;max-height:300px;border-radius:12px;background:#21192d}a{color:#6740d1}button:disabled{opacity:.5}.hero{background:linear-gradient(120deg,#6035d3,#a65aec);border-radius:0 0 30px 30px;padding-bottom:34px}.hero h1{font-size:29px;letter-spacing:-.5px}.logo b{color:#ffdc5b}.app{background:#fcfaff}.card{border-radius:22px;box-shadow:0 9px 24px #5031a20b}.btn{border-radius:14px;padding:13px 16px}.btn:focus-visible{outline:3px solid #ffca42;outline-offset:3px}.heading{font-size:23px;letter-spacing:-.5px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#8256d5}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{border-radius:18px;padding:18px;background:#f0e8ff}.metric:nth-child(2){background:#fff0c8}.metric:nth-child(3){background:#dcf9e9}.metric:nth-child(4){background:#ffe3f1}.metric strong{display:block;font-size:30px}.metric span{font-size:12px;color:#625677}.scan-hero{background:linear-gradient(120deg,#ffe382,#ffc2df);border-radius:22px;padding:20px;margin:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.scan-hero strong{font-size:20px}.scan-hero .art{font-size:50px}.scan-primary{width:100%;padding:18px;font-size:17px}.divider-label{text-align:center;color:#81748e;font-size:12px;font-weight:800;margin:16px 0}.campaign-card{border-left:5px solid #9e73e9}.business-card{border-left:5px solid #ffc45a;background:#fffcf5}.tx{border-bottom:1px solid #eee5f6;padding:11px 0}.tx:last-child{border:0}.hint{font-size:12px;color:#786e86;line-height:1.5}nav{border-radius:20px 20px 0 0;box-shadow:0 -7px 22px #50308d16;padding-bottom:max(15px,env(safe-area-inset-bottom))}nav button.active span{background:#f0e9ff;border-radius:10px;padding:4px 12px}</style></head><body><div class="app"><header class="hero"><div class="row"><div class="logo">Biz<b>Hunt</b> ✦</div><a href="../app/">Customer app ↗</a></div><h1>Merchant Hub 🏪</h1><p>Build loyalty, one visit at a time.</p></header><main><div id="notice" role="status"></div><div id="view">Connecting…</div></main></div><nav id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const PROJECT_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",PUBLISHABLE_KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let db,user=null,tab="overview",businesses=[],allBusinesses=[],activeBusinessId=null,campaigns=[],stamps=[],redemptions=[],cameraStream=null,scanning=false,scanTimer=null;function notify(t,bad=false){$("notice").innerHTML='<div class="notice '+(bad?"error":"success")+'">'+esc(t)+'</div>'}function clear(){$("notice").innerHTML=""}function stopCamera(){scanning=false;if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}function nav(){let a=[["overview","📊","Overview"],["business","🏪","Business"],["campaigns","🎯","Campaigns"],["scanner","▦","Scanner"]];$("nav").innerHTML=a.map(([id,icon,name])=>'<button data-tab="'+id+'" class="'+(tab===id?"active":"")+'"><span>'+icon+'</span>'+name+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{stopCamera();tab=b.dataset.tab;clear();render()})}async function init(){if(!window.supabase){$("view").textContent="Authentication library unavailable.";return}db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);let r=await db.auth.getUser();user=r.data?.user||null;db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(load,0)});await load()}async function load(){if(!user){render();return}let [b,c,s,r]=await Promise.all([db.from("businesses").select("id,name,category,location,description,logo_path,cover_path,phone,opening_hours,website,instagram,brand_color").eq("owner_id",user.id).limit(50),db.from("campaigns").select("id,business_id,name,reward,stamp_goal,active,card_color").limit(200),db.from("stamp_events").select("id,campaign_id,customer_id,merchant_id,created_at").limit(1000),db.from("reward_redemptions").select("id,campaign_id,customer_id,merchant_id,created_at").limit(1000)]);let err=[b,c,s,r].find(x=>x.error);if(err)notify(err.error.message+" — Check Supabase migrations.",true);allBusinesses=b.data||[];let requested=new URLSearchParams(location.search).get("business");if(requested&&allBusinesses.some(x=>x.id===requested))activeBusinessId=requested;if(!activeBusinessId||!allBusinesses.some(x=>x.id===activeBusinessId))activeBusinessId=allBusinesses[0]?.id||null;businesses=allBusinesses.filter(x=>x.id===activeBusinessId);campaigns=(c.data||[]).filter(x=>businesses.some(b=>b.id===x.business_id));stamps=(s.data||[]).filter(x=>campaigns.some(c=>c.id===x.campaign_id));redemptions=(r.data||[]).filter(x=>campaigns.some(c=>c.id===x.campaign_id));render()}function brandColor(v){return /^#[0-9a-fA-F]{6}$/.test(v||"")?v:"#7042dc"}function brandImage(p){return p?db.storage.from("bizhunt-business-media").getPublicUrl(p).data.publicUrl:""}function editUI(b){return '<div class="card"><h3>🎨 Branding: '+esc(b.name)+'</h3><form class="brandForm" data-id="'+esc(b.id)+'"><label class="field">Brand color<input name="brand_color" type="color" value="'+brandColor(b.brand_color)+'"></label><label class="field">Description<textarea name="description" maxlength="350">'+esc(b.description||"")+'</textarea></label><label class="field">Opening hours<input name="opening_hours" maxlength="180" value="'+esc(b.opening_hours||"")+'"></label><label class="field">Phone<input name="phone" maxlength="40" value="'+esc(b.phone||"")+'"></label><label class="field">Website<input name="website" type="url" maxlength="240" value="'+esc(b.website||"")+'"></label><label class="field">Instagram handle<input name="instagram" maxlength="100" value="'+esc(b.instagram||"")+'"></label><label class="field">Logo<input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Cover photo<input name="cover" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn full">Save branding</button></form></div>'}async function saveBrand(ev){ev.preventDefault();let f=new FormData(ev.currentTarget),b=businesses.find(x=>x.id===ev.currentTarget.dataset.id),button=ev.currentTarget.querySelector("button");if(!b)return;button.disabled=true;try{let data={brand_color:String(f.get("brand_color")),description:String(f.get("description")),opening_hours:String(f.get("opening_hours")),phone:String(f.get("phone")),website:String(f.get("website")),instagram:String(f.get("instagram"))};for(let kind of ["logo","cover"]){let file=f.get(kind);if(!file||!file.size)continue;let ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp"}[file.type];if(!ext||file.size>3145728)throw Error("Image must be PNG, JPG or WebP under 3MB");let key=user.id+"/"+b.id+"/"+kind+"/"+crypto.randomUUID()+"."+ext;let upload=await db.storage.from("bizhunt-business-media").upload(key,file,{contentType:file.type});if(upload.error)throw upload.error;data[kind+"_path"]=key}let r=await db.from("businesses").update(data).eq("id",b.id);if(r.error)throw r.error;notify("Branding saved");await load()}catch(e){notify(e.message,true)}finally{button.disabled=false}}function render(){nav();if(!user){$("view").innerHTML='<h2 class="heading">Welcome, local business hero! ✨</h2><div class="card"><p>Use your BizHunt account to manage your business and verify loyalty visits.</p><a href="../account/">Sign in or create an account →</a></div>';return}let out='<div class="card"><div class="row"><strong>🏪 '+esc(businesses[0]?.name||"No business selected")+'</strong><a href="../app/" class="btn alt">👤 Personal profile</a></div>'+(allBusinesses.length>1?'<label class="field">Switch business<select id="businessSwitcher">'+allBusinesses.map(b=>'<option value="'+esc(b.id)+'" '+(b.id===activeBusinessId?"selected":"")+'>'+esc(b.name)+'</option>').join("")+'</select></label>':"")+'</div><div class="row"><p class="muted">'+esc(user.email)+'</p><button class="btn alt" id="signout">Sign out</button></div><div class="notice">Pilot beta: verify customer purchases before issuing stamps or redeeming rewards.</div>';if(tab==="overview"){out+='<div class="eyebrow">YOUR BUSINESS AT A GLANCE</div><h2 class="heading">Grow local loyalty! 🚀</h2><div class="scan-hero"><div><strong>Ready for the next customer?</strong><p>Make every visit count.</p><button class="btn" id="quickscan">▦ Open scanner →</button></div><span class="art">📲</span></div><div class="card"><div class="row"><div><div class="muted">Businesses</div><h2>'+businesses.length+'</h2></div><div><div class="muted">Campaigns</div><h2>'+campaigns.filter(c=>c.active).length+'</h2></div></div><div class="row"><div><div class="muted">Stamps issued</div><h2>'+stamps.length+'</h2></div><div><div class="muted">Rewards redeemed</div><h2>'+redemptions.length+'</h2></div></div><p><strong>'+new Set([...stamps,...redemptions].map(x=>x.customer_id)).size+'</strong> unique customers in the loaded transaction history</p><button class="btn alt" id="refresh">Refresh analytics</button></div>'+campaigns.map(c=>'<div class="card"><strong>'+esc(c.name)+'</strong><p>'+stamps.filter(x=>x.campaign_id===c.id).length+' stamps · '+redemptions.filter(x=>x.campaign_id===c.id).length+' redemptions</p></div>').join("")}else if(tab==="business"){out+='<div class="eyebrow">YOUR LOCAL STOREFRONTS</div><h2 class="heading">My businesses 🏪</h2><div class="card"><h3>Add a business</h3><form id="businessForm"><label class="field">Business name<input name="name" required maxlength="100"></label><label class="field">Category<select name="category"><option>Café</option><option>Restaurant</option><option>Bakery</option><option>Beauty</option><option>Fitness</option><option>Retail</option><option>Other</option></select></label><label class="field">Location<input name="location" required maxlength="120"></label><label class="field">Description<textarea name="description" maxlength="350"></textarea></label><button class="btn full">Create business</button></form></div>'+businesses.map(b=>'<div class="card business-card"><strong>'+esc(b.name)+'</strong><p class="muted">'+esc(b.category)+' · '+esc(b.location)+'</p><p>'+esc(b.description)+'</p></div>'+editUI(b)).join("")}else if(tab==="campaigns"){out+='<div class="eyebrow">REWARD YOUR REGULARS</div><h2 class="heading">Loyalty campaigns 🎯</h2>'+(businesses.length?'<div class="card"><h3>Create loyalty campaign</h3><form id="campaignForm"><label class="field">Business<select name="business">'+businesses.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.name)+'</option>').join("")+'</select></label><label class="field">Campaign name<input name="name" required maxlength="100"></label><label class="field">Reward<input name="reward" required maxlength="120"></label><label class="field">Card color<input type="color" name="card_color" value="#7042dc"></label><label class="field">Stamp goal<select name="goal"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label><button class="btn full">Publish campaign</button></form></div>':'<div class="card">Add a business first.</div>')+campaigns.map(c=>'<div class="card campaign-card"><div class="row"><strong>'+esc(c.name)+'</strong><span class="pill">'+(c.active?"Active":"Paused")+'</span></div><p>🎁 '+esc(c.reward)+' after '+c.stamp_goal+' stamps</p><button class="btn alt" data-toggle="'+esc(c.id)+'">'+(c.active?"Pause":"Resume")+'</button></div>').join("")}else{let active=campaigns.filter(c=>c.active);out+='<div class="eyebrow">FAST AND SECURE CHECKOUT</div><h2 class="heading">Scan & reward ▦</h2><div class="scan-hero"><div><strong>Every visit counts!</strong><p>Verify the purchase, scan a QR, award a stamp.</p></div><span class="art">✨</span></div>'+(active.length?'<div class="card"><label class="field">Campaign<select id="campaign">'+active.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join("")+'</select></label><button class="btn scan-primary" id="scan">📷 Scan customer QR</button><div id="camera"></div><div class="divider-label">OR ENTER CODE MANUALLY</div><label class="field">Customer temporary code<input id="token" autocomplete="off" spellcheck="false" placeholder="Paste 48-character code"></label><p class="hint">🔒 Single-use codes expire after 90 seconds. Confirm the purchase before approval.</p><div class="actions"><button class="btn" id="stamp">✓ Approve stamp</button><button class="btn green" id="redeem">🎁 Redeem reward</button></div></div>':'<div class="card">Create an active campaign first to use the scanner.</div>')+'<div class="card"><h3>🧾 Recent transactions</h3>'+[...stamps.map(x=>({...x,kind:"Stamp"})),...redemptions.map(x=>({...x,kind:"Redemption"}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,10).map(x=>'<p>'+esc(x.kind)+' · '+esc(campaigns.find(c=>c.id===x.campaign_id)?.name||"Campaign")+' · '+esc(new Date(x.created_at).toLocaleString())+'</p>').join("")+'</div>'}$("view").innerHTML=out;if($("businessSwitcher"))$("businessSwitcher").onchange=()=>{stopCamera();activeBusinessId=$("businessSwitcher").value;history.replaceState(null,"","?business="+encodeURIComponent(activeBusinessId));load()};if($("signout"))$("signout").onclick=async()=>{stopCamera();let r=await db.auth.signOut();if(r.error)notify(r.error.message,true);else{user=null;render()}};if($("quickscan"))$("quickscan").onclick=()=>{tab="scanner";render()};if($("refresh"))$("refresh").onclick=load;document.querySelectorAll(".brandForm").forEach(el=>el.onsubmit=saveBrand);if($("businessForm"))$("businessForm").onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),b=ev.target.querySelector("button");b.disabled=true;let r=await db.from("businesses").insert({owner_id:user.id,name:String(f.get("name")).trim(),category:String(f.get("category")),location:String(f.get("location")).trim(),description:String(f.get("description")).trim()});b.disabled=false;if(r.error)notify(r.error.message,true);else{notify("Business created.");await load()}};if($("campaignForm"))$("campaignForm").onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),b=ev.target.querySelector("button");b.disabled=true;let r=await db.from("campaigns").insert({business_id:String(f.get("business")),name:String(f.get("name")).trim(),reward:String(f.get("reward")).trim(),stamp_goal:Number(f.get("goal")),card_color:String(f.get("card_color")||"#7042dc")});b.disabled=false;if(r.error)notify(r.error.message,true);else{notify("Campaign published.");await load()}};document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=async()=>{let c=campaigns.find(x=>x.id===b.dataset.toggle);let r=await db.from("campaigns").update({active:!c.active}).eq("id",c.id);if(r.error)notify(r.error.message,true);else{notify("Campaign updated.");await load()}});if($("stamp"))$("stamp").onclick=()=>process("stamp");if($("redeem"))$("redeem").onclick=()=>process("redeem");if($("scan"))$("scan").onclick=startCamera}async function process(action){let token=$("token")?.value.trim().toLowerCase(),campaign=$("campaign")?.value;if(!/^[0-9a-f]{48}$/.test(token)){notify("Scan or paste a valid customer code.",true);return}if(!confirm(action==="stamp"?"Confirm qualifying purchase and issue stamp?":"Confirm reward was provided and redeem stamps?"))return;stopCamera();let r=await db.rpc("process_visit_token",{p_token:token,p_campaign:campaign,p_action:action});if(r.error){notify(r.error.message,true);return}notify(action==="stamp"?"Stamp approved!":"Reward redeemed!");await load()}async function startCamera(){if(scanning){stopCamera();$("camera").innerHTML="";return}if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){notify("Camera QR scanning unavailable in this browser. Paste the customer code instead.",true);return}try{let detector=new BarcodeDetector({formats:["qr_code"]});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("camera").innerHTML='<video id="video" autoplay muted playsinline></video><p class="muted">Point your camera at the customer QR.</p>';let v=$("video");v.srcObject=cameraStream;await v.play();scanning=true;let loop=async()=>{if(!scanning)return;try{let codes=await detector.detect(v);if(codes.length&&/^[0-9a-f]{48}$/.test(codes[0].rawValue)){let token=codes[0].rawValue;stopCamera();$("token").value=token;$("camera").innerHTML='<p class="notice success">QR scanned. Approve stamp or redeem reward.</p>';return}}catch{}scanTimer=setTimeout(loop,300)};loop()}catch(err){stopCamera();notify("Camera unavailable: "+err.message+". Paste the code instead.",true)}}init().catch(err=>notify(err.message,true));
</script></body></html>
