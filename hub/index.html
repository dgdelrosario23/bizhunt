();let f=ev.currentTarget,button=f.querySelector("button");button.disabled=true;let q=await db.rpc("reply_to_business_review",{p_review:f.dataset.review,p_reply:String(new FormData(f).get("reply")||"").trim()});button.disabled=false;if(q.error)notify(q.error.message,true);else{await load();notify("Business response saved.")}}async function loadPartnerRequests(){const panel=$("partnerRequests");if(!panel)return;let r=await db.rpc("bizhunt_my_partner_requests");if(!panel.isConnected)return;if(r.error){panel.innerHTML='<p class="muted">Partner approvals require Phase 36 SQL migration. '+esc(r.error.message)+'</p>';return}let items=(r.data||[]).filter(p=>p.business_id===activeBusinessId);panel.innerHTML=items.length?items.map(p=>'<div class="card"><strong>'+esc(p.community_name)+'</strong><p class="muted">Business: '+esc(p.business_name)+'</p>'+(p.perk_details?'<p>Proposed perk: '+esc(p.perk_details)+'</p>':'')+'<p class="pill">'+(p.partnership_status==="approved"?"✓ Approved":p.partnership_status==="declined"?"Declined":"Pending approval")+'</p>'+(p.partnership_status==="pending"?'<div class="actions"><button class="btn" data-partner-approve="'+esc(p.place_id)+'">Approve</button><button class="btn alt" data-partner-decline="'+esc(p.place_id)+'">Decline</button></div>':'')+'</div>').join(""):'<p class="muted">No community partnership requests for this business yet.</p>';panel.querySelectorAll("[data-partner-approve],[data-partner-decline]").forEach(button=>button.onclick=async()=>{let approve=!!button.dataset.partnerApprove,id=button.dataset.partnerApprove||button.dataset.partnerDecline;if(!confirm((approve?"Approve":"Decline")+" this community partnership request?"))return;button.disabled=true;let result=await db.rpc("bizhunt_respond_partner_request",{p_place_id:id,p_approve:approve});if(result.error){notify(result.error.message,true);button.disabled=false;return}notify(result.data);loadPartnerRequests()})}

cs-icon">⭐</div><span class="analytics-label">Stamps issued</span><strong>'+stamps.length+'</strong></div><div class="analytics-tile rewards"><div class="analytics-icon">🎁</div><span class="analytics-label">Rewards redeemed</span><strong>'+redemptions.length+'</strong></div></div><div class="analytics-footer"><p>*Based on the latest loaded transactions (up to 1,000 stamps and 1,000 redemptions). Customers are counted once per business.</p><button class="btn alt analytics-refresh" id="refresh">↻ Refresh analytics</button></div></section>'+merchantReviews()+campaigns.map(c=>'<div class="card"><strong>'+esc(c.name)+'</strong><p>'+stamps.filter(x=>x.campaign_id===c.id).length+' stamps · '+redemptions.filter(x=>x.campaign_id===c.id).length+' redemptions</p></div>').join("")}else if(tab==="business"){out+='<div class="eyebrow">YOUR LOCAL STOREFRONTS</div><h2 class="heading">My businesses 🏪</h2><div class="card"><h3>Add a business</h3><form id="businessForm"><label class="field">Business name<input name="name" required maxlength="100"></label><label class="field">Category<select name="category"><option>Café</option><option>Restaurant</option><option>Bakery</option><option>Beauty</option><option>Fitness</option><option>Retail</option><option>Other</option></select></label><label class="field">Location<input name="location" required maxlength="120"></label><label class="field">Description<textarea name="description" maxlength="350"></textarea></label><input type="hidden" name="latitude"><input type="hidden" name="longitude">'+locationPickerUI('new',null,null)+'<button class="btn full">Create business</button></form></div>'+businesses.map(b=>'<div class="card business-card"><strong>'+esc(b.name)+'</strong><p class="muted">'+esc(b.category)+' · '+esc(b.location)+'</p><p>'+esc(b.description)+'</p><a class="btn alt" target="_blank" rel="noopener noreferrer" href="./flyer.html?business='+encodeURIComponent(b.id)+'">🖨️ Print QR flyer</a></div>'+editUI(b)).join("")}else if(tab==="promos"){out+=engagementDashboard();out+='<div class="eyebrow">ATTRACT NEW CUSTOMERS</div><h2 class="heading">Promos & analytics 🎟️</h2>'+(promoMetrics._error?'<div class="notice">Apply Phase 19 migration to enable promos: '+esc(promoMetrics._error)+'</div>':'')+'<div class="card"><h3>Redeem a promo voucher</h3><p class="hint">Scan a customer promo QR or enter the voucher ID. Confirm before redeeming.</p><button type="button" class="btn alt full" id="promoScanButton">▦ Scan promo QR</button><div id="promoCamera"></div><form id="promoRedeemForm"><label class="field">Voucher ID<input name="voucher" required placeholder="Voucher UUID"></label><button class="btn full">Verify & redeem</button></form></div>'+'<div class="card"><h3>🤝 Community partnership requests</h3><p class="hint">Approve or decline invitations from communities. Only approved partnerships appear as verified to members.</p><div id="partnerRequests"><p class="muted">Loading requests…</p></div></div>'+(businesses.length?'<div class="card"><button class="btn full" type="button" id="togglePromoForm" aria-expanded="false" aria-controls="promoFormPanel">＋ Create promotion</button><div id="promoFormPanel" hidden><form id="promoForm"><label class="field">Title<input name="title" required minlength="3" maxlength="100"></label><label class="field">Description<textarea name="description" maxlength="1000"></textarea></label><label class="field">Terms & conditions<textarea name="terms" maxlength="1000"></textarea></label><label class="field">Starts<input name="starts" type="datetime-local" required></label><label class="field">Ends<input name="ends" type="datetime-local" required></label><label class="field">Maximum claims (optional)<input name="max_claims" type="number" min="1" placeholder="Unlimited"></label><button class="btn full">Publish promo</button><button class="btn alt full" type="button" id="cancelPromoForm" style="margin-top:8px">Cancel</button></form></div></div>':'<div class="card">Add a business first.</div>')+promos.map(p=>{let m=promoMetrics[p.id]||{},im=Number(m.impressions||0),uv=Number(m.unique_viewers||0),sv=Number(m.saved_vouchers||0),rd=Number(m.total_redeems||0);return '<div class="card"><div class="row"><strong>'+esc(p.title)+'</strong><span class="pill">'+(p.active?'Active':'Paused')+'</span></div><p>'+esc(p.description)+'</p><p class="muted">Ends '+esc(new Date(p.ends_at).toLocaleString())+'</p><div class="analytics-grid"><div class="analytics-tile"><span class="analytics-label">Impressions</span><strong>'+im+'</strong></div><div class="analytics-tile"><span class="analytics-label">Unique viewers</span><strong>'+uv+'</strong></div><div class="analytics-tile"><span class="analytics-label">Saved vouchers</span><strong>'+sv+'</strong></div><div class="analytics-tile"><span class="analytics-label">Redeems</span><strong>'+rd+'</strong></div></div><p class="hint">Viewer → save: '+(uv?(100*sv/uv).toFixed(1):'0')+'% · Save → redeem: '+(sv?(100*rd/sv).toFixed(1):'0')+'%</p><button class="btn alt" data-promo-toggle="'+esc(p.id)+'" data-active="'+p.active+'">'+(p.active?'Pause':'Resume')+' promo</button></div>'}).join("")}if(tab==="campaigns"){out+='<div class="eyebrow">REWARD YOUR REGULARS</div><h2 class="heading">Loyalty campaigns 🎯</h2>'+(businesses.length?'<div class="card"><h3>Create loyalty campaign</h3><form id="campaignForm"><label class="field">Business<select name="business">'+businesses.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.name)+'</option>').join("")+'</select></label><label class="field">Campaign name<input name="name" required maxlength="100"></label><label class="field">Reward<input name="reward" required maxlength="120"></label><label class="field">Card color<input type="color" name="card_color" value="#7042dc"></label><label class="field">Stamp goal<select name="goal"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label><button class="btn full">Publish campaign</button></form></div>':'<div class="card">Add a business first.</div>')+campaigns.map(c=>'<div class="card campaign-card"><div class="row"><strong>'+esc(c.name)+'</strong><span class="pill">'+(c.active?"Active":"Paused")+'</span></div><p>🎁 '+esc(c.reward)+' after '+c.stamp_goal+' stamps</p><button class="btn alt" data-toggle="'+esc(c.id)+'">'+(c.active?"Pause":"Resume")+'</button></div>').join("")}else{let active=campaigns.filter(c=>c.active);out+='<div class="eyebrow">FAST AND SECURE CHECKOUT</div><h2 class="heading">Scan & reward ▦</h2><div class="scan-hero"><div><strong>Every visit counts!</strong><p>Verify the purchase, scan a QR, award a stamp.</p></div><span class="art">✨</span></div>'+(active.length?'<div class="card"><label class="field">Campaign<select id="campaign">'+active.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join("")+'</select></label><button class="btn scan-primary" id="scan">📷 Scan customer QR</button><div id="camera"></div><div class="divider-label">OR ENTER CODE MANUALLY</div><label class="field">Customer temporary code<input id="token" autocomplete="off" spellcheck="false" placeholder="Paste 48-character code"></label><p class="hint">🔒 Single-use codes expire after 90 seconds. Confirm the purchase before approval.</p><div class="actions"><button class="btn" id="stamp">✓ Approve stamp</button><button class="btn green" id="redeem">🎁 Redeem reward</button></div></div>':'<div class="card">Create an active campaign first to use the scanner.</div>')+'<div class="card"><h3>🧾 Recent transactions</h3>'+[...stamps.map(x=>({...x,kind:"Stamp"})),...redemptions.map(x=>({...x,kind:"Redemption"}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,10).map(x=>'<p>'+esc(x.kind)+' · '+esc(campaigns.find(c=>c.id===x.campaign_id)?.name||"Campaign")+' · '+esc(new Date(x.created_at).toLocaleString())+'</p>').join("")+'</div>'}$("view").innerHTML=out;if(tab==="promos")loadPartnerRequests();if(tab==="business")setupLocationPickers();if($("analyticsDays"))$("analyticsDays").onchange=async()=>{analyticsDays=Number($("analyticsDays").value);await loadEngagement();render()};if($("businessSwitcher"))$("businessSwitcher").onchange=()=>{stopCamera();activeBusinessId=$("businessSwitcher").value;const url=new URL(location.href);url.searchParams.set("business",activeBusinessId);url.searchParams.set("section",tab);history.replaceState(null,"",url.pathname+url.search+url.hash);load()};if($("signout"))$("signout").onclick=async()=>{stopCamera();let r=await db.auth.signOut();if(r.error)notify(r.error.message,true);else{user=null;render()}};if($("quickscan"))$("quickscan").onclick=()=>{tab="scanner";const url=new URL(location.href);url.searchParams.set("section",tab);history.replaceState(null,"",url.pathname+url.search+url.hash);render()};if($("refresh"))$("refresh").onclick=load;document.querySelectorAll(".replyForm").forEach(el=>el.onsubmit=submitReply);document.querySelectorAll(".verificationForm").forEach(f=>f.onsubmit=requestVerification);document.querySelectorAll(".brandForm").forEach(el=>el.onsubmit=saveBrand);document.querySelectorAll(".galleryForm").forEach(el=>el.onsubmit=addGallery);document.querySelectorAll("[data-delete-photo]").forEach(el=>el.onclick=()=>deleteGallery(el.dataset.deletePhoto));if($("businessForm"))$("businessForm").onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),b=ev.target.querySelector("button");b.disabled=true;let r=await db.from("businesses").insert({owner_id:user.id,name:String(f.get("name")).trim(),category:String(f.get("category")),location:String(f.get("location")).trim(),description:String(f.get("description")).trim(),latitude:f.get("latitude")?Number(f.get("latitude")):null,longitude:f.get("longitude")?Number(f.get("longitude")):null});b.disabled=false;if(r.error)notify(r.error.message,true);else{notify("Business created.");await load()}};if($("promoScanButton"))$("promoScanButton").onclick=startPromoCamera;if($("promoRedeemForm"))$("promoRedeemForm").onsubmit=async ev=>{ev.preventDefault();let form=ev.target,id=String(new FormData(form).get("voucher")||"").trim().replace(/^BIZHUNT_PROMO:/,"");if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){notify("Enter a valid voucher ID.",true);return}let button=form.querySelector("button");button.disabled=true;let r=await db.rpc("redeem_business_promo",{p_voucher_id:id});button.disabled=false;if(r.error)notify(r.error.message,true);else{await load();notify("Voucher redeemed successfully.")}};if($("togglePromoForm")){const toggle=$("togglePromoForm"),panel=$("promoFormPanel");const show=open=>{panel.hidden=!open;toggle.setAttribute("aria-expanded",String(open));toggle.textContent=open?"− Hide promotion form":"＋ Create promotion";if(open)panel.querySelector("input")?.focus()};toggle.onclick=()=>show(panel.hidden);$("cancelPromoForm").onclick=()=>show(false)}if($("promoForm"))$("promoForm").onsubmit=async ev=>{ev.preventDefault();let form=ev.target,f=new FormData(form),starts=new Date(String(f.get("starts"))),ends=new Date(String(f.get("ends")));if(!Number.isFinite(starts.getTime())||!Number.isFinite(ends.getTime())||ends<=starts){notify("End date must be after start date.",true);return}let button=form.querySelector("button");button.disabled=true;let r=await db.from("business_promos").insert({business_id:activeBusinessId,title:String(f.get("title")).trim(),description:String(f.get("description")).trim(),terms:String(f.get("terms")).trim(),starts_at:starts.toISOString(),ends_at:ends.toISOString(),max_claims:f.get("max_claims")?Number(f.get("max_claims")):null});button.disabled=false;if(r.error)notify(r.error.message,true);else{await load();notify("Promo published.")}};document.querySelectorAll("[data-promo-toggle]").forEach(el=>el.onclick=async()=>{el.disabled=true;let r=await db.from("business_promos").update({active:el.dataset.active!=="true"}).eq("id",el.dataset.promoToggle).eq("business_id",activeBusinessId);if(r.error){el.disabled=false;notify(r.error.message,true)}else await load()});if($("campaignForm"))$("campaignForm").onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),b=ev.target.querySelector("button");b.disabled=true;let r=await db.from("campaigns").insert({business_id:String(f.get("business")),name:String(f.get("name")).trim(),reward:String(f.get("reward")).trim(),stamp_goal:Number(f.get("goal")),card_color:String(f.get("card_color")||"#7042dc")});b.disabled=false;if(r.error)notify(r.error.message,true);else{notify("Campaign published.");await load()}};document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=async()=>{let c=campaigns.find(x=>x.id===b.dataset.toggle);let r=await db.from("campaigns").update({active:!c.active}).eq("id",c.id);if(r.error)notify(r.error.message,true);else{notify("Campaign updated.");await load()}});if($("stamp"))$("stamp").onclick=()=>process("stamp");if($("redeem"))$("redeem").onclick=()=>process("redeem");if($("scan"))$("scan").onclick=startCamera}async function process(action){let token=$("token")?.value.trim().toLowerCase(),campaign=$("campaign")?.value;if(!/^[0-9a-f]{48}$/.test(token)){notify("Scan or paste a valid customer code.",true);return}if(!confirm(action==="stamp"?"Confirm qualifying purchase and issue stamp?":"Confirm reward was provided and redeem stamps?"))return;stopCamera();let r=await db.rpc("process_visit_token",{p_token:token,p_campaign:campaign,p_action:action});if(r.error){notify(r.error.message,true);return}notify(action==="stamp"?"Stamp approved!":"Reward redeemed!");await load()}async function startPromoCamera(){if(promoScanning){stopCamera();$("promoCamera").innerHTML="";return}if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){notify("Camera QR scanning unavailable. Enter voucher ID manually.",true);return}stopCamera();try{let detector=new BarcodeDetector({formats:["qr_code"]});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});let host=$("promoCamera");if(!host){stopCamera();return}host.innerHTML='<video id="promoVideo" autoplay muted playsinline style="width:100%;border-radius:14px"></video>';let v=$("promoVideo");v.srcObject=cameraStream;await v.play();promoScanning=true;let loop=async()=>{if(!promoScanning)return;try{let codes=await detector.detect(v);for(let code of codes){let id=String(code.rawValue||"").trim().replace(/^BIZHUNT_PROMO:/,"");if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){stopCamera();let input=document.querySelector('[name="voucher"]');if(input)input.value=id;host.textContent="QR scanned. Review voucher ID and press Verify & redeem.";return}}}catch(e){}if(promoScanning)scanTimer=setTimeout(loop,350)};loop()}catch(e){stopCamera();notify("Unable to open camera. Check permission or enter voucher ID manually.",true)}}async function startCamera(){if(scanning){stopCamera();$("camera").innerHTML="";return}if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){notify("Camera QR scanning unavailable in this browser. Paste the customer code instead.",true);return}try{let detector=new BarcodeDetector({formats:["qr_code"]});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("camera").innerHTML='<video id="video" autoplay muted playsinline></video><p class="muted">Point your camera at the customer QR.</p>';let v=$("video");v.srcObject=cameraStream;await v.play();scanning=true;let loop=async()=>{if(!scanning)return;try{let codes=await detector.detect(v);if(codes.length&&/^[0-9a-f]{48}$/.test(codes[0].rawValue)){let token=codes[0].rawValue;stopCamera();$("token").value=token;$("camera").innerHTML='<p class="notice success">QR scanned. Approve stamp or redeem reward.</p>';return}}catch{}scanTimer=setTimeout(loop,300)};loop()}catch(err){stopCamera();notify("Camera unavailable: "+err.message+". Paste the code instead.",true)}}init().catch(err=>notify(err.message,true));
