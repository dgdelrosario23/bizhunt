<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt Merchant Flyer</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1fc;font:16px system-ui;color:#273880}.page{max-width:650px;margin:24px auto;background:white;padding:36px;border-radius:24px;text-align:center;box-shadow:0 8px 35px #20275919}.logo{font-size:36px;font-weight:900}.logo span{color:#f4bc13}.hero{background:linear-gradient(125deg,#273880,#7447eb);color:white;padding:30px 20px;border-radius:20px;margin:20px 0}.hero h1{font-size:32px;margin:0 0 10px}#qr{display:flex;justify-content:center;margin:22px}.tag{background:#fff1bd;border-radius:30px;padding:8px 14px;display:inline-block}.small{color:#737a95;font-size:13px}.actions{text-align:center;margin:15px}button{background:#4169e1;color:white;border:0;border-radius:12px;padding:13px 22px;font:inherit;cursor:pointer}@media print{body{background:white}.page{box-shadow:none;margin:0;max-width:none}.actions{display:none}@page{size:A4;margin:12mm}}</style></head><body><div class="actions"><button onclick="window.print()">🖨️ Print / Save as PDF</button></div><main class="page"><div class="logo">Biz<span>Hunt</span> ✦</div><p>DISCOVER · SUPPORT · EARN LOCAL</p><div class="hero"><h1 id="business">Explore this local favorite!</h1><p id="area">Discover us on BizHunt</p></div><h2>Scan to explore our BizHunt profile</h2><div id="qr"></div><p class="tag">Find local businesses, deals & rewards</p><p class="small" id="link"></p><p class="small">BizHunt · Supporting local communities</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>(async()=>{let id=new URLSearchParams(location.search).get("business");if(!/^[0-9a-f-]{36}$/i.test(id||"")){document.getElementById("business").textContent="Choose a business from Merchant Hub";return}let db=window.supabase.createClient("https://cjvcqdlwadmuktxtdxcz.supabase.co","sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx");let r=await db.from("businesses").select("name,location").eq("id",id).single();if(r.error||!r.data){document.getElementById("business").textContent="Business unavailable";return}document.getElementById("business").textContent=r.data.name;document.getElementById("area").textContent=r.data.location;let url=location.origin+"/bizhunt/app/?business="+encodeURIComponent(id);document.getElementById("link").textContent=url;new QRCode(document.getElementById("qr"),{text:url,width:210,height:210,colorDark:"#273880",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H})})()</script></body></html>
