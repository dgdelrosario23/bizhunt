.moderation-item{border:1px solid #e0e8f6;border-radius:14px;padding:14px;margin:12px 0}.moderation-item p{overflow-wrap:anywhere}.moderation-actions{display:flex;gap:8px;flex-wrap:wrap}.moderation-actions button{font-size:13px}.moderation-note{background:#f3f6fc;padding:10px;border-radius:9px;white-space:pre-wrap}.management-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.management-tabs button{background:#e8efff;color:#273880}.management-tabs button.active{background:#273880;color:#fff}.record-card{border:1px solid #dfe7f6;border-radius:14px;padding:14px;margin:12px 0}.record-card summary{cursor:pointer;font-weight:750;overflow-wrap:anywhere}.record-card pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fc;border-radius:10px;padding:12px;font-size:12px;max-height:260px;overflow:auto}.record-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.record-actions .danger{background:#a6273b}.record-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.record-edit[hidden]{display:none!important}.record-edit label{font-size:12px;font-weight:700}.record-edit input,.manage-search{display:block;width:100%;padding:10px;border:1px solid #cbd6e9;border-radius:10px;margin-top:4px;font:inherit}.manage-toolbar{display:flex;gap:8px;flex-wrap:wrap}.manage-toolbar input{flex:1;min-width:170px}.audit-entry{padding:12px 0;border-bottom:1px solid #e7edf8}.audit-entry pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto;font-size:11px}@media(max-width:600px){.record-edit{grid-template-columns:1fr}}.unclaimed-tag,.claimed-tag{display:inline-block;font-size:11px;padding:4px 8px;border-radius:9px;margin:0 6px;background:#fff1d5;color:#865c0e}.claimed-tag{background:#e6f6ed;color:#166b45}</style></head><body><div class="shell"><header class="hero"><div class="top"><div class="brand">Biz<b>Hunt</b> ✦</div><a href="../app/">← Customer app</a></div><h1>Founder Dashboard 📈</h1><p>Startup growth, loyalty activity, and merchant traction.</p></header><div id="notice" role="status"></div><div id="content"><div class="panel">Checking founder access…</div></div><div id="moderation"></div><section id="missingPlaceModeration"></section><section id="recordManagement"></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const fmt=n=>Number(n||0).toLocaleString();let db;
function notice(s,bad){$("notice").innerHTML='<div class="'+(bad?"error":"success")+'">'+esc(s)+'</div>'}
function draw(d){const stats=[["👤","Registered users",d.users],["🏪","Total businesses",d.businesses],["⭐","Stamps issued",d.stamps],["🎁","Rewards redeemed",d.redemptions],["📍","Cities / areas covered*",d.cities],["🎯","Active campaigns",d.active_campaigns]];const months=d.monthly||[],max=Math.max(1,...months.map(m=>Number(m.stamps)||0));$("content").innerHTML='<div class="row"><h2>Platform overview</h2><button id="refresh">↻ Refresh</button></div><div class="grid">'+stats.map(x=>'<div class="stat"><div class="icon">'+x[0]+'</div><div class="label">'+esc(x[1])+'</div><strong>'+fmt(x[2])+'</strong></div>').join("")+'</div><div class="panel"><h2>Customer engagement</h2><div class="substats"><div class="substat"><strong>'+fmt(d.unique_customers)+'</strong><span>Customers who have earned a stamp</span></div><div class="substat"><strong>'+fmt(d.repeat_customers)+'</strong><span>Customers with at least 2 stamps</span></div></div><p class="muted">Repeat customers are defined here as accounts with two or more stamps across the platform, not necessarily separate visits or days.</p></div><div class="panel"><h2>Monthly stamps issued</h2><p class="muted">Last six calendar months · based on verified stamp transactions</p><div class="chart">'+months.map(m=>'<div class="barcol"><div class="barvalue">'+fmt(m.stamps)+'</div><div class="bar" style="height:'+Math.max(3,Math.round(Number(m.stamps||0)/max*140))+'px"></div><div class="barlabel">'+esc(m.month.slice(5))+'/'+esc(m.month.slice(2,4))+'</div></div>').join("")+'</div><h2 style="margin-top:28px">Monthly growth</h2><div style="overflow-x:auto"><table><thead><tr><th>Month</th><th class="num">New users</th><th class="num">New businesses</th><th class="num">Stamps</th><th class="num">Redemptions</th></tr></thead><tbody>'+months.map(m=>'<tr><td>'+esc(m.month)+'</td><td class="num">'+fmt(m.users)+'</td><td class="num">'+fmt(m.businesses)+'</td><td class="num">'+fmt(m.stamps)+'</td><td class="num">'+fmt(m.redemptions)+'</td></tr>').join("")+'</tbody></table></div></div><div class="panel"><h2>Top businesses by stamps</h2><div style="overflow-x:auto"><table><thead><tr><th>Business</th><th class="num">Stamps</th><th class="num">Redemptions</th></tr></thead><tbody>'+(d.top_businesses||[]).map(b=>'<tr><td><strong>'+esc(b.name)+'</strong><div class="muted">'+esc(b.location)+'</div></td><td class="num">'+fmt(b.stamps)+'</td><td class="num">'+fmt(b.redemptions)+'</td></tr>').join("")+'</tbody></table>'+(d.top_businesses?.length?"":'<div class="empty">No businesses registered yet.</div>')+'</div></div><p class="muted">*Cities/areas are approximated from the first comma-separated part of merchant-entered locations. These are not verified municipalities. Founder metrics come from server-side aggregates and require founder authorization.</p>';$("refresh").onclick=load}
async function load(){if(!db)return;const r=await db.rpc("founder_dashboard");if(r.error){$("content").innerHTML='<div class="panel"><h2>Dashboard unavailable</h2><p class="muted">This page is restricted to approved founder accounts. Run the founder analytics migration and authorize your account before using it.</p></div>';notice(r.error.message,true);await loadModeration();return}$("notice").innerHTML="";draw(r.data);founderQuickLinks();await loadModeration();await loadClaims();await loadRecordManagement();await loadMissingPlaceModeration()}
async function loadMissingPlaceModeration(){
 const el=$("missingPlaceModeration"),r=await db.rpc("bizhunt_founder_missing_queue");
 if(r.error){el.innerHTML='<div class="panel"><h2>📍 Missing place submissions</h2><p class="muted">Requires Phase 42 migration.</p><p class="error">'+esc(r.error.message)+'</p></div>';return}
 let items=(r.data||[]),pending=items.filter(x=>x.status==="pending");
 el.innerHTML='<div class="panel"><div class="row"><h2>📍 Missing place submissions ('+pending.length+' pending)</h2><button id="refreshMissing">Refresh</button></div><p class="muted">Check names, map coordinates and duplicates before approving. Approved places appear on the map only.</p>'+
 (pending.map(p=>'<div class="moderation-item"><strong>'+esc(p.name)+'</strong><p>'+esc(p.category)+' · '+esc(p.location)+'</p><p class="muted">Coordinates: '+esc(p.latitude)+', '+esc(p.longitude)+' · Submitted '+esc(p.created_at)+'</p>'+(p.notes?'<p>'+esc(p.notes)+'</p>':'')+'<div class="moderation-actions"><button data-missing-approve="'+esc(p.id)+'">Approve</button><button data-missing-reject="'+esc(p.id)+'">Reject</button></div></div>').join("")||'<p class="muted">No pending submissions.</p>')+'</div>';
 $("refreshMissing").onclick=loadMissingPlaceModeration;
 el.querySelectorAll("[data-missing-approve],[data-missing-reject]").forEach(b=>b.onclick=async()=>{
  let id=b.dataset.missingApprove||b.dataset.missingReject,approve=!!b.dataset.missingApprove;
  if(!confirm((approve?"Approve":"Reject")+" this place?"))return;
  let challenge=await db.rpc("bizhunt_founder_missing_challenge",{p_id:id});
  if(challenge.error)return notice(challenge.error.message,true);
  let code=prompt("Enter the one-time admin confirmation code within 5 minutes: "+challenge.data);
  if(code===null)return;
  b.disabled=true;let r=await db.rpc("bizhunt_founder_review_missing",{p_id:id,p_approve:approve,p_code:code.trim()});
  if(r.error){notice(r.error.message,true);b.disabled=false;return}
  notice("Submission "+(approve?"approved":"rejected")+". Audit log recorded.");
  await loadMissingPlaceModeration();
 })
}
async function loadModeration(){let el=$("moderation"),r=await db.rpc("bizhunt_moderation_queue");if(r.error){el.innerHTML='<div class="panel"><h2>🛡️ Moderation access</h2><p class="muted">Administrator authorization required. Run Phase 16 SQL and register the founder user ID in bizhunt_admins.</p></div>';return}let d=r.data||{},req=d.requests||[],reports=d.reports||[];el.innerHTML='<div class="panel"><div class="row"><h2>🛡️ Verification requests ('+req.length+')</h2><button id="reloadModeration">Refresh queue</button></div><p class="muted">Independently confirm business ownership before approving. The request note is not proof by itself.</p>'+(req.map(x=>'<div class="moderation-item"><strong>'+esc(x.business_name)+'</strong><p class="muted">Request '+esc(x.id)+' · '+esc(x.created_at)+'</p><p class="moderation-note">'+esc(x.evidence_note)+'</p><div class="moderation-actions"><button data-kind="verification" data-id="'+esc(x.id)+'" data-action="approved">Approve</button><button data-kind="verification" data-id="'+esc(x.id)+'" data-action="rejected">Reject</button></div></div>').join("")||'<p class="muted">No pending requests.</p>')+'</div><div class="panel"><h2>⚑ Reports ('+reports.length+')</h2>'+(reports.map(x=>'<div class="moderation-item"><strong>'+esc(x.business_name)+'</strong><p>'+esc(x.reason)+'</p><p class="moderation-note">'+esc(x.details)+'</p><p class="muted">Status: '+esc(x.status)+(x.review_id?' · Review '+esc(x.review_id):'')+'</p><div class="moderation-actions"><button data-kind="report" data-id="'+esc(x.id)+'" data-action="reviewing">Investigate</button><button data-kind="report" data-id="'+esc(x.id)+'" data-action="resolved">Resolve</button><button data-kind="report" data-id="'+esc(x.id)+'" data-action="dismissed">Dismiss</button></div></div>').join("")||'<p class="muted">No open reports.</p>')+'</div>';el.querySelector("#reloadModeration").onclick=loadModeration;el.querySelectorAll("[data-kind]").forEach(b=>b.onclick=async()=>{if(!confirm("Confirm "+b.dataset.action+"? This action will be recorded."))return;b.disabled=true;let res=await db.rpc("bizhunt_moderate",{p_kind:b.dataset.kind,p_id:b.dataset.id,p_action:b.dataset.action});if(res.error){notice(res.error.message,true);b.disabled=false}else{notice("Moderation action saved.");await loadModeration();await loadClaims()}})}
function founderQuickLinks(){let el=document.getElementById("founderQuickLinks");if(!el){el=document.createElement("section");el.id="founderQuickLinks";document.getElementById("content").before(el)}el.innerHTML='<div class="panel"><h2>🧭 Founder command center</h2><p class="muted">Review ownership claims and moderation requests, then open the live customer and merchant experiences.</p><div class="row"><a class="btn" href="../app/" target="_blank" rel="noopener noreferrer">Customer app</a><a class="btn" href="../hub/" target="_blank" rel="noopener noreferrer">Merchant Hub</a><button id="refreshFounderQueues">↻ Refresh queues</button></div></div>';document.getElementById("refreshFounderQueues").onclick=async()=>{await loadModeration();await loadClaims()}}
async function loadClaims(){let el=document.getElementById("claimQueue");if(!el){el=document.createElement("section");el.id="claimQueue";document.getElementById("moderation").after(el)}let r=await db.rpc("founder_community_claims");if(r.error){el.innerHTML='<div class="panel"><h2>🏪 Community claims</h2><p class="muted">Claim review unavailable. Apply Phase 25 SQL and check founder permissions.</p></div>';return}let rows=r.data||[];el.innerHTML='<div class="panel"><h2>🏪 Community business claims ('+rows.filter(x=>x.status==="pending").length+' pending)</h2><p class="muted">Confirm ownership independently before approval. Approval does not transfer access automatically.</p>'+rows.map(x=>'<div class="moderation-item"><strong>'+esc(x.business_name)+'</strong><p>'+esc(x.contact_name)+' · '+esc(x.role_at_business)+'</p><p class="muted">'+esc(x.contact_email)+' · '+esc(x.status)+'</p><p>'+esc(x.message||"")+'</p>'+(x.evidence_url&&/^https:\/\//.test(x.evidence_url)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(x.evidence_url)+'">Evidence link</a>':'')+(x.status==="pending"?'<div class="moderation-actions"><button data-claim="'+esc(x.id)+'" data-decision="approved">Approve</button><button data-claim="'+esc(x.id)+'" data-decision="rejected">Reject</button></div>':'')+'</div>').join("")+'</div>';el.querySelectorAll("[data-claim]").forEach(b=>b.onclick=async()=>{if(!confirm("Confirm "+b.dataset.decision+"? This only records the review decision."))return;b.disabled=true;let r=await db.rpc("founder_review_community_claim",{p_claim_id:b.dataset.claim,p_action:b.dataset.decision});if(r.error){notice(r.error.message,true);b.disabled=false}else{notice("Claim decision recorded.");await loadClaims()}})}

let managementType="users",managementSearch="",managementOffset=0;
const managementFields={curated:["name","category","location","description"],unclaimed_businesses:["name","category","location","description","phone","website","instagram"],users:["display_name","username","bio"],businesses:["name","category","location","description","phone","website","instagram"]};
async function loadRecordManagement(){
 const el=$("recordManagement");if(!el)return;
 let r=managementType==="curated"?await db.rpc("bizhunt_founder_curated_records",{p_search:managementSearch,p_limit:30,p_offset:managementOffset}):await db.rpc("bizhunt_founder_records",{p_type:managementType,p_search:managementSearch,p_limit:30,p_offset:managementOffset});
 if(r.error){el.innerHTML='<div class="panel"><h2>👥 Users & businesses</h2><p class="muted">Record management requires Phase 39 SQL migration and founder admin access.</p><p class="error">'+esc(r.error.message)+'</p></div>';return}
 let records=r.data||[];
 el.innerHTML='<div class="panel"><h2>👥 System records</h2><p class="muted">Sensitive credentials are never displayed. Editing is limited to approved fields. Deletions are permanent and may cascade to linked records.</p><div class="management-tabs"><button data-management="users" class="'+(managementType==="users"?"active":"")+'">Users</button><button data-management="businesses" class="'+(managementType==="businesses"?"active":"")+'">All businesses</button><button data-management="unclaimed_businesses" class="'+(managementType==="unclaimed_businesses"?"active":"")+'">Unclaimed (registered)</button><button data-management="curated" class="'+(managementType==="curated"?"active":"")+'">Sample listings</button><button data-management="logs">Audit logs</button></div><form id="manageSearch" class="manage-toolbar"><input class="manage-search" name="search" value="'+esc(managementSearch)+'" placeholder="Search name, email or ID"><button>Search</button></form><div id="manageRows">'+records.map(x=>{let id=x.id,primary=managementType==="users"?(x.display_name||x.email||id):(x.name||id);return '<details class="record-card"><summary>'+esc(primary)+(managementType!=="users"?(x.is_unclaimed||!x.owner_id?' <span class="unclaimed-tag">Unclaimed</span>':' <span class="claimed-tag">Claimed</span>'):'')+' <span class="muted">· '+esc(id)+'</span></summary><pre>'+esc(JSON.stringify(x,null,2))+'</pre><div class="record-actions"><button type="button" data-record-edit="'+esc(id)+'">Edit</button><button type="button" class="danger" data-record-delete="'+esc(id)+'">Delete</button></div><form class="record-edit" data-record-form="'+esc(id)+'" hidden>'+managementFields[managementType].map(k=>'<label>'+esc(k)+'<input name="'+esc(k)+'" value="'+esc(x[k]??"")+'"></label>').join('')+'<div><button type="submit">Review changes</button> <button type="button" class="btn" data-record-cancel="'+esc(id)+'">Cancel</button></div></form></details>'}).join("")+'</div><div class="row"><button id="managePrev" '+(managementOffset===0?"disabled":"")+'>← Previous</button><span class="muted">Showing '+records.length+' records · offset '+managementOffset+'</span><button id="manageNext" '+(records.length<30?"disabled":"")+'>Next →</button></div></div>';
 el.querySelectorAll("[data-management]").forEach(b=>b.onclick=()=>{if(b.dataset.management==="logs")return loadFounderLogs();managementType=b.dataset.management;managementOffset=0;managementSearch="";loadRecordManagement()});
 $("manageSearch").onsubmit=e=>{e.preventDefault();managementSearch=new FormData(e.target).get("search").trim();managementOffset=0;loadRecordManagement()};
 $("managePrev").onclick=()=>{managementOffset=Math.max(0,managementOffset-30);loadRecordManagement()};
 $("manageNext").onclick=()=>{managementOffset+=30;loadRecordManagement()};
 el.querySelectorAll("[data-record-edit]").forEach(b=>b.onclick=()=>{const form=el.querySelector('[data-record-form="'+b.dataset.recordEdit+'"]');form.hidden=!form.hidden});
 el.querySelectorAll("[data-record-cancel]").forEach(b=>b.onclick=()=>{el.querySelector('[data-record-form="'+b.dataset.recordCancel+'"]').hidden=true});
 el.querySelectorAll("[data-record-form]").forEach(form=>form.onsubmit=e=>{e.preventDefault();const id=form.dataset.recordForm,record=records.find(x=>x.id===id);let changes={};for(const [key,value] of new FormData(form)){if(value!==String(record[key]??""))changes[key]=value}if(!Object.keys(changes).length)return notice("No changes to save.",true);confirmRecordAction(managementType==="unclaimed_businesses"?"businesses":managementType,id,"update",changes)});
 el.querySelectorAll("[data-record-delete]").forEach(b=>b.onclick=()=>confirmRecordAction(managementType==="unclaimed_businesses"?"businesses":managementType,b.dataset.recordDelete,"delete",{}));
}
async function confirmRecordAction(type,id,action,changes){
 let summary=action==="delete"?"PERMANENT DELETE: This may remove associated records and cannot be undone.":"Save these changes: "+JSON.stringify(changes);
 if(!confirm(summary+"\n\nContinue to admin verification?"))return;
 let r=type==="curated"?await db.rpc("bizhunt_founder_curated_challenge",{p_id:id,p_action:action}):await db.rpc("bizhunt_founder_challenge",{p_type:type,p_id:id,p_action:action});
 if(r.error)return notice(r.error.message,true);
 let code=prompt("Admin confirmation required. Enter this one-time code within 5 minutes: "+r.data+"\n\nRecord: "+id+"\nAction: "+action);
 if(code===null)return;
 let result=type==="curated"?await db.rpc("bizhunt_founder_curated_mutate",{p_id:id,p_action:action,p_code:code.trim(),p_changes:changes}):await db.rpc("bizhunt_founder_mutate",{p_type:type,p_id:id,p_action:action,p_code:code.trim(),p_changes:changes});
 if(result.error)return notice(result.error.message,true);
 notice((action==="delete"?"Deleted":"Updated")+" successfully. Audit log recorded.");
 await loadRecordManagement();
}
async function loadFounderLogs(){
 const el=$("recordManagement"),r=await db.rpc("bizhunt_founder_logs",{p_limit:50});
 if(r.error){notice(r.error.message,true);return}
 el.innerHTML='<div class="panel"><div class="row"><h2>📋 Founder audit logs</h2><button id="backRecords">← Records</button></div><p class="muted">Most recent 50 successful administrative edits and deletions, including before and after snapshots.</p>'+((r.data||[]).map(x=>'<div class="audit-entry"><strong>'+esc(x.action.toUpperCase())+' · '+esc(x.entity_type)+'</strong><p class="muted">'+esc(x.created_at)+' · Admin '+esc(x.actor_id)+' · Record '+esc(x.entity_id)+'</p><details><summary>View changes</summary><pre>Before: '+esc(JSON.stringify(x.before_data,null,2))+'\nAfter: '+esc(JSON.stringify(x.after_data,null,2))+'</pre></details></div>').join("")||'<p class="muted">No changes recorded yet.</p>')+'</div>';
 $("backRecords").onclick=loadRecordManagement;
}
async function init(){if(!window.supabase){notice("Unable to load Supabase. Refresh the page.",true);return}db=window.supabase.createClient(SUPABASE_URL,KEY);const {data,error}=await db.auth.getUser();if(error||!data.user){$("content").innerHTML='<div class="panel"><h2>Sign in required</h2><p>Use your BizHunt personal account to access founder analytics.</p><a class="btn" href="../account/">Sign in →</a></div>';return}await load()}init().catch(e=>notice(e.message,true));
</script></body></html>
