<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt Founder Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#24345e;font:15px system-ui,-apple-system,sans-serif}.shell{max-width:1120px;margin:auto;padding:0 18px 50px}.hero{background:linear-gradient(125deg,#273880,#4169e1);color:white;border-radius:0 0 25px 25px;padding:26px;margin-bottom:25px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:25px}.brand b{color:#ffda59}.hero h1{font-size:28px;margin:25px 0 6px}.hero p{color:#e3eaff;margin:0}.hero a{color:#fff}.panel{background:white;border:1px solid #e0e8f6;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 5px 18px #2738800a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stat{padding:20px;border:1px solid #e0e8f6;border-radius:18px;background:white;min-width:0}.stat:nth-child(3n+1){background:#edf3ff}.stat:nth-child(3n+2){background:#fff8dc}.stat:nth-child(3n){background:#eaf8f3}.stat .icon{font-size:24px}.stat .label{font-size:13px;color:#576783;font-weight:650;margin-top:12px}.stat strong{display:block;font-size:35px;color:#273880;margin-top:8px;font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-size:20px;margin:0 0 12px}button,.btn{border:0;background:#273880;color:white;border-radius:12px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6}.muted{color:#6b7891;font-size:13px;line-height:1.6}.error{background:#ffe8ed;color:#9e214a;padding:15px;border-radius:12px}.success{background:#e8f7ee;padding:12px;border-radius:12px}#notice:empty{display:none}.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;min-height:210px;border-bottom:1px solid #dbe4f4;padding:20px 0 0}.barcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:190px;min-width:0}.bar{width:min(42px,85%);background:linear-gradient(#4169e1,#273880);border-radius:9px 9px 0 0;min-height:3px}.barvalue{font-size:11px;font-weight:800}.barlabel{font-size:10px;color:#6b7891;text-align:center;white-space:nowrap}table{width:100%;border-collapse:collapse}th,td{padding:13px 9px;text-align:left;border-bottom:1px solid #e7edf8}th{color:#6b7891;font-size:12px}td.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}.empty{padding:25px;text-align:center;color:#6b7891}.substats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.substat{background:#eef3ff;border-radius:14px;padding:16px}.substat strong{display:block;font-size:24px;color:#273880}.substat span{font-size:12px;color:#53627d}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px}.stat strong{font-size:29px}.hero h1{font-size:24px}.panel{padding:15px}.barlabel{font-size:9px}.chart{gap:4px}.substats{grid-template-columns:1fr}}@media(max-width:360px){.stat .label{font-size:11px}.stat strong{font-size:26px}}
.moderation-item{border:1px solid #e0e8f6;border-radius:14px;padding:14px;margin:12px 0}.moderation-item p{overflow-wrap:anywhere}.moderation-actions{display:flex;gap:8px;flex-wrap:wrap}.moderation-actions button{font-size:13px}.moderation-note{background:#f3f6fc;padding:10px;border-radius:9px;white-space:pre-wrap}</style></head><body><div class="shell"><header class="hero"><div class="top"><div class="brand">Biz<b>Hunt</b> ✦</div><a href="../app/">← Customer app</a></div><h1>Founder Dashboard 📈</h1><p>Startup growth, loyalty activity, and merchant traction.</p></header><div id="notice" role="status"></div><div id="content"><div class="panel">Checking founder access…</div></div><div id="moderation"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const fmt=n=>Number(n||0).toLocaleString();let db;
function notice(s,bad){$("notice").innerHTML='<div class="'+(bad?"error":"success")+'">'+esc(s)+'</div>'}
function draw(d){const stats=[["👤","Registered users",d.users],["🏪","Total businesses",d.businesses],["⭐","Stamps issued",d.stamps],["🎁","Rewards redeemed",d.redemptions],["📍","Cities / areas covered*",d.cities],["🎯","Active campaigns",d.active_campaigns]];const months=d.monthly||[],max=Math.max(1,...months.map(m=>Number(m.stamps)||0));$("content").innerHTML='<div class="row"><h2>Platform overview</h2><button id="refresh">↻ Refresh</button></div><div class="grid">'+stats.map(x=>'<div class="stat"><div class="icon">'+x[0]+'</div><div class="label">'+esc(x[1])+'</div><strong>'+fmt(x[2])+'</strong></div>').join("")+'</div><div class="panel"><h2>Customer engagement</h2><div class="substats"><div class="substat"><strong>'+fmt(d.unique_customers)+'</strong><span>Customers who have earned a stamp</span></div><div class="substat"><strong>'+fmt(d.repeat_customers)+'</strong><span>Customers with at least 2 stamps</span></div></div><p class="muted">Repeat customers are defined here as accounts with two or more stamps across the platform, not necessarily separate visits or days.</p></div><div class="panel"><h2>Monthly stamps issued</h2><p class="muted">Last six calendar months · based on verified stamp transactions</p><div class="chart">'+months.map(m=>'<div class="barcol"><div class="barvalue">'+fmt(m.stamps)+'</div><div class="bar" style="height:'+Math.max(3,Math.round(Number(m.stamps||0)/max*140))+'px"></div><div class="barlabel">'+esc(m.month.slice(5))+'/'+esc(m.month.slice(2,4))+'</div></div>').join("")+'</div><h2 style="margin-top:28px">Monthly growth</h2><div style="overflow-x:auto"><table><thead><tr><th>Month</th><th class="num">New users</th><th class="num">New businesses</th><th class="num">Stamps</th><th class="num">Redemptions</th></tr></thead><tbody>'+months.map(m=>'<tr><td>'+esc(m.month)+'</td><td class="num">'+fmt(m.users)+'</td><td class="num">'+fmt(m.businesses)+'</td><td class="num">'+fmt(m.stamps)+'</td><td class="num">'+fmt(m.redemptions)+'</td></tr>').join("")+'</tbody></table></div></div><div class="panel"><h2>Top businesses by stamps</h2><div style="overflow-x:auto"><table><thead><tr><th>Business</th><th class="num">Stamps</th><th class="num">Redemptions</th></tr></thead><tbody>'+(d.top_businesses||[]).map(b=>'<tr><td><strong>'+esc(b.name)+'</strong><div class="muted">'+esc(b.location)+'</div></td><td class="num">'+fmt(b.stamps)+'</td><td class="num">'+fmt(b.redemptions)+'</td></tr>').join("")+'</tbody></table>'+(d.top_businesses?.length?"":'<div class="empty">No businesses registered yet.</div>')+'</div></div><p class="muted">*Cities/areas are approximated from the first comma-separated part of merchant-entered locations. These are not verified municipalities. Founder metrics come from server-side aggregates and require founder authorization.</p>';$("refresh").onclick=load}
async function load(){if(!db)return;const r=await db.rpc("founder_dashboard");if(r.error){$("content").innerHTML='<div class="panel"><h2>Dashboard unavailable</h2><p class="muted">This page is restricted to approved founder accounts. Run the founder analytics migration and authorize your account before using it.</p></div>';notice(r.error.message,true);await loadModeration();return}$("notice").innerHTML="";draw(r.data);await loadModeration()}
async function loadModeration(){let el=$("moderation"),r=await db.rpc("bizhunt_moderation_queue");if(r.error){el.innerHTML='<div class="panel"><h2>🛡️ Moderation access</h2><p class="muted">Administrator authorization required. Run Phase 16 SQL and register the founder user ID in bizhunt_admins.</p></div>';return}let d=r.data||{},req=d.requests||[],reports=d.reports||[];el.innerHTML='<div class="panel"><div class="row"><h2>🛡️ Verification requests ('+req.length+')</h2><button id="reloadModeration">Refresh queue</button></div><p class="muted">Independently confirm business ownership before approving. The request note is not proof by itself.</p>'+(req.map(x=>'<div class="moderation-item"><strong>'+esc(x.business_name)+'</strong><p class="muted">Request '+esc(x.id)+' · '+esc(x.created_at)+'</p><p class="moderation-note">'+esc(x.evidence_note)+'</p><div class="moderation-actions"><button data-kind="verification" data-id="'+esc(x.id)+'" data-action="approved">Approve</button><button data-kind="verification" data-id="'+esc(x.id)+'" data-action="rejected">Reject</button></div></div>').join("")||'<p class="muted">No pending requests.</p>')+'</div><div class="panel"><h2>⚑ Reports ('+reports.length+')</h2>'+(reports.map(x=>'<div class="moderation-item"><strong>'+esc(x.business_name)+'</strong><p>'+esc(x.reason)+'</p><p class="moderation-note">'+esc(x.details)+'</p><p class="muted">Status: '+esc(x.status)+(x.review_id?' · Review '+esc(x.review_id):'')+'</p><div class="moderation-actions"><button data-kind="report" data-id="'+esc(x.id)+'" data-action="reviewing">Investigate</button><button data-kind="report" data-id="'+esc(x.id)+'" data-action="resolved">Resolve</button><button data-kind="report" data-id="'+esc(x.id)+'" data-action="dismissed">Dismiss</button></div></div>').join("")||'<p class="muted">No open reports.</p>')+'</div>';el.querySelector("#reloadModeration").onclick=loadModeration;el.querySelectorAll("[data-kind]").forEach(b=>b.onclick=async()=>{if(!confirm("Confirm "+b.dataset.action+"? This action will be recorded."))return;b.disabled=true;let res=await db.rpc("bizhunt_moderate",{p_kind:b.dataset.kind,p_id:b.dataset.id,p_action:b.dataset.action});if(res.error){notice(res.error.message,true);b.disabled=false}else{notice("Moderation action saved.");await loadModeration()}})}
async function init(){if(!window.supabase){notice("Unable to load Supabase. Refresh the page.",true);return}db=window.supabase.createClient(SUPABASE_URL,KEY);const {data,error}=await db.auth.getUser();if(error||!data.user){$("content").innerHTML='<div class="panel"><h2>Sign in required</h2><p>Use your BizHunt personal account to access founder analytics.</p><a class="btn" href="../account/">Sign in →</a></div>';return}await load()}init().catch(e=>notice(e.message,true));
</script></body></html>
