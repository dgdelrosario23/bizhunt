async function loadMissingPlaceModeration(){
 const el=$("missingPlaceModeration"),r=await db.rpc("bizhunt_founder_missing_queue");
 if(r.error){el.innerHTML='<div class="panel"><h2>📍 Missing place submissions</h2><p class="muted">Requires Phase 42 migration.</p><p class="error">'+esc(r.error.message)+'</p></div>';return}
 let items=(r.data||[]),pending=items.filter(x=>x.status==="pending");
 el.innerHTML='<div class="panel"><div class="row"><h2>📍 Missing place submissions ('+pending.length+' pending)</h2></div><p class="muted">Check names, map coordinates and duplicates before approving. Approved places appear on the map only.</p>'+
 (pending.map(p=>'<div class="moderation-item"><strong>'+esc(p.name)+'</strong><p>'+esc(p.category)+' · '+esc(p.location)+'</p><p class="muted">Coordinates: '+esc(p.latitude)+', '+esc(p.longitude)+' · Submitted '+esc(p.created_at)+'</p>'+(p.notes?'<p>'+esc(p.notes)+'</p>':'')+'<div class="moderation-actions"><button data-missing-approve="'+esc(p.id)+'">Approve</button><button data-missing-reject="'+esc(p.id)+'">Reject</button></div></div>').join("")||'<p class="muted">No pending submissions.</p>')+'</div>';

 el.querySelectorAll("[data-missing-approve],[data-missing-reject]").forEach(b=>b.onclick=async()=>{
  let id=b.dataset.missingApprove||b.dataset.missingReject,approve=!!b.dataset.missingApprove;
  if(!confirm((approve?"Approve":"Reject")+" this place?"))return;
  let challenge=await db.rpc("bizhunt_founder_missing_challenge",{p_id:id});
  if(challenge.error)return notice(challenge.error.message,true);

  if(code===null)return;

 })
}

  }
  const logo=fd.get("logoFile"),cover=fd.get("coverFile"),galleryFiles=Array.from(form.querySelector('[name="galleryFiles"]').files||[]);
  if(curatedEditorGallery.length+galleryFiles.length>8)throw Error("Maximum eight gallery photos.");
  const id=String(x.id);const logoPath=(logo&&logo.size?await curatedUpload(logo,id,"logo"):x.logo_path)||null;
  const coverPath=(cover&&cover.size?await curatedUpload(cover,id,"cover"):x.cover_path)||null;
  const added=[];for(const file of galleryFiles)added.push(await curatedUpload(file,id,"gallery"));
  const result=await db.rpc("bizhunt_founder_curated_media_save",{p_id:id,p_logo_path:logoPath,p_cover_path:coverPath,p_gallery_paths:[...curatedEditorGallery,...added],p_opening_hours:String(fd.get("opening_hours")||"").trim(),p_weekly_hours:weekly,p_phone:String(fd.get("phone")||"").trim(),p_website:website,p_instagram:String(fd.get("instagram")||"").trim()});
  if(result.error)throw result.error;
  status.textContent="Saved successfully.";notice("Community listing updated. Reload Discover to see changes.");
  await loadCuratedEditor();$("curatedEditorSelect").value=id;showCuratedEditor(id);
 }catch(e){status.textContent=e.message||"Unable to save";notice(e.message||"Unable to save",true)}finally{btn.disabled=false}
}
async function init(){if(!window.supabase){notice("Unable to load Supabase. Refresh the page.",true);return}db=window.supabase.createClient(SUPABASE_URL,KEY);const {data,error}=await db.auth.getUser();if(error||!data.user){$("content").innerHTML='<div class="panel"><h2>Sign in required</h2><p>Use your BizHunt personal account to access founder analytics.</p><a class="btn" href="../account/">Sign in →</a></div>';return}await load();if($("loadCuratedEditor"))$("loadCuratedEditor").onclick=loadCuratedEditor}init().catch(e=>notice(e.message,true));
</script></body></html>
