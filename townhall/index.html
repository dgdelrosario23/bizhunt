<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town Hall · BizHunt</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#24345e;font:15px system-ui,sans-serif}.shell{max-width:620px;min-height:100vh;margin:auto;background:#fff;padding:20px 17px 70px}a{color:#273880}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}header a{text-decoration:none;font-weight:750}.brand{font-size:19px;font-weight:900;color:#273880}h1{margin:0 0 6px;font-size:29px}p{line-height:1.5}.muted{color:#64718d;font-size:13px}.card{border:1px solid #e1e8f5;border-radius:18px;padding:17px;margin:14px 0;background:white;box-shadow:0 3px 14px #27388009}input,textarea,select{width:100%;border:1px solid #cbd6eb;border-radius:11px;padding:12px;font:inherit;margin:6px 0 12px;background:white;color:#24345e}textarea{min-height:90px;resize:vertical}label{display:block;font-weight:700;font-size:13px}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 14px;background:#273880;color:white;font-weight:750}button:disabled{opacity:.55;cursor:wait}.alt{background:#edf2ff;color:#273880}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.post-title{font-size:18px;font-weight:800;margin:8px 0}.tag{font-size:11px;background:#edf2ff;color:#273880;border-radius:30px;padding:5px 9px;font-weight:700}.post-body{white-space:pre-wrap;overflow-wrap:anywhere}.votes{margin-top:14px}.voted{background:#dce8ff;color:#1535a2}.comment{padding:12px 0;border-top:1px solid #edf0f6;white-space:pre-wrap;overflow-wrap:anywhere}.comment small{display:block;margin-bottom:5px;color:#6b7892}.status{color:#a32334}.toolbar{display:flex;gap:8px;margin:15px 0}.toolbar button{flex:1}.empty{text-align:center;padding:30px;color:#64718d}details summary{cursor:pointer;font-weight:750;color:#273880;padding:9px 0}#composer{margin-top:18px}#composer[hidden]{display:none!important}#toggleComposer{width:100%;margin-top:12px}</style></head><body><div class="shell"><header><a href="/app/?section=profile">← Back to Profile</a><span class="brand">BizHunt ✦</span></header><h1>🏛️ Town Hall</h1><p class="muted">Shape the future of BizHunt. Suggest features, share improvements, vote on ideas, and join the discussion.</p><div id="status" role="status"></div><button id="toggleComposer" type="button" aria-controls="composer" aria-expanded="false">＋ Share your idea</button><section id="composer" class="card" hidden><h3>Share your idea</h3><form id="newPost"><label>Type<select name="category"><option>Feature request</option><option>Improvement</option><option>Bug report</option></select></label><label>Title<input name="title" required minlength="5" maxlength="140" placeholder="What should BizHunt improve?"></label><label>Describe your idea<textarea name="body" required minlength="10" maxlength="3000" placeholder="Explain the problem and your proposed solution"></textarea></label><button type="submit">Post suggestion</button></form></section><div class="toolbar"><button class="alt" id="sortTop">Top voted</button><button class="alt" id="sortNew">Newest</button></div><div id="feed"><div class="empty">No post yet.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let user,posts=[],votes=[],comments=[],sort="top",busy=false;function msg(t){$("status").textContent=t||""}function time(x){return new Date(x).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}async function load(){const [p,v,c]=await Promise.all([db.from("townhall_posts").select("*").order("created_at",{ascending:false}).limit(100),db.from("townhall_votes").select("post_id,user_id").limit(10000),db.from("townhall_comments").select("*").order("created_at",{ascending:true}).limit(5000)]);if(p.error||v.error||c.error){$("feed").innerHTML='<div class="empty">No post yet.</div>';msg("Unable to load posts. Check Town Hall database setup. "+(p.error||v.error||c.error).message);return}posts=p.data||[];votes=v.data||[];comments=c.data||[];draw()}function draw(){let arr=[...posts].sort((a,b)=>sort==="top"?(votes.filter(v=>v.post_id===b.id).length-votes.filter(v=>v.post_id===a.id).length)||new Date(b.created_at)-new Date(a.created_at):new Date(b.created_at)-new Date(a.created_at));$("feed").innerHTML=arr.length?arr.map(p=>{let n=votes.filter(v=>v.post_id===p.id).length,mine=votes.some(v=>v.post_id===p.id&&v.user_id===user.id),replies=comments.filter(c=>c.post_id===p.id);return '<article class="card"><div class="row"><span class="tag">'+esc(p.category)+'</span><span class="muted">'+time(p.created_at)+'</span></div><h2 class="post-title">'+esc(p.title)+'</h2><p class="post-body">'+esc(p.body)+'</p><div class="row votes"><button class="'+(mine?"voted":"alt")+'" data-vote="'+p.id+'">▲ '+n+' Upvote'+(n===1?"":"s")+'</button><span class="muted">💬 '+replies.length+' comments</span></div><details><summary>View discussion</summary>'+replies.map(c=>'<div class="comment"><small>'+time(c.created_at)+(c.author_id===user.id?" · You":" · Member")+'</small>'+esc(c.body)+'</div>').join("")+'<form class="commentForm" data-post="'+p.id+'"><label>Add a comment<textarea name="body" required minlength="2" maxlength="1500" placeholder="Be constructive and respectful"></textarea></label><button type="submit">Comment</button></form></details></article>'}).join(""):'<div class="empty">No post yet.</div>'}async function init(){$("toggleComposer").onclick=()=>{let panel=$("composer"),open=panel.hidden;panel.hidden=!open;$("toggleComposer").setAttribute("aria-expanded",String(open));$("toggleComposer").textContent=open?"× Cancel":"＋ Share your idea";if(open)panel.querySelector("input[name=title]").focus()};$("sortTop").onclick=()=>{sort="top";draw()};$("sortNew").onclick=()=>{sort="new";draw()};$("newPost").onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const b=e.target.querySelector('button[type="submit"]');b.disabled=true;let f=new FormData(e.target),r=await db.from("townhall_posts").insert({author_id:user.id,category:f.get("category"),title:String(f.get("title")).trim(),body:String(f.get("body")).trim()});busy=false;b.disabled=false;if(r.error)return msg(r.error.message);e.target.reset();$("composer").hidden=true;$("toggleComposer").textContent="＋ Share your idea";$("toggleComposer").setAttribute("aria-expanded","false");msg("Suggestion posted!");await load()};$("feed").onclick=async e=>{let b=e.target.closest("[data-vote]");if(!b||busy)return;busy=true;b.disabled=true;let id=b.dataset.vote,mine=votes.some(v=>v.post_id===id&&v.user_id===user.id);let r=mine?await db.from("townhall_votes").delete().eq("post_id",id).eq("user_id",user.id):await db.from("townhall_votes").insert({post_id:id,user_id:user.id});busy=false;if(r.error)msg(r.error.message);await load()};$("feed").onsubmit=async e=>{if(!e.target.matches(".commentForm"))return;e.preventDefault();if(busy)return;busy=true;let b=e.target.querySelector("button");b.disabled=true;let r=await db.from("townhall_comments").insert({post_id:e.target.dataset.post,author_id:user.id,body:String(new FormData(e.target).get("body")).trim()});busy=false;b.disabled=false;if(r.error)return msg(r.error.message);msg("Comment posted!");await load()};try{const {data,error}=await db.auth.getUser();if(error)throw error;user=data?.user;if(!user){msg("Sign in to post, vote, or comment.");$("newPost").onsubmit=e=>{e.preventDefault();location.href="../account/"};return}await load()}catch(e){msg("Unable to connect to Town Hall: "+e.message);$("feed").innerHTML='<div class="empty">No post yet.</div>'}}init().catch(e=>msg(e.message));
</script></body></html>
