const SUPABASE_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const db=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let user,posts=[],votes=[],comments=[],sort="top",busy=false,profiles={},isFounder=false,follows=[],followAvailable=false,view="all";function msg(t){$("status").textContent=t||""}function time(x){return new Date(x).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}async function load(){let p;try{p=await db.from("townhall_posts").select("*").order("created_at",{ascending:false}).limit(100)}catch(e){p={error:e}}if(p.error){$("feed").innerHTML='<div class="empty">Could not load Town Hall posts. <button type="button" class="alt" id="retryFeed">Retry</button></div>';$("retryFeed").onclick=()=>load();msg("Unable to load posts: "+p.error.message);return false}posts=p.data||[];const ids=[...new Set(posts.map(x=>x.author_id).filter(Boolean))];if(ids.length){try{const pr=await db.from("community_profiles").select("user_id,username,display_name").in("user_id",ids);if(!pr.error)profiles=Object.fromEntries((pr.data||[]).map(x=>[x.user_id,x]))}catch(_){}}const [v,c]=await Promise.allSettled([db.from("townhall_votes").select("post_id,user_id").limit(10000),db.from("townhall_comments").select("*").order("created_at",{ascending:true}).limit(5000)]);const vr=v.status==="fulfilled"?v.value:{error:v.reason},cr=c.status==="fulfilled"?c.value:{error:c.reason};votes=vr.error?[]:vr.data||[];comments=cr.error?[]:cr.data||[];const commentAuthorIds=[...new Set(comments.map(c=>c.author_id).filter(id=>id&&!profiles[id]))];if(commentAuthorIds.length){try{const pr=await db.from("community_profiles").select("user_id,username,display_name").in("user_id",commentAuthorIds);if(!pr.error)for(const profile of pr.data||[])profiles[profile.user_id]=profile}catch(_){}}if(user){tr e)+'</strong>'+(cp?.username&&cp.display_name?" · @"+esc(cp.username):"")+' · '+time(c.created_at)+'</small>'+esc(c.body)+'</div>'}).join("")+'<form class="commentForm" data-post="'+id+'"><label>Add a comment<textarea name="body" required minlength="2" maxlength="1500" placeholder="Be constructive and respectful"></textarea></label><button type="submit">Comment</button></form></div></article>'}).join(""):'<div class="empty">'+(posts.length?"No suggestions match your filters.":"No post yet.")+'</div>'}async function init(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));draw()});["searchIdeas","filterCategory","filterStatus"].forEach(id=>$(id).addEventListener(id==="searchIdeas"?"input":"change",draw));$("sortTop").onclick=()=>{sort="top";draw()};$("sortNew").onclick=()=>{sort="new";draw()};$("newPost").onsubmit=async e=>{e.preventDefault();if(busy)return;const status=$("postStatus"),b=e.target.querySelector('button[type="submit"]');const feedback=(message,isError=false)=>{status.textContent=message;status.style.color=isError?"#a32334":"#17643a";msg(message)};if(!user){feedback("Please sign in before posting.",true);return}busy=true;b.disabled=true;b.textContent="Posting…";feedback("Submitting your suggestion…");const f=new FormData(e.target),payload={author_id:user.id,category:f.get("category"),title:String(f.get("title")).trim(),body:String(f.get("body")).trim()};try{const request=db.from("townhall_posts").insert(payload).select("*").single();const r=await Promise.race([request,new Promise((_,reject)=>setTimeout(()=>reject(new Error("The request is taking too long. Please check your connection and refresh Town Hall before trying again, to avoid duplicate posts.")),15000))]);if(r.error)throw r.error;e.target.reset();$("composer").hidden=true;$("toggleComposer").textContent="＋ Share your idea";$("toggleComposer").setAttribute("aria-expanded","false");posts=[r.data,...posts.filter(p=>p.id!==r.data.id)];sort="new";draw();feedback("Suggestion posted!");const ok=await load();if(ok)feedback("Suggestion posted!");else feedback("Suggestion posted, but the feed could not refresh. Your post was saved; try Retry.")}catch(err){feedback("Could not post suggestion: "+(err.message||String(err))+". Your draft is still here.",true)}finally{busy=false;b.disabled=false;b.textContent="Post suggestion"}};$("feed").onclick=async e=>{const follow=e.target.closest("[data-follow]");if(follow){if(busy||!followAvailable)return;busy=true;follow.disabled=true;const id=follow.dataset.follow,exists=follows.some(f=>f.post_id===id);try{const r=exists?await db.from("townhall_follows").delete().eq("post_id",id).eq("user_id",user.id):await db.from("townhall_follows").insert({post_id:id,user_id:user.id});if(r.error)throw r.error;follows=exists?follows.filter(f=>f.post_id!==id):[...follows,{post_id:id}];draw();msg(exists?"Suggestion unfollowed.":"Suggestion added to Following.")}catch(err){msg("Unable to update follow: "+err.message)}finally{busy=false;follow.disabled=false}return}const discussion=e.target.closest("[data-discussion-toggle]");if(discussion){const panel=document.getElementById("discussion-"+discussion.dataset.discussionToggle);if(panel){panel.hidden=!panel.hidden;discussion.setAttribute("aria-expanded",String(!panel.hidden));const count=discussion.querySelector(".count")?.textContent||"0";discussion.innerHTML=panel.hidden?'♧ <span class="count">'+count+'</span> Comments':'♧ Hide comments'}return}const expand=e.target.closest("[data-expand-body]");if(expand){const body=document.getElementById("body-"+expand.dataset.expandBody);if(body){const open=body.classList.toggle("expanded");expand.textContent=open?"Show less":"Read more"}return}const toggle=e.target.closest("[data-moderation-toggle]");if(toggle){if(!isFounder)return;const panel=document.getElementById("moderation-"+toggle.dataset.moderationToggle);if(!panel)return;panel.hidden=!panel.hidden;toggle.setAttribute("aria-expanded",String(!panel.hidden));toggle.textContent="⋮";return}const save=e.target.closest("[data-moderation-save]");if(save){if(!isFounder||busy)return;const id=save.dataset.moderationSave,st=[...document.querySelectorAll("[data-moderation-status]")].find(x=>x.dataset.moderationStatus===id),response=[...document.querySelectorAll("[data-moderation-response]")].find(x=>x.dataset.moderationResponse===id);if(!st||!response)return;busy=true;save.disabled=true;save.textContent="Saving…";try{const r=await db.rpc("bizhunt_townhall_manage",{p_post_id:id,p_status:st.value,p_response:response.value});if(r.error)throw r.error;msg("Official Town Hall update saved.");await load()}catch(err){msg("Could not save update: "+(err.message||String(err)))}finally{busy=false;save.disabled=false;save.textContent="Save update"}return}let b=e.target.closest("[data-vote]");if(!b||busy)return;busy=true;b.disabled=true;let id=b.dataset.vote,mine=votes.some(v=>v.post_id===id&&v.user_id===user.id);let r=mine?await db.from("townhall_votes").delete().eq("post_id",id).eq("user_id",user.id):await db.from("townhall_votes").insert({post_id:id,user_id:user.id});busy=false;if(r.error)msg(r.error.message);await load()};$("feed").onsubmit=async e=>{if(!e.target.matches(".commentForm"))return;e.preventDefault();if(busy)return;busy=true;let b=e.target.querySelector("button");b.disabled=true;let r=await db.from("townhall_comments").insert({post_id:e.target.dataset.post,author_id:user.id,body:String(new FormData(e.target).get("body")).trim()});busy=false;b.disabled=false;if(r.error)return msg(r.error.message);msg("Comment posted!");await load()};try{const {data,error}=await db.auth.getUser();if(error)throw error;user=data?.user;if(user){try{const admin=await db.rpc("bizhunt_founder_authorized");isFounder=!admin.error&&admin.data===true}catch(_){isFounder=false}}if(!user){msg("Sign in to post, vote, or comment.");$("newPost").onsubmit=e=>{e.preventDefault();locat
