<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town Hall · BizHunt</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#24345e;font:15px system-ui,sans-serif}.shell{max-width:620px;min-height:100vh;margin:auto;background:#fff;padding:20px 17px 70px}a{color:#273880}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}header a{text-decoration:none;font-weight:750}.brand{font-size:19px;font-weight:900;color:#273880}h1{margin:0 0 6px;font-size:29px}p{line-height:1.5}.muted{color:#64718d;font-size:13px}.card{border:1px solid #e1e8f5;border-radius:18px;padding:17px;margin:14px 0;background:white;box-shadow:0 3px 14px #27388009}input,textarea,select{width:100%;border:1px solid #cbd6eb;border-radius:11px;padding:12px;font:inherit;margin:6px 0 12px;background:white;color:#24345e}textarea{min-height:90px;resize:vertical}label{display:block;font-weight:700;font-size:13px}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 14px;background:#273880;color:white;font-weight:750}button:disabled{opacity:.55;cursor:wait}.alt{background:#edf2ff;color:#273880}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.post-title{font-size:18px;font-weight:800;margin:8px 0}.tag{font-size:11px;background:#edf2ff;color:#273880;border-radius:30px;padding:5px 9px;font-weight:700}.post-body{white-space:pre-wrap;overflow-wrap:anywhere}.votes{margin-top:14px}.voted{background:#dce8ff;color:#1535a2}.comment{padding:12px 0;border-top:1px solid #edf0f6;white-space:pre-wrap;overflow-wrap:anywhere}.comment small{display:block;margin-bottom:5px;color:#6b7892}.status{color:#a32334}.toolbar{display:flex;gap:8px;margin:15px 0}.toolbar button{flex:1}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.filters input{grid-column:1/-1;margin:0}.filters select{margin:0}.author{display:flex;align-items:center;gap:8px;margin-bottom:10px}.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8efff;color:#273880;font-weight:800}.author a{font-weight:700;text-decoration:none;color:#273880}.post-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.official{background:#edf5ff;border-left:3px solid #273880;padding:11px;margin-top:12px;border-radius:8px}.moderation{margin-top:12px;padding:12px;background:#f7f9ff;border:1px solid #dce5f8;border-radius:12px}.moderation select,.moderation textarea{margin:5px 0 9px}.stage{font-size:11px;background:#e9f5ef;color:#17643a;border-radius:18px;padding:5px 8px;font-weight:700}.empty{text-align:center;padding:30px;color:#64718d}details summary{cursor:pointer;font-weight:750;color:#273880;padding:9px 0}#composer{margin-top:18px}#composer[hidden]{display:none!important}#toggleComposer{width:100%;margin-top:12px}.composer-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.composer-heading h3{margin:0}.composer-cancel{padding:8px 11px;font-size:13px;white-space:nowrap}#toggleComposer[aria-expanded="true"]{display:none}</style></head><body><div class="shell"><header><a href="../app/?section=profile">← Back to Profile</a><span class="brand">BizHunt ✦</span></header><h1>🏛️ Town Hall</h1><p class="muted">Shape the future of BizHunt. Suggest features, share improvements, vote on ideas, and join the discussion.</p><div id="status" role="status"></div><button id="toggleComposer" type="button" aria-controls="composer" aria-expanded="false" onclick="toggleTownHallComposer()">＋ Share your idea</button><section id="composer" class="card" hidden><div class="composer-heading"><h3>Share your idea</h3><button type="button" class="alt composer-cancel" onclick="toggleTownHallComposer()">Cancel ✕</button></div><form id="newPost"><label>Type<select name="category"><option>Feature request</option><option>Improvement</option><option>Bug report</option></select></label><label>Title<input name="title" required minlength="5" maxlength="140" placeholder="What should BizHunt improve?"></label><label>Describe your idea<textarea name="body" required minlength="10" maxlength="3000" placeholder="Explain the problem and your proposed solution"></textarea></label><button type="submit">Post suggestion</button><div id="postStatus" role="status" aria-live="polite" style="margin-top:10px;font-size:13px;white-space:pre-wrap"></div></form></section><div class="filters"><input id="searchIdeas" type="search" placeholder="Search suggestions..." aria-label="Search suggestions"><select id="filterCategory" aria-label="Filter by category"><option value="">All categories</option><option>Feature request</option><option>Improvement</option><option>Bug report</option></select><select id="filterStatus" aria-label="Filter by status"><option value="">All statuses</option><option>Submitted</option><option>Under Review</option><option>Planned</option><option>In Progress</option><option>Completed</option><option>Declined</option></select></div><div class="toolbar"><button class="alt" id="sortTop">Top voted</button><button class="alt" id="sortNew">Newest</button></div><div id="feed"><div class="empty">No post yet.</div></div></div><script>function toggleTownHallComposer(){const panel=document.getElementById("composer"),button=document.getElementById("toggleComposer");if(!panel||!button)return;const opening=panel.hidden;panel.hidden=!opening;button.setAttribute("aria-expanded",String(opening));button.textContent=opening?"× Cancel":"＋ Share your idea";if(opening)panel.querySelector('input[name="title"]')?.focus()}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const db=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let user,posts=[],votes=[],comments=[],sort="top",busy=false,profiles={},isFounder=false;;function msg(t){$("status").textContent=t||""}function time(x){return new Date(x).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}async function load(){let p;try{p=await db.from("townhall_posts").select("*").order("created_at",{ascending:false}).limit(100)}catch(e){p={error:e}}if(p.error){$("feed").innerHTML='<div class="empty">Could not load Town Hall posts. <button type="button" class="alt" id="retryFeed">Retry</button></div>';$("retryFeed").onclick=()=>load();msg("Unable to load posts: "+p.error.message);return false}posts=p.data||[];const ids=[...new Set(posts.map(x=>x.author_id).filter(Boolean))];if(ids.length){try{const pr=await db.from("community_profiles").select("user_id,username,display_name").in("user_id",ids);if(!pr.error)profiles=Object.fromEntries((pr.data||[]).map(x=>[x.user_id,x]))}catch(_){}}const [v,c]=await Promise.allSettled([db.from("townhall_votes").select("post_id,user_id").limit(10000),db.from("townhall_comments").select("*").order("created_at",{ascending:true}).limit(5000)]);const vr=v.status==="fulfilled"?v.value:{error:v.reason},cr=c.status==="fulfilled"?c.value:{error:c.reason};votes=vr.error?[]:vr.data||[];comments=cr.error?[]:cr.data||[];draw();if(vr.error||cr.error){msg("Posts loaded, but votes or comments are temporarily unavailable. Please retry later.")}return true}function draw(){const q=($("searchIdeas")?.value||"").trim().toLowerCase(),cat=$("filterCategory")?.value||"",stage=$("filterStatus")?.value||"";let arr=posts.filter(p=>(!cat||p.category===cat)&&(!stage||(p.status||"Submitted")===stage)&&(!q||[p.title,p.body,p.category,profiles[p.author_id]?.username,profiles[p.author_id]?.display_name].some(x=>String(x||"").toLowerCase().includes(q)))).sort((a,b)=>sort==="top"?(votes.filter(v=>v.post_id===b.id).length-votes.filter(v=>v.post_id===a.id).length)||new Date(b.created_at)-new Date(a.created_at):new Date(b.created_at)-new Date(a.created_at));$("feed").innerHTML=arr.length?arr.map(p=>{let n=votes.filter(v=>v.post_id===p.id).length,mine=votes.some(v=>v.post_id===p.id&&v.user_id===user.id),replies=comments.filter(c=>c.post_id===p.id),profile=profiles[p.author_id],name=profile?.display_name||profile?.username|| (p.author_id===user.id?"You":"BizHunt member"),initial=String(name).slice(0,1).toUpperCase(),author=profile?.username?'<a href="../app/?section=profile" title="Open BizHunt profile">@'+esc(profile.username)+'</a>':esc(name);return '<article class="card"><div class="author"><span class="avatar" aria-hidden="true">'+esc(initial)+'</span><div>'+author+'<div class="muted">'+time(p.created_at)+'</div></div></div><div class="post-meta"><span class="tag">'+esc(p.category)+'</span><span class="stage">'+esc(p.status||"Submitted")+'</span></div><h2 class="post-title">'+esc(p.title)+'</h2><p class="post-body">'+esc(p.body)+'</p><div class="row votes"><button class="'+(mine?"voted":"alt")+'" data-vote="'+p.id+'">▲ '+n+' Upvote'+(n===1?"":"s")+'</button><span class="muted">💬 '+replies.length+' comments</span></div><details><summary>View discussion</summary>'+replies.map(c=>'<div class="comment"><small>'+time(c.created_at)+(c.author_id===user.id?" · You":" · Member")+'</small>'+esc(c.body)+'</div>').join("")+'<form class="commentForm" data-post="'+p.id+'"><label>Add a comment<textarea name="body" required minlength="2" maxlength="1500" placeholder="Be constructive and respectful"></textarea></label><button type="submit">Comment</button></form></details></article>'}).join(""):'<div class="empty">'+(posts.length?"No suggestions match your filters.":"No post yet.")+'</div>'}async function init(){["searchIdeas","filterCategory","filterStatus"].forEach(id=>$(id).addEventListener(id==="searchIdeas"?"input":"change",draw));$("sortTop").onclick=()=>{sort="top";draw()};$("sortNew").onclick=()=>{sort="new";draw()};$("newPost").onsubmit=async e=>{e.preventDefault();if(busy)return;const status=$("postStatus"),b=e.target.querySelector('button[type="submit"]');const feedback=(message,isError=false)=>{status.textContent=message;status.style.color=isError?"#a32334":"#17643a";msg(message)};if(!user){feedback("Please sign in before posting.",true);return}busy=true;b.disabled=true;b.textContent="Posting…";feedback("Submitting your suggestion…");const f=new FormData(e.target),payload={author_id:user.id,category:f.get("category"),title:String(f.get("title")).trim(),body:String(f.get("body")).trim()};try{const request=db.from("townhall_posts").insert(payload).select("*").single();const r=await Promise.race([request,new Promise((_,reject)=>setTimeout(()=>reject(new Error("The request is taking too long. Please check your connection and refresh Town Hall before trying again, to avoid duplicate posts.")),15000))]);if(r.error)throw r.error;e.target.reset();$("composer").hidden=true;$("toggleComposer").textContent="＋ Share your idea";$("toggleComposer").setAttribute("aria-expanded","false");posts=[r.data,...posts.filter(p=>p.id!==r.data.id)];sort="new";draw();feedback("Suggestion posted!");const ok=await load();if(ok)feedback("Suggestion posted!");else feedback("Suggestion posted, but the feed could not refresh. Your post was saved; try Retry.")}catch(err){feedback("Could not post suggestion: "+(err.message||String(err))+". Your draft is still here.",true)}finally{busy=false;b.disabled=false;b.textContent="Post suggestion"}};$("feed").onclick=async e=>{const save=e.target.closest("[data-moderation-save]");if(save){if(!isFounder||busy)return;const id=save.dataset.moderationSave,st=[...document.querySelectorAll("[data-moderation-status]")].find(x=>x.dataset.moderationStatus===id),response=[...document.querySelectorAll("[data-moderation-response]")].find(x=>x.dataset.moderationResponse===id);if(!st||!response)return;busy=true;save.disabled=true;save.textContent="Saving…";try{const r=await db.rpc("bizhunt_townhall_manage",{p_post_id:id,p_status:st.value,p_response:response.value});if(r.error)throw r.error;msg("Official Town Hall update saved.");await load()}catch(err){msg("Could not save update: "+(err.message||String(err)))}finally{busy=false;save.disabled=false;save.textContent="Save update"}return}let b=e.target.closest("[data-vote]");if(!b||busy)return;busy=true;b.disabled=true;let id=b.dataset.vote,mine=votes.some(v=>v.post_id===id&&v.user_id===user.id);let r=mine?await db.from("townhall_votes").delete().eq("post_id",id).eq("user_id",user.id):await db.from("townhall_votes").insert({post_id:id,user_id:user.id});busy=false;if(r.error)msg(r.error.message);await load()};$("feed").onsubmit=async e=>{if(!e.target.matches(".commentForm"))return;e.preventDefault();if(busy)return;busy=true;let b=e.target.querySelector("button");b.disabled=true;let r=await db.from("townhall_comments").insert({post_id:e.target.dataset.post,author_id:user.id,body:String(new FormData(e.target).get("body")).trim()});busy=false;b.disabled=false;if(r.error)return msg(r.error.message);msg("Comment posted!");await load()};try{const {data,error}=await db.auth.getUser();if(error)throw error;user=data?.user;if(user){try{const admin=await db.rpc("bizhunt_founder_authorized");isFounder=!admin.error&&admin.data===true}catch(_){isFounder=false}}if(!user){msg("Sign in to post, vote, or comment.");$("newPost").onsubmit=e=>{e.preventDefault();location.href="../account/"};return}await load()}catch(e){msg("Unable to connect to Town Hall: "+e.message);$("feed").innerHTML='<div class="empty">No post yet.</div>'}}init().catch(e=>msg(e.message));
</script></body></html>
