<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt — Explore & Earn</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0ecf9;color:#2e2445;font:15px system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:#fcfaff;padding-bottom:100px}.hero{background:linear-gradient(135deg,#6741d9,#ac66ef);color:white;padding:24px 20px 27px;border-radius:0 0 26px 26px}.logo{font-size:27px;font-weight:900}.logo b{color:#ffdd5a}.hero h1{font-size:26px;margin:14px 0 5px}.hero p{margin:0;opacity:.9}main{padding:18px}.card{background:#fff;border:1px solid #e6ddf4;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 4px 14px #44345d09}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:13px;color:#7b7289}.pill{background:#eee8ff;color:#6b45d7;border-radius:30px;padding:6px 10px;font-size:12px;font-weight:750}.btn{border:0;border-radius:12px;background:#7147e3;color:white;padding:12px 14px;font-weight:750}.alt{background:#efe9ff;color:#6844cb}.full{width:100%}.field{display:block;font-weight:700;font-size:13px;margin:12px 0}.field input{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid #d9ceea;border-radius:11px}.notice{background:#fff2d6;color:#795819;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}.error{background:#ffe6ed;color:#9c274b}.success{background:#def7eb;color:#176b43}.stamps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.stamps span{height:36px;width:36px;display:grid;place-items:center;border:2px dashed #bda8ed;border-radius:50%}.stamps .done{background:#7147e3;border-color:#7147e3;color:white}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid #e7def4;display:flex;justify-content:space-around;padding:10px 4px 15px}nav button{background:none;border:0;color:#867b94;display:grid;justify-items:center;gap:4px;font-size:11px}nav button.active{color:#7147e3;font-weight:800}nav span{font-size:21px}.qr{background:white;min-height:220px;display:flex;align-items:center;justify-content:center;padding:12px}.code{word-break:break-all;font:12px ui-monospace,monospace;background:#f3edff;padding:10px;border-radius:10px;user-select:all}a{color:#6741d9}button:disabled{opacity:.55}</style></head><body><div class="app"><header class="hero"><div class="logo">Biz<b>Hunt</b> ✦</div><h1>Discover. Collect. Repeat. 💜</h1><p>Support local favorites. Earn rewards on every verified visit.</p></header><main><div id="notice" role="status"></div><div id="view">Connecting…</div></main></div><nav id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const PROJECT_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",PUBLISHABLE_KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let db,user=null,tab="discover",businesses=[],campaigns=[],stamps=[],redemptions=[],qr=null,expires=null;function notify(t,bad=false){$("notice").innerHTML='<div class="notice '+(bad?"error":"success")+'">'+esc(t)+'</div>'}function clear(){$("notice").innerHTML=""}function nav(){const items=[["discover","🔎","Discover"],["wallet","🪪","Wallet"],["qr","▦","My QR"],["profile","👤","Profile"]];$("nav").innerHTML=items.map(([id,icon,label])=>'<button class="'+(tab===id?"active":"")+'" data-tab="'+id+'"><span>'+icon+'</span>'+label+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;clear();load()})}async function init(){if(!window.supabase){$("view").textContent="Unable to load authentication library. Please refresh.";return}db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);let r=await db.auth.getUser();user=r.data?.user||null;db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(load,0)});await load()}async function load(){if(!user){render();return}let [b,c,s,r]=await Promise.all([db.from("businesses").select("id,name,category,location,description").order("created_at",{ascending:false}).limit(100),db.from("campaigns").select("id,business_id,name,reward,stamp_goal").eq("active",true).limit(200),db.from("stamp_events").select("campaign_id,customer_id").eq("customer_id",user.id).limit(1000),db.from("reward_redemptions").select("campaign_id,customer_id").eq("customer_id",user.id).limit(1000)]);let err=[b,c,s,r].find(x=>x.error);if(err)notify(err.error.message+" — Check database migrations.",true);businesses=b.data||[];campaigns=c.data||[];stamps=s.data||[];redemptions=r.data||[];render()}function balance(c){return Math.max(0,stamps.filter(x=>x.campaign_id===c.id).length-redemptions.filter(x=>x.campaign_id===c.id).length*c.stamp_goal)}function stampUI(n,g){return '<div class="stamps">'+Array.from({length:g},(_,i)=>'<span class="'+(i<n?"done":"")+'">'+(i<n?"✓":"☆")+'</span>').join("")+'</div>'}function campaignUI(c){let b=businesses.find(x=>x.id===c.business_id),n=balance(c);return '<div class="card"><div class="row"><strong>🏪 '+esc(b?.name||"Local business")+'</strong><span class="pill">'+n+'/'+c.stamp_goal+'</span></div><p class="muted">📍 '+esc(b?.location||"Pampanga")+'</p><h3>'+esc(c.name)+'</h3><p>🎁 '+esc(c.reward)+'</p>'+stampUI(Math.min(n,c.stamp_goal),c.stamp_goal)+(n>=c.stamp_goal?'<p class="notice success">Reward unlocked! Show a new QR to the merchant to redeem.</p>':'')+'</div>'}function render(){nav();if(!user){$("view").innerHTML='<h2>Welcome to BizHunt ✨</h2><div class="card"><p>Sign in or create an account to discover businesses, earn stamps and claim rewards.</p><a href="../account/">Sign in or sign up →</a></div>';return}let out="";if(tab==="discover"){out='<div class="row"><h2>Explore Pampanga</h2><span class="pill">'+businesses.length+' businesses</span></div><label class="field">Find a business<input id="search" placeholder="Search cafés, places, categories"></label><div id="results"></div>'}else if(tab==="wallet"){out='<div class="row"><h2>My loyalty wallet 🪪</h2><button class="btn alt" id="refresh">Refresh</button></div>'+(campaigns.length?campaigns.map(campaignUI).join(""):'<div class="card">No loyalty campaigns yet.</div>')+'<div class="card"><strong>My activity</strong><p>'+stamps.length+' stamps collected · '+redemptions.length+' rewards redeemed</p></div>'}else if(tab==="qr"){out='<h2>My QR code ▦</h2><p class="muted">Show this temporary code to a merchant after a qualifying purchase. Each code is valid for 90 seconds and can be used once.</p><div class="card"><div id="qrbox" class="qr">'+(qr?"":"Generate your QR code")+'</div><div id="codebox"></div><button class="btn full" id="generate">Generate new QR</button></div>'}else{out='<h2>My profile 👤</h2><div class="card"><p><strong>Email:</strong> '+esc(user.email)+'</p><p class="muted">Your loyalty progress is saved to your BizHunt account.</p><button class="btn alt" id="signout">Sign out</button></div><div class="card"><a href="../account/">Account settings and merchant registration</a></div>'}$("view").innerHTML=out;if($("search")){const draw=()=>{let q=$("search").value.trim().toLowerCase(),found=businesses.filter(b=>(b.name+" "+b.category+" "+b.location).toLowerCase().includes(q));$("results").innerHTML=found.length?found.map(b=>'<div class="card"><div class="row"><strong>🏪 '+esc(b.name)+'</strong><span class="pill">'+esc(b.category)+'</span></div><p class="muted">📍 '+esc(b.location)+'</p><p>'+esc(b.description)+'</p>'+campaigns.filter(c=>c.business_id===b.id).map(c=>'<p class="notice">🎁 '+esc(c.reward)+' · '+c.stamp_goal+' stamps</p>').join("")+'</div>').join(""):'<div class="card">No matching businesses yet.</div>'};$("search").oninput=draw;draw()}if($("refresh"))$("refresh").onclick=load;if($("signout"))$("signout").onclick=async()=>{let r=await db.auth.signOut();if(r.error)notify(r.error.message,true);else{user=null;qr=null;render()}};if($("generate")){$("generate").onclick=generate;if(qr){if(new Date(expires)<=new Date()){qr=null;expires=null;render()}else{$("codebox").innerHTML='<p class="code">'+esc(qr)+'</p><p class="muted">Expires: '+esc(new Date(expires).toLocaleTimeString())+'</p>';if(window.QRCode)new QRCode($("qrbox"),{text:qr,width:205,height:205});else $("qrbox").textContent="QR image unavailable. Copy the code below."}}}}async function generate(){let b=$("generate");b.disabled=true;let r=await db.rpc("create_visit_token");b.disabled=false;if(r.error){notify(r.error.message+" — Check Phase 4 migration.",true);return}let v=r.data?.[0];if(!v){notify("No QR code returned.",true);return}qr=v.token;expires=v.expires_at;clear();render()}init().catch(err=>notify(err.message,true));
</script></body></html>
