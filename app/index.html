rder-radius:22px;padding:19px}.qr-banner h2{margin:4px}.qr-frame{border:8px solid #f0e8ff;border-radius:19px;margin:12px auto;max-width:260px}.stats{display:flex;gap:10px}.stats .card{flex:1}.stats strong{display:block;font-size:26px}.empty{text-align:center;padding:27px}.empty span{font-size:43px}.back{border:0;background:transparent;color:#6840d7;font-weight:800;padding:10px 0}nav{border-radius:20px 20px 0 0;box-shadow:0 -7px 22px #4b338b15;padding-bottom:max(15px,env(safe-area-inset-bottom))}nav button.active span{background:#eee6ff;border-radius:10px;padding:4px 12px}button:focus-visible{outline:3px solid #ffcd45;outline-offset:2px}.activity-item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #efe7f8;padding:13px 0}.activity-item:last-child{border-bottom:0}.activity-icon{display:grid;place-items:center;background:#f2eaff;border-radius:14px;min-width:43px;height:43px;font-size:22px}.activity-main{flex:1;min-width:0}.activity-main strong{display:block}.activity-main small{color:#81758d}.activity-date{font-size:11px;color:#81758d;text-align:right}.activity-filter{display:flex;gap:7px;margin:12px 0}.activity-filter button{background:#f0e9ff;color:#6c43cb;border:0;border-radius:20px;padding:9px 12px;font-weight:750}.activity-filter button.active{background:#7040df;color:white}.celebrate{border-radius:22px;padding:20px;background:linear-gradient(115deg,#ffdd69,#ffb9db);margin:12px 0}.celebrate h3{font-size:21px;margin:7px 0}.notice-count{background:#ffcc49;color:#56347b;border-radius:50%;font-size:10px;padding:2px 5px;margin-left:4px}.activity-panel{margin-top:16px}.notice-card{background:#fff;border:1px solid #e9e1f8;border-radius:16px;padding:13px;margin:9px 0}.notice-card strong{display:block;margin-bottom:4px}.notice-card small{color:#82768e}</style></head><body><div class="app"><header class="hero"><div class="logo">Biz<b>Hunt</b> ✦</div><h1>Discover. Collect. Repeat. 💜</h1><p>Support local favorites. Earn rewards on every verified visit.</p></header><main><div id="notice" role="status"></div><div id="view">Connecting…</div></main></div><nav id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const PROJECT_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",PUBLISHABLE_KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let category="All",detailId=null,activityFilter="all",seenActivity=new Set(),feedInitialized=false,celebration=null;let db,user=null,tab="discover",businesses=[],campaigns=[],stamps=[],redemptions=[],qr=null,expires=null;function notify(t,bad=false){$("notice").innerHTML='<div class="notice '+(bad?"error":"success")+'">'+esc(t)+'</div>'}function clear(){$("notice").innerHTML=""}function nav(){const items=[["discover","🔎","Discover"],["wallet","🪪","Wallet"],["qr","▦","My QR"],["activity","🔔","Activity"],["profile","👤","Profile"]];$("nav").innerHTML=items.map(([id,icon,label])=>'<button class="'+(tab===id?"active":"")+'" data-tab="'+id+'"><span>'+icon+'</span>'+label+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;clear();load()})}async function init(){if(!window.supabase){$("view").textContent="Unable to load authentication library. Please refresh.";return}db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);let r=await db.auth.getUser();user=r.data?.user||null;db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(load,0)});await load()}async function load(){if(!user){render();return}let [b,c,s,r]=await Promise.all([db.from("businesses").select("id,name,category,location,description").order("created_at",{ascending:false}).limit(100),db.from("campaigns").select("id,business_id,name,reward,stamp_goal").eq("active",true).limit(200),db.from("stamp_events").select("id,campaign_id,customer_id,created_at").eq("customer_id",user.id).order("created_at",{ascending:false}).limit(1000),db.from("reward_redemptions").select("campaign_id,customer_id").eq("customer_id",user.id).limit(1000)]);let err=[b,c,s,r].find(x=>x.error);if(err)notify(err.error.message+" — Check database migrations.",true);businesses=b.data||[];campaigns=c.data||[];stamps=s.data||[];redemptions=r.data||[];let latest=[...stamps.map(x=>({...x,kind:"stamp"})),...redemptions.map(x=>({...x,kind:"reward"}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(feedInitialized){let fresh=latest.filter(x=>!seenActivity.has(x.kind+":"+x.id));if(fresh.length){let x=fresh[0],c=campaigns.find(c=>c.id===x.campaign_id);celebration={kind:x.kind,reward:c?.reward||"your reward",name:c?.name||"loyalty campaign"};}}seenActivity=new Set(latest.map(x=>x.kind+":"+x.id));feedInitialized=true;render()}function balance(c){return Math.max(0,stamps.filter(x=>x.campaign_id===c.id).length-redemptions.filter(x=>x.campaign_id===c.id).length*c.stamp_goal)}function stampUI(n,g){return '<div class="stamps">'+Array.from({length:g},(_,i)=>'<span class="'+(i<n?"done":"")+'">'+(i<n?"✓":"☆")+'</span>').join("")+'</div>'}function shopEmoji(b){let c=(b.category||"").toLowerCase();return /caf|coffee|tea/.test(c)?"☕":/restaurant|food/.test(c)?"🍜":/bake/.test(c)?"🥐":/fitness|gym/.test(c)?"🏃":/beauty|spa/.test(c)?"💅":"🛍️"}function campaignUI(c){let b=businesses.find(x=>x.id===c.business_id),n=balance(c),ready=n>=c.stamp_goal;return '<div class="card wallet-card '+(ready?"ready":"")+'"><div class="row"><strong>'+esc(b?.name||"Local business")+'</strong><span class="pill">'+(ready?"🎉 Unlocked":n+"/"+c.stamp_goal)+'</span></div><h3>'+esc(c.name)+'</h3><p class="muted">'+(ready?"Your treat is waiting!":Math.max(0,c.stamp_goal-n)+" more stamps to go")+'</p>'+stampUI(Math.min(n,c.stamp_goal),c.stamp_goal)+'<div class="reward-chip">🎁 '+esc(c.reward)+'</div>'+(ready?'<button class="btn alt full" data-qr="1">Show QR to redeem →</button>':"")+'</div>'}
function shopUI(b){let offers=campaigns.filter(c=>c.business_id===b.id),offer=offers[0];return '<div class="card shop"><div class="shop-banner"><span class="pill">'+esc(b.category)+'</span><span class="art">'+shopEmoji(b)+'</span></div><div class="shop-body"><h3>'+esc(b.name)+'</h3><p class="muted">📍 '+esc(b.location)+'</p><div class="reward-chip">'+(offer?'🎁 '+esc(offer.reward)+' · '+offer.stamp_goal+' stamps':'✨ Discover this local favorite')+'</div><button class="btn alt full" data-business="'+esc(b.id)+'" style="margin-top:12px">View details & rewards →</button></div></div>'}
function historyItems(){return [...stamps.map(x=>({...x,kind:"stamp"})),...redemptions.map(x=>({...x,kind:"reward"}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
function historyMarkup(limit=1000){let items=historyItems().filter(x=>activityFilter==="all"||x.kind===activityFilter).slice(0,limit);return items.length?items.map(x=>{let c=campaigns.find(c=>c.id===x.campaign_id),b=businesses.find(b=>b.id===c?.business_id);return '<div class="activity-item"><span class="activity-icon">'+(x.kind==="stamp"?"✨":"🎁")+'</span><div class="activity-main"><strong>'+(x.kind==="stamp"?"Stamp collected":"Reward redeemed")+'</strong><small>'+esc(b?.name||c?.name||"Loyalty campaign")+'</small></div><span class="activity-date">'+esc(new Date(x.created_at).toLocaleDateString())+'</span></div>'}).join(""):'<div class="empty">No activity here yet. Your visits will appear after merchant approval.</div>'}
function render(){nav();if(!user){$("view").innerHTML='<h2>Welcome to BizHunt ✨</h2><div class="card"><p>Sign in or create an account to discover businesses, earn stamps and claim rewards.</p><a href="../account/">Sign in or sign up →</a></div>';return}let out=celebration?'<div class="celebrate"><div style="font-size:35px">🎊✨🎉</div><h3>'+(celebration.kind==="stamp"?"New stamp collected!":"Reward redeemed!")+'</h3><p>'+(celebration.kind==="stamp"?"Keep going — your next treat is closer!":"Enjoy your reward!")+'</p><button class="btn alt" id="dismissCelebrate">Awesome! 🙌</button></div>':"";if(tab==="discover"&&detailId){let b=businesses.find(x=>x.id===detailId);if(!b){detailId=null;return render()}let offers=campaigns.filter(c=>c.business_id===b.id);out='<button class="back" id="back">← Back to discovery</button><div class="shop-banner" style="height:175px;border-radius:20px"><span class="pill">'+esc(b.category)+'</span><span class="art" style="font-size:80px">'+shopEmoji(b)+'</span></div><h2 class="section">'+esc(b.name)+'</h2><p>📍 '+esc(b.location)+'</p><p>'+esc(b.description)+'</p><h3>🎁 Available rewards</h3>'+(offers.length?offers.map(c=>'<div class="card"><div class="row"><strong>'+esc(c.name)+'</strong><span class="pill">'+balance(c)+'/'+c.stamp_goal+'</span></div><p>🎁 '+esc(c.reward)+'</p>'+stampUI(Math.min(balance(c),c.stamp_goal),c.stamp_goal)+'<button class="btn full" data-qr="1">Show my QR →</button></div>').join(""):'<div class="card">No active rewards yet.</div>')}else if(tab==="discover"){out='<h2 class="section">Explore local favorites ✨</h2><label class="field">Find a local gem<input id="search" placeholder="🔎 Cafés, restaurants, neighborhoods…"></label><div class="chips">'+["All",...new Set(businesses.map(b=>b.category).filter(Boolean))].slice(0,12).map(c=>'<button class="chip '+(category===c?"active":"")+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join("")+'</div><div class="promo"><div><strong>Good visits.<br>Great rewards.</strong><p>Collect stamps, unlock treats!</p></div><span>🎁</span></div><div class="row"><h3 class="section">Spots to explore</h3><span class="pill">'+businesses.length+' spots</span></div><div id="results"></div>'}else if(tab==="wallet"){out='<h2 class="section">My stamp wallet 🪪</h2><div class="stats"><div class="card"><strong>'+stamps.length+'</strong><span class="muted">✨ Stamps earned</span></div><div class="card"><strong>'+redemptions.length+'</strong><span class="muted">🎁 Rewards claimed</span></div></div>'+(campaigns.some(c=>balance(c)>=c.stamp_goal)?'<h3>🎉 Ready to redeem</h3>'+campaigns.filter(c=>balance(c)>=c.stamp_goal).map(campaignUI).join(""):'')+(campaigns.some(c=>balance(c)>0&&balance(c)<c.stamp_goal)?'<h3>🌟 Keep collecting</h3>'+campaigns.filter(c=>balance(c)>0&&balance(c)<c.stamp_goal).map(campaignUI).join(""):'')+(!campaigns.some(c=>balance(c)>0)?'<div class="card empty"><span>🪄</span><h3>Your stamp adventure starts here</h3><p>Visit a local business and show your QR.</p><button class="btn" id="explore">Explore businesses →</button></div>':'')+'<button class="btn alt full" id="refresh">↻ Refresh wallet</button>'}else if(tab==="activity"){out+='<div class="eyebrow">YOUR LOYALTY JOURNEY</div><h2 class="section">Activity & updates 🔔</h2><p class="muted">Updates from your verified visits. No push notifications or promotional messages.</p><div class="notice-card"><strong>🎉 Rewards you can claim</strong><p>'+campaigns.filter(c=>balance(c)>=c.stamp_goal).length+' unlocked rewards waiting for merchant redemption.</p><button class="btn alt" id="openWallet">View wallet →</button></div><div class="activity-panel"><div class="row"><h3>Transaction history</h3><button class="btn alt" id="activityRefresh">↻ Refresh</button></div><div class="activity-filter">'+[["all","All"],["stamp","Stamps"],["reward","Rewards"]].map(([id,label])=>'<button class="'+(activityFilter===id?"active":"")+'" data-filter="'+id+'">'+label+'</button>').join("")+'</div><div class="card" id="history">'+historyMarkup()+'</div></div>'}else if(tab==="qr"){out='<div class="qr-banner"><span style="font-size:48px">🎟️</span><h2>Scan. Stamp. Smile! ✨</h2><p class="muted">Show your code after a qualifying purchase.</p></div><div class="card"><div class="qr-frame"><div id="qrbox" class="qr">'+(qr?"":"<div class=empty>✨ Ready when you are!</div>")+'</div></div><div id="codebox"></div><button class="btn full" id="generate">'+(qr?"↻ Generate fresh QR":"✨ Generate my QR")+'</button><p class="muted">🔒 One-time code, valid for 90 seconds. Only share it with the merchant at checkout.</p></div>'}else{out='<h2>My profile 👤</h2><div class="card"><p><strong>Email:</strong> '+esc(user.email)+'</p><p class="muted">Your loyalty progress is saved to your BizHunt account.</p><button class="btn alt" id="signout">Sign out</button></div><div class="card"><a href="../account/">Account settings and merchant registration</a></div>'}$("view").innerHTML=out;if($("dismissCelebrate"))$("dismissCelebrate").onclick=()=>{celebration=null;render()};if($("openWallet"))$("openWallet").onclick=()=>{tab="wallet";render()};if($("activityRefresh"))$("activityRefresh").onclick=load;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{activityFilter=b.dataset.filter;render()});if($("back"))$("back").onclick=()=>{detailId=null;render()};if($("search")){const draw=()=>{let q=$("search").value.trim().toLowerCase(),found=businesses.filter(b=>(category==="All"||b.category===category)&&(b.name+" "+b.category+" "+b.location+" "+b.description).toLowerCase().includes(q));$("results").innerHTML=found.length?found.map(shopUI).join(""):'<div class="card empty"><span>🔍</span><h3>No matching spots</h3><p>Try another category or search.</p></div>';document.querySelectorAll("[data-business]").forEach(b=>b.onclick=()=>{detailId=b.dataset.business;render();window.scrollTo(0,0)})};$("search").oninput=draw;document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;document.querySelectorAll("[data-category]").forEach(x=>x.classList.toggle("active",x===b));draw()});draw()}document.querySelectorAll("[data-qr]").forEach(b=>b.onclick=()=>{tab="qr";detailId=null;render()});if($("explore"))$("explore").onclick=()=>{tab="discover";detailId=null;render()};if($("refresh"))$("refresh").onclick=load;if($("signout"))$("signout").onclick=async()=>{let r=await db.auth.signOut();if(r.error)notify(r.error.message,true);else{user=null;qr=null;feedInitialized=false;seenActivity.clear();celebration=null;render()}};if($("generate")){$("generate").onclick=generate;if(qr){if(new Date(expires)<=new Date()){qr=null;expires=null;render()}else{$("codebox").innerHTML='<p class="code">'+esc(qr)+'</p><p class="muted">Expires: '+esc(new Date(expires).toLocaleTimeString())+'</p>';if(window.QRCode)new QRCode($("qrbox"),{text:qr,width:205,height:205});else $("qrbox").textContent="QR image unavailable. Copy the code below."}}}}async function generate(){let b=$("generate");b.disabled=true;let r=await db.rpc("create_visit_token");b.disabled=false;if(r.error){notify(r.error.message+" — Check Phase 4 migration.",true);return}let v=r.data?.[0];if(!v){notify("No QR code returned.",true);return}qr=v.token;expires=v.expires_at;clear();render()}init().catch(err=>notify(err.message,true));
