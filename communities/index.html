const SUPABASE_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";let db,user,communities=[],members=[],selected=null,places=[],memberCount=null,editingPlaceId=null,map=null,mode="list",feedItems=[];
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function alertMsg(msg,bad=false){$("notice").innerHTML='<div class="notice '+(bad?"error":"")+'">'+esc(msg)+'</div>'}

async function init(){if(!window.supabase){$("view").textContent="Unable to load account service";return}db=window.supabase.createClient(SUPABASE_URL,KEY);let r=await db.auth.getUser();user=r.data.user;if(!user){$("view").innerHTML='<div class="card"><h2>Join the community</h2><p>Sign in to discover and create communities.</p><a href="../account/">Sign in or create account →</a></div>';return}await refresh();let id=new URLSearchParams(location.search).get("id");if(id){if(communities.some(c=>c.id===id))openCommunity(id);else openPrivateInvite(id)}}
async function openPrivateInvite(id){let r=await db.rpc("bizhunt_community_invite",{p_id:id});if(r.error||!r.data?.length)return alertMsg("Community not found or invitation unavailable.",true);let c=r.data[0];$("view").innerHTML='<button class="btn alt" id="inviteBack">← All communities</button><div class="card"><span class="pill">Private invitation</span><h2>'+esc(c.name)+'</h2><p class="muted">'+esc(c.category)+' · '+esc(c.city||"Anywhere")+'</p><p>Request to join this community. Its business list and members remain private until approval.</p><button class="btn" id="requestJoin">Request to join</button></div>';$("inviteBack").onclick=()=>{history.replaceState(null,"",location.pathname);renderHome()};$("requestJoin").onclick=async()=>{let x=await db.rpc("bizhunt_join_community",{p_id:id});if(x.error)return alertMsg(x.error.message,true);alertMsg(x.data);$("requestJoin").disabled=true;$("requestJoin").textContent="Request sent"}}
async function refresh(){let [c,m]=await Promise.all([db.from("bizhunt_communities").select("*").order("created_at",{ascending:false}).limit(200),db.from("bizhunt_community_members").select("community_id,user_id,role,status").eq("user_id",user.id)]);if(c.error){$("view").innerHTML='<div class="card">Communities are not available yet. Apply the Phase 34 Supabase migration.<p class="muted">'+esc(c.error.message)+'</p></div>';return}communities=c.data||[];members=m.data||[];renderHome()}
function myMember(id){return members.find(m=>m.community_id===id)}
function renderHome(){destroyMap();selected=null;let mine=communities.filter(c=>myMember(c.id)?.status==="active"),others=communities.filter(c=>!mine.includes(c));$("view").innerHTML='<div class="row"><h2>Explore communities</h2><button class="btn" id="create">+ Create</button></div><p class="muted">Any member can create a community. No BizHunt approval needed.</p><input id="search" placeholder="Search communities by name, category or city" aria-label="Search communities"><div id="communityList"></div><div class="card hidden" id="createCard"><h3>Create community</h3><form id="createForm"><label class="field">Community name<input name="name" maxlength="80" minlength="3" required></label><label class="field">Description<textarea name="description" maxlength="1000"></textarea></label><label class="field">Category<select name="category"><option>Sports & fitness</option><option>Schools & organizations</option><option>Travel & hobbies</option><option>Nonprofit & volunteer</option><option>Neighborhood</option><option>Professional</option><option>Other</option></select></label><label class="field">City / area<input name="city" placeholder="Angeles City"></label><label class="field">Visibility<select name="visibility"><option value="public">Public — discoverable</option><option value="private">Private — invite link only</option></select></label><label class="field">Membership<select name="join_policy"><option value="open">Open joining (public only)</option><option value="approval">Request admin approval</option></select></label><button class="btn" type="submit">Create community</button></form></div>';function list(q=""){let match=c=>[c.name,c.category,c.city].join(" ").toLowerCase().includes(q.toLowerCase());let card=c=>'<article class="card"><div class="row"><h3>'+esc(c.name)+'</h3><span class="pill">'+esc(c.visibility)+'</span></div><p class="muted">'+esc(c.category)+' · '+esc(c.city||"Anywhere")+'</p><p>'+esc(c.description||"Discover this community and its favorite places async function openCommunity(id){destroyMap();selected=communities.find(c=>c.id===id);if(!selected)return renderHome();history.replaceState(null,"",location.pathname+"?id="+encodeURIComponent(id));let r=await db.from("bizhunt_community_places").select("*").eq("community_id",id).order("created_at",{ascending:false});places=r.data||[];memberCount=null;editingPlaceId=null;let count=await db.rpc("bizhunt_community_member_count",{p_id:id});if(!count.error)memberCount=count.data;feedItems=[];renderCommunity();if(myMember(id)?.status==="active")loadCommunityFeed(id)}
function renderCommunity(){let c=selected,m=myMember(c.id),admin=c.owner_id===user.id||m?.role==="admin"&&m.status==="active",active=m?.status==="active";let share=location.origin+location.pathname+"?id="+encodeURIComponent(c.id);$("view").innerHTML='<button class="btn alt" id="back">← All communities</button><div class="card"><div class="row"><h2>'+esc(c.name)+'</h2><span class="pill">'+esc(c.visibility)+'</span></div><p class="muted">'+esc(c.category)+' · '+esc(c.city||"Anywhere")+' · '+(memberCount===null?"Members: unavailable":memberCount+" "+(memberCount===1?"member":"members"))+'</p><p>'+esc(c.description)+'</p><div class="row"><span class="pill">'+(active?"✓ Member":m?.status==="pending"?"⏳ Request pending":"Not a member")+'</span><button class="btn alt" id="share">Copy invite link</button></div>'+(!m?'<button class="btn" id="join" style="margin-top:12px">Join community</button>':'')+'</div><div class="card"><h2>🗣️ Community feed</h2><p class="muted">Share posts, polls and conversations with members.</p><div id="communityFeed">'+(active?'Loading feed…':'Join to view the feed.')+'</div></div><div class="row"><h2>🤝 Partners</h2><span class="pill">'+places.length+' listed</span></div><p class="muted">Enjoy exclusive perks from your community partners. Only verified partners have confirmed their partnership; check offer details before redeeming.</p><div class="tabs"><button class="btn '+(mode==="list"?"":"alt")+'" id="listBtn">☷ List</button><button class="btn '+(mode==="map"?"":"alt")+'" id="mapBtn">🗺 Map</button></div><div id="placesList"></div><div id="map" hidden></div>'+(admin?'<div class="card"><button class="btn" type="button" id="toggleAddPlace" aria-expanded="false" aria-controls="addPlacePanel">＋ Add a partner</button><div id="addPlacePanel" hidden><p class="muted">Add a recommendation or request a partnership. Select a listed BizHunt business to send its owner an approval request.</p><form id="placeForm"><label class="field">Business name<input name="name" id="placeBusinessName" required maxlength="120" autocomplete="off" placeholder="Start typing a BizHunt business…"></label><div id="businessSuggestions" class="business-suggestions" role="listbox" aria-label="Matching BizHunt businesses" hidden></div><input type="hidden" name="business_id" id="selectedBusinessId"><p class="muted" id="businessMatchHint">Select a suggestion to link an existing BizHunt listing, or enter a new place manually.</p><label class="field">Category<input name="category" placeholder="Café, running store, gym"></label><label class="field">Address<input name="address" placeholder="Street, city"></label><label class="field">Type<select name="relationship"><option value="recommended">Community recommendation</option><option value="partner">Request merchant partnership approval</option></select></label><label class="field">Perk details (optional)<textarea name="perk_details" maxlength="500" placeholder="Subject to confirmation by the business"></textarea></label><div class="row"><label class="field">Latitude (optional)<input name="latitude" type="number" min="-90" max="90" step="any"></label><label class="field">Longitude (optional)<input name="longitude" type="number" min="-180" max="180" step="any"></label></div><p class="muted">Coordinates enable map pins. You can get them from a map location.</p><p id="partnerSaveMessage" class="muted" role="status" aria-live="polite" hidden></p><div class="row"><button class="btn" type="submit" id="savePartnerBtn">Add partner / send request</button><button class="btn alt" type="button" id="cancelAddPlace">Cancel</button></div></form></div></div><div class="card"><h3>Membership requests</h3><div id="requests">Loading…</div></div>':'');$("back").onclick=()=>{history.replaceState(null,"",location.pathname);renderHome()};$("share").onclick=()=>navigator.clipboard.writeText(share).then(()=>alertMsg("Invite link copied!")).catch(()=>alertMsg("Copy failed",true));if($("join"))$("join").onclick=async()=>{let r=await db.rpc("bizhunt_join_community",{p_id:c.id});if(r.error)return alertMsg(r.error.message,true);alertMsg(r.data);await refresh();openCommunity(c.id)};$("listBtn").onclick=()=>{mode="list";renderCommunity()};$("mapBtn").onclick=()=>{mode="map";renderCommunity()};renderPlaces();if(admin){const panel=$("addPlacePanel"),toggle=$("toggleAddPlace");const setOpen=open=>{panel.hidden=!open;toggle.setAttribute("aria-expanded",String(open));toggle.textContent=open?"− Hide add partner form":"＋ Add a partner";if(open)$("placeBusinessName")?.focus();if(!open){$("partnerSaveMessage").hidden=true;editingPlaceId=null;$("placeForm").reset();$("selectedBusinessId").value="";$("savePartnerBtn").textContent="Add partner / send request"}};toggle.onclick=()=>setOpen(panel.hidden);$("cancelAddPlace").onclick=()=>setOpen(false);$("placeForm").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),lat=f.get("latitude"),lon=f.get("longitude"),message=$("partnerSaveMessage"),saveButton=$("savePartnerBtn");const showSaveError=error=>{message.textContent=error;message.hidden=false;message.style.color="#b42318";message.scrollIntoView({block:"nearest",behavior:"smooth"})};message.hidden=true;if(f.get("relationship")==="partner"&&!f.get("business_id"))return showSaveError("Choose a business from the suggestions to request merchant approval.");saveButton.disabled=true;let r=editingPlaceId?await db.rpc("bizhunt_edit_community_partner",{p_id:editingPlaceId,p_name:String(f.get("name")).trim(),p_category:f.get("category")||"Other",p_address:f.get("address")||"",p_relationship:f.get("relationship"),p_perk_details:f.get("perk_details")||"",p_latitude:lat===""?null:Number(lat),p_longitude:lon===""?null:Number(lon),p_business_id:f.get("business_id")||null}):await db.from("bizhunt_community_places").insert({community_id:c.id,created_by:user.id,business_id:f.get("business_id")||null,name:String(f.get("name")).trim(),category:f.get("category")||"Other",address:f.get("address")||"",relationship:f.get("relationship"),perk_details:f.get("perk_details")||"",latitude:lat===""?null:Number(lat),longitude:lon===""?null:Number(lon)});saveButton.disabled=false;if(r.error){let missing=r.error.code==="PGRST202"||r.error.message?.includes("bizhunt_edit_community_partner")&&r.error.message?.includes("schema cache");return showSaveError(missing?"Partner editing requires the Phase 37 Supabase SQL migration. Please run it in Supabase SQL Editor, then retry.":r.error.message)}alertMsg(editingPlaceId?"Partner listing updated. Changes to partnerships or perks require merchant reapproval.":f.get("relationship")==="partner"?"Partnership request added. The business owner must approve it in Business Hub.":"Recommendation added.");openCommunity(c.id)};wireBusinessSuggestions();document.querySelectorAll("[data-edit-place]").forEach(b=>b.onclick=()=>{let p=places.find(x=>x.id===b.dataset.editPlace);if(!p)return;editingPlaceId=p.id;setOpen(true);$("partnerSaveMessage").hidden=true;const form=$("placeForm");for(const [name,value] of Object.entries({name:p.name,category:p.category,address:p.address,relationship:p.relationship,perk_details:p.perk_details,latitude:p.latitude??"",longitude:p.longitude??""})){if(form.elements[name])form.elements[name].value=value}$("selectedBusinessId").value=p.business_id||"";$("businessMatchHint").textContent=p.business_id?"Linked to a BizHunt business.":"No linked business.";$("savePartnerBtn").textContent="Save changes";panel.scrollIntoView({behavior:"smooth",block:"start"})});loadRequests()}}
function wireBusinessSuggestions(){const form=$("placeForm"),input=$("placeBusinessName"),results=$("businessSuggestions"),chosen=$("selectedBusinessId"),hint=$("businessMatchHint");if(!form||!input)return;let timer=0,sequence=0;const fields=form.elements;input.addEventListener("input",()=>{chosen.value="";hint.textContent="Select a suggestion to link an existing listing, or continue with a manual entry.";clearTimeout(timer);const term=input.value.trim(),request=++sequence;if(term.length<2){results.hidden=true;results.replaceChildren();return}results.hidden=false;results.innerHTML='<p class="muted">Searching BizHunt…</p>';timer=setTimeout(async()=>{let r=await db.from("businesses").select("id,name,category,location,latitude,longitude").ilike("name","%"+term.replace(/[%,()]/g,"")+"%").order("name").limit(8);if(request!==sequence)return;if(r.error){results.innerHTML='<p class="muted">Suggestions unavailable. You can still add this place manually.</p>';return}if(!r.data?.length){results.innerHTML='<p class="muted">No matching BizHunt businesses. Continue entering the place manually.</p>';return}results.replaceChildren();for(const b of r.data){let btn=document.createElement("button");btn.type="button";btn.className="business-suggestion";btn.setAttribute("role","option");btn.innerHTML='<strong>'+esc(b.name)+'</strong><small>'+esc([b.category,b.location].filter(Boolean).join(" · "))+'</small>';btn.onclick=()=>{input.value=b.name;chosen.value=b.id;fields.category.value=b.category||"";fields.address.value=b.location||"";fields.latitude.value=b.latitude??"";fields.longitude.value=b.longitude??"";results.hidden=true;results.replaceChildren();hint.textContent="✓ Linked to an existing BizHunt business. Location details filled automatically."};results.append(btn)}},240)});input.addEventListener("keydown",e=>{if(e.key==="Escape")results.hidden=true})}
function renderPlaces(){let admin=selected&&(selected.owner_id===user.id||myMember(selected.id)?.role==="admin"&&myMember(selected.id)?.status==="active");let wrap=$("placesList"),m=$("map");wrap.hidden=mode!=="list";m.hidden=mode!=="map";wrap.innerHTML=places.length?places.map(p=>'<article class="place"><div class="row"><strong>'+esc(p.name)+'</strong><span class="badge">'+(p.relationship==="partner"?(p.confirmed_by_merchant&&p.partnership_status==="approved"?"✓ Verified partner":p.partnership_status==="declined"?"Partnership declined":p.business_id?"Pending merchant approval":"Unlinked · not verified"):"Recommended")+'</span></div><p class="muted">'+esc(p.category)+' · '+esc(p.address||"Location not provided")+'</p>'+(p.perk_details?'<p>🎟️ '+esc(p.perk_details)+'</p>':'')+(p.latitude!=null&&p.longitude!=null?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.latitude+","+p.longitude)+'">Directions ↗</a>':'')+(admin?'<button class="btn alt" type="button" data-edit-place="'+esc(p.id)+'">Edit partner</button>':'')+'</article>').join(""):'<p class="muted">No partners yet. Community admins can add the first one.</p>';if(mode==="map"){let geo=places.filter(p=>p.latitude!=null&&p.longitude!=null);if(!window.L){m.textContent="Map library unavailable.";return}map=L.map("map").setView([15.15,120.59],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);let markers=geo.map(p=>L.marker([p.latitude,p.longitude]).addTo(map).bindPopup('<strong>'+esc(p.name)+'</strong><br>'+esc(p.address)));if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.2));else m.insertAdjacentHTML("afterend",'<p class="muted" id="noPins">No map pins yet. Add coordinates to community places.</p>');setTimeout(()=>map?.invalidateSize(),80)}}
async function loadRequests(){let c=selected;let r=await db.from("bizhunt_community_members").select("user_id,status").eq("community_id",c.id).eq("status","pending");let el=$("requests");if(!el)return;if(r.error){el.textContent=r.error.message;return}let requests=r.data||[];if(!requests.length){el.innerHTML='<p class="muted">No pending requests.</p>';return}let p=await db.from("community_profiles").select("user_id,display_name,username").in("user_id",requests.map(x=>x.user_id));let profiles=new Map((p.data||[]).map(x=>[x.user_id,x]));el.innerHTML=requests.map(x=>{let profile=profiles.get(x.user_id),name=profile?.display_name?.trim()||"BizHunt member",handle=profile?.username?.trim();return '<div class="row place"><div class="request-member"><strong>'+esc(name)+'</strong><span class="muted">'+(handle?'@'+esc(handle):'Username not set')+'</span></div><span class="request-actions"><button class="btn alt" data-approve="'+esc(x.user_id)+'">Approve</button> <button class="btn alt" data-decline="'+esc(x.user_id)+'">Decline</button></span></div>'}).join("");if(p.error){let warning=document.createElement("p");warning.className="muted";warning.textContent="Some member profiles could not be loaded: "+p.error.message;el.prepend(warning)}el.querySelectorAll("[data-approve],[data-decline]").forEach(b=>b.onclick=async()=>{b.disabled=true;let r=await db.rpc("bizhunt_manage_community_member",{p_id:c.id,p_user:b.dataset.approve||b.dataset.decline,p_approve:!!b.dataset.approve});if(r.error){alertMsg(r.error.message,true);b.disabled=false;return}loadRequests()})}
