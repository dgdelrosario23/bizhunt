 const f=$("offerForm");f.onsubmit=async e=>{e.preventDefault();let b=f.querySelector('button[type="submit"]');b.disabled=true;const data=new FormData(f);const expiry=data.get("expires_at");let res=await db.from("bizhunt_community_partner_offers").insert({place_id:data.get("place_id"),title:String(data.get("title")).trim(),offer_type:data.get("offer_type"),details:data.get("details")||"",redemption_instructions:data.get("redemption_instructions")||"",expires_at:expiry?new Date(expiry+"T23:59:59").toISOString():null,created_by:user.id});b.disabled=false;if(res.error){$("offerMessage").textContent="Unable to save. Apply Phase 39 SQL migration first. "+res.error.message;return}await openCommunity(selected.id);communityTab="partners";$("partnersTab").click()};
 document.querySelectorAll("#placesList [data-toggle-offer]").forEach(b=>b.onclick=async()=>{b.disabled=true;let res=await db.from("bizhunt_community_partner_offers").update({is_active:b.dataset.active!=="true",updated_at:new Date().toISOString()}).eq("id",b.dataset.toggleOffer);if(res.error)alertMsg(res.error.message,true);await openCommunity(selected.id);$("partnersTab").click()});
}
function renderPlaces(){
 let admin=selected&&(selected.owner_id===user.id||myMember(selected.id)?.role==="admin"&&myMember(selected.id)?.status==="active");
 let wrap=$("placesList"),m=$("map");wrap.hidden=mode!=="list";m.hidden=mode!=="map";
 wrap.innerHTML=places.length?places.map(p=>{
  let status=p.relationship==="partner"?(p.confirmed_by_merchant&&p.partnership_status==="approved"?"✓ Verified partner":p.partnership_status==="declined"?"Partnership declined":p.business_id?"Pending approval":"Unlinked · not verified"):"Recommended";
  let verified=p.relationship==="partner"&&p.confirmed_by_merchant&&p.partnership_status==="approved";
  let directions=p.latitude!=null&&p.longitude!=null?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.latitude+","+p.longitude):null;
  return '<article class="partner-card"><div class="partner-top"><div class="partner-symbol" aria-hidden="true">'+(p.category?.toLowerCase().includes("cafe")||p.category?.toLowerCase().includes("caf")?"☕":p.category?.toLowerCase().includes("restaurant")?"🍽️":"🏪")+'</div><div class="partner-heading"><h3>'+esc(p.name)+'</h3><p class="partner-meta">'+esc(p.category||"Business")+' <span aria-hidden="true">·</span> '+esc(p.address||"Location not provided")+'</p></div></div><div class="partner-status '+(verified?'is-verified':'')+'">'+esc(status)+'</div>'+(partnerOffers.filter(o=>o.place_id===p.id&&(admin||o.is_active&&(!o.starts_at||new Date(o.starts_at)<=new Date())&&(!o.expires_at||new Date(o.expires_at)>new Date()))).map(o=>'<div class="partner-perk"><span class="perk-label">'+esc(o.offer_type)+' · '+(o.is_active?'Active':'Paused')+'</span><span class="perk-offer">'+esc(o.title)+'</span>'+(o.details?'<p>'+esc(o.details)+'</p>':'')+(o.redemption_instructions?'<p><strong>How to claim:</strong> '+esc(o.redemption_instructions)+'</p>':'')+(o.expires_at?'<span class="perk-disclaimer">Expires '+esc(new Date(o.expires_at).toLocaleDateString())+'</span>':'')+'<span class="perk-disclaimer">'+(verified?'Verified partner':'Partner confirmation pending · Check with the business')+'</span>'+(admin?'<button type="button" class="btn alt" data-toggle-offer="'+esc(o.id)+'" data-active="'+o.is_active+'">'+(o.is_active?'Pause offer':'Activate offer')+'</button>':'')+'</div>').join(""))+(p.perk_details?'<div class="partner-perk"><span class="perk-label">🎁 Community perk / offer</span><span class="perk-offer">'+esc(p.perk_details)+'</span><span class="perk-disclaimer">'+(verified?'Confirmed partner · Check offer terms with the business before redeeming.':'Unverified offer · Ask the business to confirm availability before visiting.')+'</span></div>':'<div class="partner-empty-perk">🎁 No member perk announced yet. Check back for new offers.</div>')+'<div class="partner-actions">'+(directions?'<a class="partner-direction" target="_blank" rel="noopener" href="'+directions+'">↗ Directions</a>':'')+(admin?'<button class="btn alt partner-edit" type="button" data-edit-place="'+esc(p.id)+'">✎ Edit</button>':'')+'</div></article>'
 }).join(""):'<p class="muted">No partners yet. Community admins can add the first one.</p>';
 renderOfferManager();if(mode==="map"){let geo=places.filter(p=>p.latitude!=null&&p.longitude!=null);if(!window.L){m.textContent="Map library unavailable.";return}map=L.map("map").setView([15.15,120.59],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);let markers=geo.map(p=>L.marker([p.latitude,p.longitude]).addTo(map).bindPopup('<strong>'+esc(p.name)+'</strong><br>'+esc(p.address)));if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.2));else m.insertAdjacentHTML("afterend",'<p class="muted" id="noPins">No map pins yet. Add coordinates to community places.</p>');setTimeout(()=>map?.invalidateSize(),80)}
}
async function loadRequests(){let c=selected;let r=await db.from("bizhunt_community_members").select("user_id,status").eq("community_id",c.id).eq("status","pending");let el=$("requests");if(!el)return;if(r.error){el.textContent=r.error.message;return}let requests=r.data||[];if(!requests.length){el.innerHTML='<p class="muted">No pending requests.</p>';return}let p=await db.from("community_profiles").select("user_id,display_name,username").in("user_id",requests.map(x=>x.user_id));let profiles=new Map((p.data||[]).map(x=>[x.user_id,x]));el.innerHTML=requests.map(x=>{let profile=profiles.get(x.user_id),name=profile?.display_name?.trim()||"BizHunt member",handle=profile?.username?.trim();return '<div class="row place"><div class="request-member"><strong>'+esc(name)+'</strong><span class="muted">'+(handle?'@'+esc(handle):'Username not set')+'</span></div><span class="request-actions"><button class="btn alt" data-approve="'+esc(x.user_id)+'">Approve</button> <button class="btn alt" data-decline="'+esc(x.user_id)+'">Decline</button></span></div>'}).join("");if(p.error){let warning=document.createElement("p");warning.className="muted";warning.textContent="Some member profiles could not be loaded: "+p.error.message;el.prepend(warning)}el.querySelectorAll("[data-approve],[data-decline]").forEach(b=>b.onclick=async()=>{b.disabled=true;let r=await db.rpc("bizhunt_manage_community_member",{p_id:c.id,p_user:b.dataset.approve||b.dataset.decline,p_approve:!!b.dataset.approve});if(r.error){alertMsg(r.error.message,true);b.disabled=false;return}loadRequests()})}

window.addEventListener("error",e=>{const view=$("view");if(view&&view.textContent.includes("Loading communities"))view.innerHTML='<div class="card"><h2>Unable to open Communities</h2><p class="muted">'+esc(e.message||"An unexpected error occurred")+'</p><button class="btn" onclick="location.reload()">Try again</button></div>'});
window.addEventListener("unhandledrejection",e=>{const view=$("view");if(view&&view.textContent.includes("Loading communities"))view.innerHTML='<div class="card"><h2>Unable to load Communities</h2><p class="muted">'+esc(e.reason?.message||"Please refresh and try again")+'</p><button class="btn" onclick="location.reload()">Try again</button></div>'});
Promise.race([init(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Connection timed out. Check your connection and reload.")),12000))]).catch(e=>{$("view").innerHTML='<div class="card"><h2>Could not load Communities</h2><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>'});
