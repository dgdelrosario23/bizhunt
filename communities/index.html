<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Communities · BizHunt</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#24345e;font:15px system-ui,sans-serif}.app{max-width:560px;min-height:100vh;margin:auto;background:white;padding:0 18px 95px}.hero{margin:0 -18px;padding:22px 18px 26px;background:linear-gradient(120deg,#273880,#4169e1);color:white;border-radius:0 0 24px 24px}.hero a{color:#fff;text-decoration:none}.hero h1{margin:16px 0 4px;font-size:28px}.hero p{margin:0;opacity:.9}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:#fff;border:1px solid #e0e8f6;border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 5px 18px #2738800b}.btn{border:0;background:#273880;color:white;border-radius:12px;padding:11px 13px;font:700 14px system-ui;cursor:pointer}.btn.alt{background:#e8efff;color:#273880}.btn:disabled{opacity:.5}.muted{color:#77819b;font-size:13px}.pill{display:inline-block;background:#e8efff;color:#273880;border-radius:20px;padding:5px 9px;font-size:12px}.field{display:block;margin:13px 0;font-weight:650;font-size:13px}input,textarea,select{width:100%;display:block;margin-top:5px;padding:11px;border:1px solid #cbd6e9;border-radius:11px;font:inherit;background:#fff;color:#24345e}textarea{min-height:80px}h2{font-size:20px}h3{margin:0 0 6px}#map{height:340px;border-radius:16px;margin-top:14px}.tabs{display:flex;gap:8px;margin-top:15px}.tabs button{flex:1}.hidden,[hidden]{display:none!important}.notice{padding:11px;background:#e9f8ef;border-radius:12px;margin:12px 0}.error{background:#ffe8ed}.place{border-top:1px solid #edf0f7;padding:13px 0}.place:first-child{border:0}.badge{font-size:11px;color:#76541a;background:#fff3d4;border-radius:8px;padding:5px 7px}.footer{position:sticky;bottom:0;background:white;border-top:1px solid #e4eaf5;padding:12px;text-align:center;margin:25px -18px -95px}.footer a{color:#273880;text-decoration:none;font-weight:700}.link{color:#273880;cursor:pointer;text-decoration:underline}button:focus-visible{outline:3px solid #ffda59;outline-offset:2px}
</style></head><body><div class="app"><header class="hero"><a href="../app/">← Back to BizHunt</a><h1>👥 Communities</h1><p>Find your people. Discover places together.</p></header><div id="notice" role="status"></div><main id="view"><p>Loading communities…</p></main><footer class="footer"><a href="../app/">🔎 Discover</a> · <a href="../app/?section=profile">👤 Profile</a></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";let db,user,communities=[],members=[],selected=null,places=[],map=null,mode="list";
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function alertMsg(msg,bad=false){$("notice").innerHTML='<div class="notice '+(bad?"error":"")+'">'+esc(msg)+'</div>'}
function destroyMap(){if(map){map.remove();map=null}}
async function init(){if(!window.supabase){$("view").textContent="Unable to load account service";return}db=window.supabase.createClient(URL,KEY);let r=await db.auth.getUser();user=r.data.user;if(!user){$("view").innerHTML='<div class="card"><h2>Join the community</h2><p>Sign in to discover and create communities.</p><a href="../account/">Sign in or create account →</a></div>';return}await refresh();let id=new URLSearchParams(location.search).get("id");if(id&&communities.some(c=>c.id===id))openCommunity(id)}
async function refresh(){let [c,m]=await Promise.all([db.from("bizhunt_communities").select("*").order("created_at",{ascending:false}).limit(200),db.from("bizhunt_community_members").select("community_id,user_id,role,status").eq("user_id",user.id)]);if(c.error){$("view").innerHTML='<div class="card">Communities are not available yet. Apply the Phase 34 Supabase migration.<p class="muted">'+esc(c.error.message)+'</p></div>';return}communities=c.data||[];members=m.data||[];renderHome()}
function myMember(id){return members.find(m=>m.community_id===id)}
function renderHome(){destroyMap();selected=null;let mine=communities.filter(c=>myMember(c.id)?.status==="active"),others=communities.filter(c=>!mine.includes(c));$("view").innerHTML='<div class="row"><h2>Explore communities</h2><button class="btn" id="create">+ Create</button></div><p class="muted">Any member can create a community. No BizHunt approval needed.</p><input id="search" placeholder="Search communities by name, category or city" aria-label="Search communities"><div id="communityList"></div><div class="card hidden" id="createCard"><h3>Create community</h3><form id="createForm"><label class="field">Community name<input name="name" maxlength="80" minlength="3" required></label><label class="field">Description<textarea name="description" maxlength="1000"></textarea></label><label class="field">Category<select name="category"><option>Sports & fitness</option><option>Schools & organizations</option><option>Travel & hobbies</option><option>Nonprofit & volunteer</option><option>Neighborhood</option><option>Professional</option><option>Other</option></select></label><label class="field">City / area<input name="city" placeholder="Angeles City"></label><label class="field">Visibility<select name="visibility"><option value="public">Public — discoverable</option><option value="private">Private — invite link only</option></select></label><label class="field">Membership<select name="join_policy"><option value="open">Open joining (public only)</option><option value="approval">Request admin approval</option></select></label><button class="btn" type="submit">Create community</button></form></div>';function list(q=""){let match=c=>[c.name,c.category,c.city].join(" ").toLowerCase().includes(q.toLowerCase());let card=c=>'<article class="card"><div class="row"><h3>'+esc(c.name)+'</h3><span class="pill">'+esc(c.visibility)+'</span></div><p class="muted">'+esc(c.category)+' · '+esc(c.city||"Anywhere")+'</p><p>'+esc(c.description||"Discover this community and its favorite places.")+'</p><button class="btn alt" data-open="'+esc(c.id)+'">View community →</button></article>';let a=mine.filter(match),b=others.filter(match);$("communityList").innerHTML=(a.length?'<h2>My communities</h2>'+a.map(card).join(""):'')+(b.length?'<h2>Discover</h2>'+b.map(card).join(""):'')+(!a.length&&!b.length?'<p class="muted">No matching communities yet. Create the first one!</p>':'');$("communityList").querySelectorAll("[data-open]").forEach(btn=>btn.onclick=()=>openCommunity(btn.dataset.open))}list();$("search").oninput=e=>list(e.target.value);$("create").onclick=()=>{$("createCard").classList.toggle("hidden");$("createCard").scrollIntoView({behavior:"smooth"})};$("createForm").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),visibility=f.get("visibility"),joinPolicy=visibility==="private"?"approval":f.get("join_policy");let r=await db.rpc("bizhunt_create_community",{p_name:f.get("name"),p_description:f.get("description"),p_category:f.get("category"),p_city:f.get("city"),p_visibility:visibility,p_join_policy:joinPolicy});if(r.error)return alertMsg(r.error.message,true);await refresh();openCommunity(r.data);alertMsg("Community created!")}}
async function openCommunity(id){destroyMap();selected=communities.find(c=>c.id===id);if(!selected)return renderHome();history.replaceState(null,"",location.pathname+"?id="+encodeURIComponent(id));let r=await db.from("bizhunt_community_places").select("*").eq("community_id",id).order("created_at",{ascending:false});places=r.data||[];renderCommunity()}
function renderCommunity(){let c=selected,m=myMember(c.id),admin=c.owner_id===user.id||m?.role==="admin"&&m.status==="active",active=m?.status==="active";let share=location.origin+location.pathname+"?id="+encodeURIComponent(c.id);$("view").innerHTML='<button class="btn alt" id="back">← All communities</button><div class="card"><div class="row"><h2>'+esc(c.name)+'</h2><span class="pill">'+esc(c.visibility)+'</span></div><p class="muted">'+esc(c.category)+' · '+esc(c.city||"Anywhere")+'</p><p>'+esc(c.description)+'</p><div class="row"><span class="pill">'+(active?"✓ Member":m?.status==="pending"?"⏳ Request pending":"Not a member")+'</span><button class="btn alt" id="share">Copy invite link</button></div>'+(!m?'<button class="btn" id="join" style="margin-top:12px">Join community</button>':'')+'</div><div class="row"><h2>📍 Community places</h2><span class="pill">'+places.length+' listed</span></div><p class="muted">Recommendations are community-curated. Partner perks are not verified by BizHunt unless explicitly confirmed by the merchant.</p><div class="tabs"><button class="btn '+(mode==="list"?"":"alt")+'" id="listBtn">☷ List</button><button class="btn '+(mode==="map"?"":"alt")+'" id="mapBtn">🗺 Map</button></div><div id="placesList"></div><div id="map" hidden></div>'+(admin?'<div class="card"><h3>Add a place</h3><p class="muted">List a favorite business or community partner. Unverified offers must be confirmed directly with the merchant.</p><form id="placeForm"><label class="field">Business name<input name="name" required maxlength="120"></label><label class="field">Category<input name="category" placeholder="Café, running store, gym"></label><label class="field">Address<input name="address" placeholder="Street, city"></label><label class="field">Type<select name="relationship"><option value="recommended">Community recommendation</option><option value="partner">Community partner (unverified)</option></select></label><label class="field">Perk details (optional)<textarea name="perk_details" maxlength="500" placeholder="Subject to confirmation by the business"></textarea></label><div class="row"><label class="field">Latitude (optional)<input name="latitude" type="number" min="-90" max="90" step="any"></label><label class="field">Longitude (optional)<input name="longitude" type="number" min="-180" max="180" step="any"></label></div><p class="muted">Coordinates enable map pins. You can get them from a map location.</p><button class="btn" type="submit">Add place</button></form></div><div class="card"><h3>Membership requests</h3><div id="requests">Loading…</div></div>':'');$("back").onclick=()=>{history.replaceState(null,"",location.pathname);renderHome()};$("share").onclick=()=>navigator.clipboard.writeText(share).then(()=>alertMsg("Invite link copied!")).catch(()=>alertMsg("Copy failed",true));if($("join"))$("join").onclick=async()=>{let r=await db.rpc("bizhunt_join_community",{p_id:c.id});if(r.error)return alertMsg(r.error.message,true);alertMsg(r.data);await refresh();openCommunity(c.id)};$("listBtn").onclick=()=>{mode="list";renderCommunity()};$("mapBtn").onclick=()=>{mode="map";renderCommunity()};renderPlaces();if(admin){$("placeForm").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),lat=f.get("latitude"),lon=f.get("longitude");let r=await db.from("bizhunt_community_places").insert({community_id:c.id,created_by:user.id,name:String(f.get("name")).trim(),category:f.get("category")||"Other",address:f.get("address")||"",relationship:f.get("relationship"),perk_details:f.get("perk_details")||"",latitude:lat===""?null:Number(lat),longitude:lon===""?null:Number(lon)});if(r.error)return alertMsg(r.error.message,true);alertMsg("Place added.");openCommunity(c.id)};loadRequests()}}
function renderPlaces(){let wrap=$("placesList"),m=$("map");wrap.hidden=mode!=="list";m.hidden=mode!=="map";wrap.innerHTML=places.length?places.map(p=>'<article class="place"><div class="row"><strong>'+esc(p.name)+'</strong><span class="badge">'+(p.relationship==="partner"?"Partner · unverified":"Recommended")+'</span></div><p class="muted">'+esc(p.category)+' · '+esc(p.address||"Location not provided")+'</p>'+(p.perk_details?'<p>🎟️ '+esc(p.perk_details)+'</p>':'')+(p.latitude!=null&&p.longitude!=null?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.latitude+","+p.longitude)+'">Directions ↗</a>':'')+'</article>').join(""):'<p class="muted">No places yet. Community admins can add the first one.</p>';if(mode==="map"){let geo=places.filter(p=>p.latitude!=null&&p.longitude!=null);if(!window.L){m.textContent="Map library unavailable.";return}map=L.map("map").setView([15.15,120.59],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);let markers=geo.map(p=>L.marker([p.latitude,p.longitude]).addTo(map).bindPopup('<strong>'+esc(p.name)+'</strong><br>'+esc(p.address)));if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.2));else m.insertAdjacentHTML("afterend",'<p class="muted" id="noPins">No map pins yet. Add coordinates to community places.</p>');setTimeout(()=>map?.invalidateSize(),80)}}
async function loadRequests(){let c=selected;let r=await db.from("bizhunt_community_members").select("user_id,status").eq("community_id",c.id).eq("status","pending");let el=$("requests");if(!el)return;el.innerHTML=r.error?esc(r.error.message):r.data.length?r.data.map(x=>'<div class="row place"><span class="muted">'+esc(x.user_id.slice(0,8))+'…</span><span><button class="btn alt" data-approve="'+esc(x.user_id)+'">Approve</button> <button class="btn alt" data-decline="'+esc(x.user_id)+'">Decline</button></span></div>').join(""):'<p class="muted">No pending requests.</p>';el.querySelectorAll("[data-approve],[data-decline]").forEach(b=>b.onclick=async()=>{let r=await db.rpc("bizhunt_manage_community_member",{p_id:c.id,p_user:b.dataset.approve||b.dataset.decline,p_approve:!!b.dataset.approve});if(r.error)return alertMsg(r.error.message,true);loadRequests()})}
init();
</script></body></html>
