<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Community ID · BizHunt</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#24345e;font:15px system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding:24px}.header{background:linear-gradient(125deg,#273880,#4169e1);color:white;padding:22px;border-radius:20px}.card{padding:22px;border:1px solid #dfe7f5;border-radius:18px;margin:18px 0}.good{background:#e2f7eb;color:#176b43}.bad{background:#ffebed;color:#9c274b}.btn{display:inline-block;background:#273880;color:white;padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:700}p{line-height:1.5}</style></head><body><main class="app"><div class="header"><a href="../" style="color:white">← Communities</a><h1>🪪 Community ID verification</h1><p>For registered BizHunt merchants</p></div><section class="card" id="result" aria-live="polite">Checking membership…</section><a class="btn" href="../hub/">Open Merchant Hub</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://cjvcqdlwadmuktxtdxcz.supabase.co","sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx");
const el=document.getElementById("result");const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{try{const token=new URLSearchParams(location.search).get("token");if(!token||!/^[0-9a-f-]{36}$/i.test(token)){el.className="card bad";el.textContent="Invalid verification link.";return}const u=await db.auth.getUser();if(!u.data.user){el.className="card bad";el.innerHTML='<h2>Merchant sign-in required</h2><p>Sign in with your BizHunt merchant account, then reopen or rescan the QR code.</p><a href="../../account/">Sign in →</a>';return}const r=await db.rpc("bizhunt_verify_community_id",{p_token:token});if(r.error){el.className="card bad";el.innerHTML='<h2>Verification unavailable</h2><p>'+esc(r.error.message)+'</p>';return}const v=r.data?.[0];if(!v||!v.valid){el.className="card bad";el.innerHTML='<h2>✕ Invalid or expired ID</h2><p>Ask the member to generate a fresh QR from Wallet.</p>';return}el.className="card good";el.innerHTML='<h2>✓ Active membership verified</h2><p><strong>Community:</strong> '+esc(v.community_name)+'</p><p><strong>Member:</strong> '+esc(v.member_name)+'</p><p><strong>Checked:</strong> '+esc(new Date(v.verified_at).toLocaleString())+'</p><p>Check your partnership terms before applying any perk.</p>'}catch(e){el.className="card bad";el.textContent="Verification failed: "+e.message}})();
</script></body></html>
