<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizHunt • QR Loyalty Beta</title><style>*{box-sizing:border-box}body{margin:0;background:#f2eeff;color:#30234e;font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;min-height:100vh;margin:auto;background:#fcfaff;padding-bottom:90px}.hero{background:linear-gradient(130deg,#6540dc,#ae6af0);color:white;padding:22px;border-radius:0 0 25px 25px}.logo{font-weight:900;font-size:26px}.logo b{color:#ffdc5c}h1{font-size:25px;margin:12px 0 4px}main{padding:17px}.card{background:#fff;border:1px solid #e8e0f5;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 4px 14px #51408008}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.muted{color:#796f88;font-size:13px}.pill{background:#efe9ff;color:#6a43d4;border-radius:40px;padding:6px 9px;font-size:12px;font-weight:700}.btn{border:0;border-radius:12px;padding:11px 14px;background:#7147e5;color:white;font-weight:750}.alt{background:#ede7ff;color:#6441ca}.green{background:#119876}.btn:disabled{opacity:.5}label{display:block;margin:12px 0;font-size:13px;font-weight:700}input,select{display:block;width:100%;border:1px solid #d9ceeb;border-radius:11px;padding:12px;margin-top:5px;background:white;color:#30234e}.notice{background:#fff3d9;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}.error{background:#ffe7ec;color:#9c2148}.ok{background:#e1f7eb;color:#13683d}.stamp{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.stamp span{height:38px;width:38px;display:grid;place-items:center;border:2px dashed #bea9ef;border-radius:50%}.stamp .filled{background:#7147e5;color:white;border-color:#7147e5}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:white;border-top:1px solid #e7dff5;display:flex;justify-content:space-around;padding:10px 3px 15px}nav button{background:none;border:0;color:#857b93;font-size:11px;display:grid;gap:4px;place-items:center}nav button.active{color:#7147e5;font-weight:850}nav span{font-size:21px}.qr{display:flex;justify-content:center;padding:15px;background:white;border-radius:14px;min-height:240px;align-items:center}.code{overflow-wrap:anywhere;font:12px ui-monospace,monospace;background:#f4f0ff;padding:10px;border-radius:10px;user-select:all}.actions{display:flex;flex-wrap:wrap;gap:8px}video{width:100%;border-radius:12px;background:#1b1824;max-height:300px}a{color:#6844d0}.hero a{color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #ffd05d;outline-offset:2px}</style></head><body><div class="app"><header class="hero"><div class="row"><div class="logo">Biz<b>Hunt</b> ✦</div><a href="../account/">Accounts ↗</a></div><h1>QR Loyalty Beta 🎁</h1><p>Collect stamps. Unlock local rewards.</p></header><main><div id="notice" role="status"></div><div id="content">Connecting…</div></main></div><nav id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const PROJECT_URL="https://cjvcqdlwadmuktxtdxcz.supabase.co",PUBLISHABLE_KEY="sb_publishable_V1lSJqiAyQtSgo0T3gY1Cg_tU4xYCsx";const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let db,user=null,tab="discover",businesses=[],campaigns=[],stamps=[],redemptions=[],myBusinesses=[],code=null,expires=null,scanStream=null,scanActive=false,scanTimer=null;function info(s,error=false){$("notice").innerHTML='<div class="notice '+(error?"error":"ok")+'">'+esc(s)+'</div>'}function clear(){ $("notice").innerHTML="" }function stopCamera(){scanActive=false;if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}function nav(){let t=[["discover","🔎","Discover"],["wallet","🪪","Wallet"],["qr","▦","My QR"],["merchant","🏪","Merchant"],["analytics","📊","Analytics"]];$("nav").innerHTML=t.map(([id,ico,label])=>'<button class="'+(tab===id?"active":"")+'" data-tab="'+id+'"><span>'+ico+'</span>'+label+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{stopCamera();tab=b.dataset.tab;clear();render()})}async function init(){if(!window.supabase){$("content").textContent="Could not load Supabase library. Check connection.";return}db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);let r=await db.auth.getUser();user=r.data?.user||null;db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(()=>load(),0)});await load()}async function load(){if(!db)return;if(!user){stopCamera();render();return}let [b,c,s,r,m]=await Promise.all([db.from("businesses").select("id,name,category,location,owner_id").order("created_at",{ascending:false}).limit(100),db.from("campaigns").select("id,business_id,name,reward,stamp_goal,active").eq("active",true).limit(200),db.from("stamp_events").select("id,campaign_id,customer_id,merchant_id,created_at").limit(1000),db.from("reward_redemptions").select("id,campaign_id,customer_id,merchant_id,created_at").limit(1000),db.from("businesses").select("id,name").eq("owner_id",user.id)]);let err=[b,c,s,r,m].find(x=>x.error);if(err)info(err.error.message+" — Run the Phase 4 SQL migration if not applied.",true);businesses=b.data||[];campaigns=c.data||[];stamps=s.data||[];redemptions=r.data||[];myBusinesses=m.data||[];render()}function balance(c){let a=stamps.filter(x=>x.customer_id===user.id&&x.campaign_id===c.id).length,b=redemptions.filter(x=>x.customer_id===user.id&&x.campaign_id===c.id).length;return Math.max(0,a-b*c.stamp_goal)}function stampsView(n,goal){return '<div class="stamp">'+Array.from({length:goal},(_,i)=>'<span class="'+(i<n?"filled":"")+'">'+(i<n?"✓":"☆")+'</span>').join("")+'</div>'}function campaignCard(c,wallet=false){let b=businesses.find(x=>x.id===c.business_id),n=balance(c);return '<div class="card"><div class="row"><strong>'+esc(b?.name||"Local business")+'</strong><span class="pill">'+n+'/'+c.stamp_goal+'</span></div><h3>'+esc(c.name)+'</h3><p>🎁 '+esc(c.reward)+'</p>'+stampsView(Math.min(n,c.stamp_goal),c.stamp_goal)+(n>=c.stamp_goal?'<div class="notice ok">Reward ready! Show a fresh QR code to the merchant for redemption.</div>':wallet?'<p class="muted">Visit again to collect more stamps.</p>':'')+'</div>'}function render(){nav();if(!user){$("content").innerHTML='<h2>Sign in to collect stamps</h2><div class="card"><p>BizHunt QR loyalty uses your verified Supabase account.</p><a href="../account/">Open signup / login →</a></div>';return}let out='<div class="row"><span class="muted">'+esc(user.email)+'</span><button class="btn alt" id="logout">Sign out</button></div><div class="notice">🧪 Pilot beta. Merchant approval is required; a QR code alone does not prove a purchase.</div>';if(tab==="discover"){out+='<h2>Local loyalty campaigns 💜</h2>'+(campaigns.length?campaigns.map(c=>campaignCard(c)).join(""):'<div class="card">No active campaigns yet. Create one from the <a href="../account/">Merchant workspace</a>.</div>')}else if(tab==="wallet"){out+='<div class="row"><h2>My loyalty wallet 🪪</h2><button class="btn alt" id="reload">Refresh</button></div>'+(campaigns.length?campaigns.map(c=>campaignCard(c,true)).join(""):'<div class="card">Your loyalty wallet will appear here once merchants publish campaigns.</div>')+'<div class="card"><h3>Activity</h3><p>'+stamps.filter(x=>x.customer_id===user.id).length+' total stamps issued · '+redemptions.filter(x=>x.customer_id===user.id).length+' rewards redeemed</p></div>'}else if(tab==="qr"){out+='<h2>My temporary QR ▦</h2><p class="muted">Generate a single-use code and show it to the merchant. It expires in 90 seconds.</p><div class="card"><div id="qrbox" class="qr">'+(code?"":"Generate a code to begin")+'</div><div id="codebox">'+(code?'<p class="code">'+esc(code)+'</p><p class="muted">Expires at '+esc(new Date(expires).toLocaleTimeString())+'</p>':'')+'</div><button class="btn" id="generate">Generate fresh QR</button></div>'}else if(tab==="merchant"){let mine=campaigns.filter(c=>myBusinesses.some(b=>b.id===c.business_id));out+='<h2>Merchant stamp station 🏪</h2><p class="muted">Only owners of the selected business can approve transactions.</p>'+(mine.length?'<div class="card"><label>Choose your campaign<select id="campaignSelect">'+mine.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+' — '+esc(myBusinesses.find(b=>b.id===c.business_id)?.name)+'</option>').join("")+'</select></label><label>Customer QR token<input id="token" placeholder="Scan QR or paste temporary code" autocomplete="off" spellcheck="false"></label><div class="actions"><button class="btn alt" id="camera">📷 Scan camera</button><button class="btn" id="stamp">✓ Approve stamp</button><button class="btn green" id="redeem">🎁 Redeem reward</button></div><div id="cameraBox"></div></div>':'<div class="card">No active campaigns owned by your account. <a href="../account/">Create a business and campaign first.</a></div>')}else{let owned=new Set(myBusinesses.map(x=>x.id)),ids=new Set(campaigns.filter(c=>owned.has(c.business_id)).map(c=>c.id)),ownS=stamps.filter(x=>ids.has(x.campaign_id)&&x.merchant_id===user.id),ownR=redemptions.filter(x=>ids.has(x.campaign_id)&&x.merchant_id===user.id);out+='<div class="row"><h2>Merchant analytics 📊</h2><button class="btn alt" id="reload">Refresh</button></div><div class="card"><p class="muted">Your merchant account's transactions (up to 1,000 recent records per type)</p><h3>'+ownS.length+' stamps issued</h3><h3>'+ownR.length+' rewards redeemed</h3><h3>'+new Set([...ownS,...ownR].map(x=>x.customer_id)).size+' unique customers served</h3></div>'+myBusinesses.map(b=>'<div class="card"><strong>'+esc(b.name)+'</strong>'+campaigns.filter(c=>c.business_id===b.id).map(c=>'<p>'+esc(c.name)+': '+stamps.filter(x=>x.campaign_id===c.id&&x.merchant_id===user.id).length+' stamps / '+redemptions.filter(x=>x.campaign_id===c.id&&x.merchant_id===user.id).length+' rewards</p>').join("")+'</div>').join("")} $("content").innerHTML=out;$("logout").onclick=async()=>{stopCamera();await db.auth.signOut();user=null;code=null;render()};if($("reload"))$("reload").onclick=load;if($("generate")){$("generate").onclick=generate;if(code){if(new Date(expires)<=new Date()){code=null;expires=null;render()}else if(window.QRCode){new QRCode($("qrbox"),{text:code,width:205,height:205,correctLevel:QRCode.CorrectLevel.M})}else{$("qrbox").textContent="QR library unavailable. Merchant can paste the code below."}}}if($("stamp"))$("stamp").onclick=()=>process("stamp");if($("redeem"))$("redeem").onclick=()=>process("redeem");if($("camera"))$("camera").onclick=startCamera}async function generate(){let btn=$("generate");btn.disabled=true;let r=await db.rpc("create_visit_token");btn.disabled=false;if(r.error){info(r.error.message+" — Has the Phase 4 migration been run?",true);return}let v=r.data?.[0];if(!v){info("No token returned",true);return}code=v.token;expires=v.expires_at;clear();render()}async function process(action){let token=$("token")?.value.trim().toLowerCase(),campaign=$("campaignSelect")?.value;if(!token||!campaign){info("Select a campaign and scan or paste a code.",true);return}if(!confirm(action==="stamp"?"Confirm a qualifying customer visit and issue one stamp?":"Confirm reward was provided and redeem the customer's stamps?"))return;stopCamera();let r=await db.rpc("process_visit_token",{p_token:token,p_campaign:campaign,p_action:action});if(r.error){info(r.error.message,true);return}info((action==="stamp"?"Stamp issued":"Reward redeemed")+" successfully. Customer can refresh their wallet.");await load()}async function startCamera(){if(scanActive){stopCamera();$("cameraBox").innerHTML="";return}if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){info("Camera QR scanning is not supported here. Paste the customer's temporary code instead.",true);return}try{let detector=new BarcodeDetector({formats:["qr_code"]});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("cameraBox").innerHTML='<video id="preview" autoplay playsinline muted></video><p class="muted">Point the camera at the customer QR code.</p>';let video=$("preview");video.srcObject=scanStream;await video.play();scanActive=true;const scan=async()=>{if(!scanActive)return;try{let codes=await detector.detect(video);if(codes.length){let value=codes[0].rawValue;if(/^[0-9a-f]{48}$/.test(value)){$("token").value=value;stopCamera();$("cameraBox").innerHTML='<p class="notice ok">Code scanned. Choose stamp or redeem to approve.</p>';return}}}catch{}scanTimer=setTimeout(scan,250)};scan()}catch(err){stopCamera();info("Camera unavailable: "+err.message+". Paste the code instead.",true)}}init().catch(err=>info(err.message,true));
</script></body></html>
